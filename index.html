/* ===================== SCHÉMAS (dessinés en SVG, s'adaptent au thème clair/sombre) ===================== */
const L=(l,fr,en)=>l=='fr'?fr:en;
const TX='style="fill:var(--txt)"', MU='style="fill:var(--muted)"';
const GR='var(--green)',RD='var(--red)',GD='var(--gold)',PU='#8b5cf6',BL='#3b82f6',OR='#f59e0b';

/* Générateur de bougies déterministe à partir d'un tracé de prix */
function series(seed,pts,vol){let s=seed;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 const cl=[];for(let k=0;k<pts.length-1;k++){const [i0,p0]=pts[k],[i1,p1]=pts[k+1];for(let i=i0;i<i1;i++)cl.push(p0+(p1-p0)*(i-i0)/(i1-i0)+(r()-.5)*vol)}cl.push(pts[pts.length-1][1]);
 let prev=cl[0]-(r()-.5)*vol;return cl.map(c=>{const o=prev;prev=c;return [o,Math.max(o,c)+r()*vol*.6,Math.min(o,c)-r()*vol*.6,c]})}
function sma(c,n){return c.map((_,i)=>i<n-1?null:c.slice(i-n+1,i+1).reduce((a,x)=>a+x[3],0)/n)}

/* Graphique complet : bougies + lignes + zones + notes */
function chart(o){
 const W=760,H=o.h||360,pr=78,pt=16,pb=22,cs=o.c,n=cs.length,mn=o.min,mx=o.max,cw=(W-pr-16)/n;
 const X=i=>12+cw*i+cw/2, Y=p=>pt+(mx-p)/(mx-mn)*(H-pt-pb), f=v=>v.toFixed(o.d??2);
 let g='';
 const st=o.step||(mx-mn)/6;for(let p=Math.ceil(mn/st)*st;p<=mx;p+=st)g+=`<line x1="0" x2="${W-pr}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--grid)"/><text x="${W-pr+8}" y="${Y(p)+4}" font-size="11" ${MU}>${f(p)}</text>`;
 (o.zones||[]).forEach(z=>{g+=`<rect x="0" width="${W-pr}" y="${Y(z.p2)}" height="${Y(z.p1)-Y(z.p2)}" fill="${z.c}" opacity=".16"/>`;if(z.t)g+=`<text x="8" y="${Y(z.p2)-5}" font-size="12" font-weight="700" fill="${z.c}">${z.t}</text>`});
 cs.forEach(([op,hi,lo,cl],i)=>{const c=cl>=op?GR:RD,x=X(i);g+=`<line x1="${x}" x2="${x}" y1="${Y(hi)}" y2="${Y(lo)}" stroke="${c}" stroke-width="1.4"/><rect x="${x-cw*.32}" width="${cw*.64}" y="${Y(Math.max(op,cl))}" height="${Math.max(1.5,Math.abs(Y(op)-Y(cl)))}" fill="${c}"/>`});
 (o.ma||[]).forEach(m=>{const v=sma(cs,m.n);g+=`<polyline fill="none" stroke="${m.c}" stroke-width="2.5" points="${v.map((p,i)=>p==null?'':X(i)+','+Y(p)).join(' ')}"/>`});
 (o.lines||[]).forEach(l=>{if(l.h!=null){g+=`<line x1="${l.from!=null?X(l.from):0}" x2="${W-pr}" y1="${Y(l.h)}" y2="${Y(l.h)}" stroke="${l.c}" stroke-width="2" ${l.dash?'stroke-dasharray="6 5"':''}/>`;if(l.t)g+=`<rect x="${W-pr+2}" y="${Y(l.h)-10}" width="${pr-4}" height="20" rx="5" fill="${l.c}"/><text x="${W-pr/2}" y="${Y(l.h)+4}" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">${l.t}</text>`}
  else g+=`<line x1="${X(l.a[0])}" y1="${Y(l.a[1])}" x2="${X(l.b[0])}" y2="${Y(l.b[1])}" stroke="${l.c}" stroke-width="2.5" ${l.dash?'stroke-dasharray="6 5"':''}/>`});
 (o.tags||[]).forEach(t=>g+=`<text x="${X(t.i)}" y="${Y(t.p)+(t.up?-9:18)}" font-size="12" font-weight="800" text-anchor="middle" fill="${t.c||'var(--gold2)'}">${t.t}</text>`);
 (o.box||[]).forEach(b=>g+=`<rect x="${X(b.i1)}" width="${X(b.i2)-X(b.i1)}" y="${Y(b.p2)}" height="${Y(b.p1)-Y(b.p2)}" fill="${b.c}" opacity=".22" stroke="${b.c}"/>${b.t?`<text x="${X(b.i1)+6}" y="${Y(b.p2)+15}" font-size="11.5" font-weight="800" fill="${b.c}">${b.t}</text>`:''}`);
 (o.dots||[]).forEach(d=>g+=`<circle cx="${X(d[0])}" cy="${Y(d[1])}" r="5" style="fill:var(--strong)"/>`);
 (o.notes||[]).forEach(t=>{const x=X(t.i),y=Y(t.p),bx=t.bx,by=t.by,w=t.w||190;g+=`<line x1="${x}" y1="${y}" x2="${bx+w/2}" y2="${by}" style="stroke:var(--strong)" stroke-width="1.3"/><rect x="${bx}" y="${by}" width="${w}" height="${t.h||40}" rx="7" style="fill:var(--card);stroke:var(--line)"/><text x="${bx+10}" y="${by+17}" font-size="12" font-weight="700" ${TX}>${t.t}</text>${t.s?`<text x="${bx+10}" y="${by+32}" font-size="11" ${MU}>${t.s}</text>`:''}`});
 if(o.title)g+=`<rect x="10" y="10" width="${o.lw||250}" height="${o.lh||(30+18*(o.leg||[]).length)}" rx="8" style="fill:var(--card);stroke:var(--line)"/><text x="22" y="32" font-size="15" font-weight="800" ${TX}>${o.title}</text>`+(o.leg||[]).map((t,k)=>`<text x="22" y="${54+18*k}" font-size="12" ${t[1]?`fill="${t[1]}" font-weight="700"`:MU}>${t[0]}</text>`).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" font-family="Arial,sans-serif">${g}</svg>`;
}

/* Petites illustrations de figures de chandeliers : [o,h,l,c] sur une échelle 0–100 */
function mini(c){const n=c.length,lo=Math.min(...c.map(k=>k[2])),hi=Math.max(...c.map(k=>k[1])),Y=v=>92-(v-lo)/(hi-lo)*84,w=26,x0=60-n*w/2;return `<svg viewBox="0 0 120 100">${c.map(([o,h,l,cl],i)=>{const x=x0+w*i+w/2,col=cl>=o?GR:RD;return `<line x1="${x}" x2="${x}" y1="${Y(h)}" y2="${Y(l)}" stroke="${col}" stroke-width="2.5"/><rect x="${x-8}" width="16" y="${Y(Math.max(o,cl))}" height="${Math.max(2.5,Math.abs(Y(o)-Y(cl)))}" fill="${col}"/>`}).join('')}</svg>`}
function pats(l,list){return `<div class="pats">${list.map(p=>`<div class="pat">${mini(p[2])}<b>${p[0]}</b><i>${L(l,p[1][0],p[1][1])}</i></div>`).join('')}</div>`}

/* Schéma « comment fonctionne un trade sur une paire » */
function pairBox(l,b,q){return `<div class="pair"><div class="sym"><span>${b}</span>/<span>${q}</span><small>${L(l,'1ʳᵉ devise (base) · 2ᵉ devise (cotation)','1st currency (base) · 2nd currency (quote)')}</small></div>
<div class="side buy"><b>▲ ${L(l,'Acheter la paire (BUY)','Buy the pair')}</b><strong>${L(l,`Tu achètes ${b} et vends ${q}`,`You buy ${b} and sell ${q}`)}</strong><p>${L(l,`Tu penses que ${b} va se renforcer face à ${q}.`,`You expect ${b} to strengthen against ${q}.`)}</p></div>
<div class="side sell"><b>▼ ${L(l,'Vendre la paire (SELL)','Sell the pair')}</b><strong>${L(l,`Tu vends ${b} et achètes ${q}`,`You sell ${b} and buy ${q}`)}</strong><p>${L(l,`Tu penses que ${b} va s'affaiblir face à ${q}.`,`You expect ${b} to weaken against ${q}.`)}</p></div></div>`}

/* Anatomie d'une bougie */
function candleSVG(l){const o=L(l,['Plus haut','Clôture','Ouverture','Plus bas','Corps','Mèche'],['High','Close','Open','Low','Body','Wick']);
return `<svg class="chart" viewBox="0 0 420 220" font-family="Arial"><g font-size="12" ${TX}>
<line x1="120" y1="20" x2="120" y2="200" stroke="${GR}" stroke-width="3"/><rect x="100" y="60" width="40" height="90" fill="${GR}"/>
<line x1="300" y1="20" x2="300" y2="200" stroke="${RD}" stroke-width="3"/><rect x="280" y="60" width="40" height="90" fill="${RD}"/>
<text x="150" y="25">${o[0]}</text><text x="150" y="64">${o[1]}</text><text x="150" y="152">${o[2]}</text><text x="150" y="200">${o[3]}</text>
<text x="330" y="25">${o[0]}</text><text x="330" y="64">${o[2]}</text><text x="330" y="152">${o[1]}</text><text x="330" y="200">${o[3]}</text></g>
<g font-size="12" font-weight="700" style="fill:var(--gold2)"><text x="20" y="110">${o[4]} →</text><text x="20" y="40">${o[5]} →</text></g></svg>`}

{t:{fr:"C'est quoi le trading Forex ?",en:"What is Forex trading?"},s:{fr:"Comment fonctionne le marché des devises et les risques à connaître.",en:"How the currency market works and the risks to know."},
b:{fr:`<p>Le <b>Forex</b> (de l'anglais <i>Foreign Exchange</i>, « échange de devises ») est le marché où l'on échange une monnaie contre une autre. Quand tu changes des francs CFA en euros pour voyager, tu fais une opération de change. Le Forex, c'est la même chose… à l'échelle mondiale.</p>
<h2>Trader, c'est quoi ?</h2>
<p>Le trader ne change pas de l'argent pour voyager : il cherche à <b>profiter des variations de prix</b>. Il achète une devise s'il pense qu'elle va prendre de la valeur, ou la vend s'il pense qu'elle va en perdre.</p>
<div class="box ex"><b class="t">Exemple simple</b>Tu achètes de l'euro contre du dollar quand 1 € = 1,08 $. Quelques heures plus tard, 1 € = 1,09 $. L'euro a pris de la valeur : tu revends avec un gain.</div>
<h2>Un marché sans bourse centrale</h2>
<p>Contrairement aux actions, le Forex n'a pas de bâtiment central. Les échanges se font <b>électroniquement</b> entre banques, institutions et brokers du monde entier. On dit que c'est un marché « de gré à gré » (OTC).</p>
<div class="box warn"><b class="t">Le risque dès le départ</b>Les prix peuvent aller contre toi. Avec l'effet de levier (chapitre 8), une petite variation peut causer une grosse perte. On apprend d'abord, on pratique en démo, puis on trade petit.</div>`,
en:`<p><b>Forex</b> (short for <i>Foreign Exchange</i>) is the market where one currency is exchanged for another. When you swap money before a trip, you make a currency exchange. Forex is the same thing… on a global scale.</p>
<h2>What is trading?</h2>
<p>A trader doesn't exchange money to travel: they try to <b>profit from price changes</b>. They buy a currency if they think it will gain value, or sell it if they think it will lose value.</p>
<div class="box ex"><b class="t">Simple example</b>You buy euros against dollars when €1 = $1.08. A few hours later €1 = $1.09. The euro gained value: you sell back at a profit.</div>
<h2>A market with no central exchange</h2>
<p>Unlike stocks, Forex has no central building. Trading happens <b>electronically</b> between banks, institutions and brokers worldwide. It's called an "over-the-counter" (OTC) market.</p>
<div class="box warn"><b class="t">Risk from day one</b>Prices can move against you. With leverage (chapter 8), a small move can cause a big loss. Learn first, practise on demo, then trade small.</div>`}},

<tr><td>🔴 SELL EUR/USD</td><td>Tu vends l'euro, tu achètes le dollar</td><td>l'euro baisse face au dollar</td></tr></table>
<div class="box ex"><b class="t">Exemple sur l'Or</b>SELL XAUUSD à 3 870, puis l'or descend à 3 860 : tu as gagné 10 $ par once (100 pips). S'il était monté à 3 880, tu aurais perdu la même chose.</div>
<p>Tu n'as pas besoin de posséder la devise pour la vendre : avec un broker, vendre et acheter sont aussi simples l'un que l'autre.</p>`,
en:`<p>In Forex, currencies are always quoted <b>in pairs</b>: EUR/USD, GBP/JPY, USD/CAD… Every trade buys one currency and sells the other at the same time.</p>
${pairBox('en','GBP','USD')}
<h2>Reading a pair</h2>
<p>In <b>EUR/USD = 1.0850</b>: 1 euro (base currency) is worth 1.0850 dollars (quote currency).</p>
<h2>BUY or SELL</h2>
<table><tr><th>Action</th><th>What you do</th><th>You profit if…</th></tr>
<tr><td>🟢 BUY EUR/USD</td><td>Buy euros, sell dollars</td><td>the euro rises against the dollar</td></tr>
<tr><td>🔴 SELL EUR/USD</td><td>Sell euros, buy dollars</td><td>the euro falls against the dollar</td></tr></table>
<div class="box ex"><b class="t">Gold example</b>SELL XAUUSD at 3,870, then gold drops to 3,860: you made $10 per ounce (100 pips). If it had risen to 3,880, you would have lost the same.</div>
<p>You don't need to own a currency to sell it: with a broker, selling is as easy as buying.</p>`}},
{t:{fr:"La taille du marché et la liquidité",en:"Market size and liquidity"},s:{fr:"Pourquoi un marché immense, c'est des frais plus bas.",en:"Why a huge market means lower costs."},
b:{fr:`<p>Le Forex est le plus grand marché financier du monde : <b>près de 10 000 milliards de dollars échangés chaque jour</b> selon l'enquête de la Banque des règlements internationaux (2025). C'est bien plus que toutes les bourses d'actions réunies.</p>
<h2>C'est quoi la liquidité ?</h2>
<p>Un marché est <b>liquide</b> quand il y a toujours beaucoup d'acheteurs et de vendeurs. Tu peux entrer et sortir rapidement, au prix affiché, sans attendre.</p>
<h2>Pourquoi ça compte pour toi</h2>
<ul><li><b>Spread plus faible</b> : plus une paire est liquide, plus l'écart entre prix d'achat et de vente est petit. EUR/USD a en général l'un des spreads les plus bas.</li><li><b>Moins de « glissement »</b> : ton ordre est exécuté au prix prévu.</li><li><b>Difficile à manipuler</b> : un seul acteur ne peut pas facilement contrôler le prix.</li></ul>
<div class="box warn"><b class="t">Attention</b>La liquidité baisse la nuit, pendant les jours fériés et juste avant une grosse annonce. Les spreads s'élargissent alors : évite de trader dans ces moments.</div>`,
en:`<p>Forex is the largest financial market in the world: <b>close to 10 trillion dollars traded every day</b> according to the Bank for International Settlements survey (2025). That's far more than all stock markets combined.</p>
<h2>What is liquidity?</h2>
<p>A market is <b>liquid</b> when there are always many buyers and sellers. You can get in and out quickly, at the displayed price, without waiting.</p>
<h2>Why it matters to you</h2>
<ul><li><b>Lower spread</b>: the more liquid a pair, the smaller the gap between buy and sell price. EUR/USD usually has one of the lowest spreads.</li><li><b>Less slippage</b>: your order fills at the expected price.</li><li><b>Hard to manipulate</b>: a single player can't easily control the price.</li></ul>
<div class="box warn"><b class="t">Watch out</b>Liquidity drops at night, on holidays and just before big news. Spreads widen then: avoid trading at those times.</div>`}},
{t:{fr:"Les façons de trader les devises",en:"Ways to trade currencies"},s:{fr:"Spot, CFD, futures, options : les différences.",en:"Spot, CFDs, futures, options: the differences."},
b:{fr:`<p>Il existe plusieurs façons de participer au marché des devises.</p>
<table><tr><th>Méthode</th><th>Principe</th><th>Pour qui ?</th></tr>
<tr><td><b>Spot</b></td><td>Échange de devises au prix du moment</td><td>Banques, entreprises</td></tr>
<tr><td><b>CFD</b></td><td>Contrat qui suit le prix, sans posséder la devise. On gagne ou perd la différence.</td><td>Traders particuliers (c'est ce que proposent HFM et la plupart des brokers)</td></tr>
<tr><td><b>Futures</b></td><td>Contrat standard pour acheter/vendre à une date future, sur une bourse</td><td>Institutions, traders avancés</td></tr>
<tr><td><b>Options</b></td><td>Droit (pas obligation) d'acheter ou vendre à un prix fixé</td><td>Traders avancés</td></tr>
<tr><td><b>ETF</b></td><td>Fonds coté en bourse qui suit une devise ou un panier</td><td>Investisseurs long terme</td></tr></table>
<h2>Le CFD, ce que tu vas utiliser</h2>
<p>Quand tu trades l'Or ou EUR/USD sur MT5 avec ton broker, tu trades des <b>CFD</b> (contrats sur la différence). Tu ne reçois jamais d'or ni d'euros : tu encaisses (ou payes) la différence entre ton prix d'entrée et ton prix de sortie.</p>
<div class="box tip"><b class="t">Avantages du CFD</b>Petit capital, BUY ou SELL en un clic, levier disponible. <b>Inconvénient</b> : le levier augmente aussi les pertes, et il y a des frais de nuit (swap).</div>`,
en:`<p>There are several ways to take part in the currency market.</p>
<table><tr><th>Method</th><th>How it works</th><th>For whom?</th></tr>
<tr><td><b>Spot</b></td><td>Exchanging currencies at the current price</td><td>Banks, companies</td></tr>
<tr><td><b>CFD</b></td><td>A contract that tracks the price without owning the currency. You win or lose the difference.</td><td>Retail traders (what HFM and most brokers offer)</td></tr>
<tr><td><b>Futures</b></td><td>Standard contract to buy/sell at a future date, on an exchange</td><td>Institutions, advanced traders</td></tr>
<tr><td><b>Options</b></td><td>The right (not obligation) to buy or sell at a set price</td><td>Advanced traders</td></tr>
<tr><td><b>ETF</b></td><td>Exchange-traded fund tracking a currency or basket</td><td>Long-term investors</td></tr></table>
<h2>CFDs: what you'll use</h2>
<p>When you trade Gold or EUR/USD on MT5 with your broker, you are trading <b>CFDs</b> (contracts for difference). You never receive gold or euros: you collect (or pay) the difference between your entry and exit price.</p>
<div class="box tip"><b class="t">CFD pros</b>Small capital, BUY or SELL in one click, leverage available. <b>Con</b>: leverage also magnifies losses, and there are overnight fees (swap).</div>`}}
]},
/* ---------- CHAPITRE 2 ---------- */
{t:{fr:"Les paires de devises",en:"Currency pairs"},d:{fr:"Les familles de paires, les prix et l'Or.",en:"Pair families, prices and Gold."},
lessons:[
{t:{fr:"Paires majeures, croisées et exotiques",en:"Major, cross and exotic pairs"},s:{fr:"Les trois familles de paires.",en:"The three families of pairs."},
b:{fr:`<h2>Les paires majeures</h2>
<p>Elles contiennent toutes le <b>dollar américain</b> et une autre grande devise. Ce sont les plus échangées, avec les spreads les plus bas.</p>
<p>EUR/USD · USD/JPY · GBP/USD · USD/CHF · AUD/USD · USD/CAD · NZD/USD</p>
<h2>Les paires croisées (crosses)</h2>
<p>Deux grandes devises <b>sans le dollar</b> : EUR/GBP, EUR/JPY, GBP/JPY, AUD/JPY… Elles bougent bien mais ont souvent un spread un peu plus élevé.</p>
<h2>Les paires exotiques</h2>
<p>Une grande devise contre la monnaie d'un pays émergent : USD/ZAR (rand sud-africain), USD/TRY (livre turque), USD/MXN… Elles peuvent faire de très gros mouvements, avec des <b>spreads larges</b> et une liquidité plus faible.</p>
<div class="box tip"><b class="t">Conseil débutant</b>Évite les exotiques au début. Reste sur l'Or et une ou deux paires majeures.</div>`,
en:`<h2>Major pairs</h2>
<p>They all include the <b>US dollar</b> and another big currency. They're the most traded, with the lowest spreads.</p>
<p>EUR/USD · USD/JPY · GBP/USD · USD/CHF · AUD/USD · USD/CAD · NZD/USD</p>
<h2>Cross pairs</h2>
<p>Two big currencies <b>without the dollar</b>: EUR/GBP, EUR/JPY, GBP/JPY, AUD/JPY… They move well but often have a slightly higher spread.</p>
<h2>Exotic pairs</h2>
<p>A major currency against an emerging-market currency: USD/ZAR (South African rand), USD/TRY (Turkish lira), USD/MXN… They can make very large moves, with <b>wide spreads</b> and lower liquidity.</p>
<div class="box tip"><b class="t">Beginner tip</b>Avoid exotics at first. Stick with Gold and one or two major pairs.</div>`}},
{t:{fr:"Devise de base et devise de cotation",en:"Base and quote currency"},s:{fr:"Lire correctement un prix.",en:"Read a price correctly."},
b:{fr:`<p>Dans chaque paire, la première devise est la <b>devise de base</b> et la seconde la <b>devise de cotation</b>.</p>
<div class="box ex"><b class="t">GBP/USD = 1,2700</b>1 livre sterling (base) = 1,2700 dollar (cotation).<br>Le prix te dit combien d'unités de la devise de cotation il faut pour acheter <b>une</b> unité de la devise de base.</div>
<h2>Quand le prix monte</h2>
<p>Si GBP/USD passe de 1,2700 à 1,2750 : la <b>livre s'est renforcée</b> (ou le dollar s'est affaibli). Il faut plus de dollars pour une livre.</p>
<h2>Quand le prix baisse</h2>
<p>Si GBP/USD passe de 1,2700 à 1,2650 : la livre s'est affaiblie (ou le dollar s'est renforcé).</p>
<h2>Dans quelle devise est mon gain ?</h2>
<p>Ton gain ou ta perte est calculé dans la <b>devise de cotation</b>, puis converti dans la devise de ton compte. Sur XAUUSD, EUR/USD ou GBP/USD, c'est directement en dollars.</p>`,
en:`<p>In every pair, the first currency is the <b>base currency</b> and the second is the <b>quote currency</b>.</p>
<div class="box ex"><b class="t">GBP/USD = 1.2700</b>1 British pound (base) = 1.2700 dollars (quote).<br>The price tells you how many units of the quote currency it takes to buy <b>one</b> unit of the base currency.</div>
<h2>When the price rises</h2>
<p>If GBP/USD goes from 1.2700 to 1.2750: the <b>pound strengthened</b> (or the dollar weakened). It takes more dollars to buy one pound.</p>
<h2>When the price falls</h2>
<p>If GBP/USD goes from 1.2700 to 1.2650: the pound weakened (or the dollar strengthened).</p>
<h2>What currency is my profit in?</h2>
<p>Your profit or loss is calculated in the <b>quote currency</b>, then converted to your account currency. On XAUUSD, EUR/USD or GBP/USD it is directly in dollars.</p>`}},
{t:{fr:"Prix Bid, prix Ask et spread",en:"Bid, Ask and spread"},s:{fr:"Les deux prix affichés et le coût d'un trade.",en:"The two displayed prices and the cost of a trade."},
b:{fr:`<p>Sur MT5, chaque actif affiche <b>deux prix</b> :</p>
<ul><li><b>Bid</b> (vente) : le prix auquel tu peux <b>vendre</b>.</li><li><b>Ask</b> (achat) : le prix auquel tu peux <b>acheter</b>. Il est toujours un peu plus haut.</li></ul>
<div class="box ex"><b class="t">Exemple</b>XAUUSD : Bid 3 865,20 / Ask 3 865,50. Le <b>spread</b> = 0,30 $, soit 3 pips.</div>
<h2>Pourquoi le spread compte</h2>
<p>Le spread est la principale rémunération du broker. Dès que tu ouvres un trade, tu es en perte du montant du spread. Le prix doit d'abord « rattraper » ce coût avant que tu sois en gain.</p>
<h2>Quand le spread s'élargit</h2>
<ul><li>Pendant les grosses annonces économiques.</li><li>À l'ouverture du marché le lundi et la nuit (faible liquidité).</li><li>Sur les paires exotiques.</li></ul>
<div class="box tip"><b class="t">Astuce</b>Un BUY s'ouvre au prix Ask et se ferme au Bid. Un SELL s'ouvre au Bid et se ferme à l'Ask. Ton Stop Loss sur un SELL est donc touché quand l'<b>Ask</b> l'atteint.</div>`,
en:`<p>On MT5, every asset shows <b>two prices</b>:</p>
<ul><li><b>Bid</b>: the price at which you can <b>sell</b>.</li><li><b>Ask</b>: the price at which you can <b>buy</b>. It's always slightly higher.</li></ul>
<div class="box ex"><b class="t">Example</b>XAUUSD: Bid 3,865.20 / Ask 3,865.50. The <b>spread</b> = $0.30, i.e. 3 pips.</div>
<h2>Why the spread matters</h2>
<p>The spread is the broker's main income. As soon as you open a trade, you're down by the spread. Price must first "cover" that cost before you're in profit.</p>
<h2>When the spread widens</h2>
<ul><li>During big economic news.</li><li>At the Monday open and at night (low liquidity).</li><li>On exotic pairs.</li></ul>
<div class="box tip"><b class="t">Tip</b>A BUY opens at the Ask and closes at the Bid. A SELL opens at the Bid and closes at the Ask. So your Stop Loss on a SELL is hit when the <b>Ask</b> reaches it.</div>`}},
{t:{fr:"L'Or (XAUUSD) et les autres actifs",en:"Gold (XAUUSD) and other assets"},s:{fr:"Ce qu'on peut trader en plus des devises.",en:"What you can trade besides currencies."},
b:{fr:`<h2>L'Or, notre actif principal</h2>
<p><b>XAUUSD</b> = le prix d'une once d'or en dollars. L'or est considéré comme une <b>valeur refuge</b> : en période de crise ou d'inquiétude, les investisseurs l'achètent pour protéger leur argent.</p>
<ul><li>Il bouge souvent de <b>20 à 50 $ par jour</b>, parfois beaucoup plus : de belles opportunités, mais un risque élevé.</li><li>Il réagit fortement au <b>dollar</b> et aux <b>taux de la Fed</b> : dollar fort → or souvent en baisse, et inversement.</li><li>1 lot standard = 100 onces. Un mouvement de 1 $ = 100 $ de gain/perte par lot, soit <b>1 $ pour 0,01 lot</b>.</li></ul>
<h2>Les autres actifs disponibles chez un broker</h2>
<table><tr><th>Famille</th><th>Exemples</th></tr>
<tr><td>Métaux</td><td>Or (XAUUSD), Argent (XAGUSD)</td></tr>
<tr><td>Indices</td><td>US30 (Dow Jones), NAS100 (Nasdaq), GER40</td></tr>
<tr><td>Énergie</td><td>Pétrole (USOIL, UKOIL)</td></tr>
<tr><td>Crypto</td><td>BTCUSD, ETHUSD</td></tr></table>
<div class="box warn"><b class="t">Attention</b>Chaque actif a sa propre taille de contrat et sa propre volatilité. Vérifie toujours la valeur d'un mouvement avant de choisir ta taille de lot.</div>`,
en:`<h2>Gold, our main asset</h2>
<p><b>XAUUSD</b> = the price of one ounce of gold in dollars. Gold is seen as a <b>safe haven</b>: in times of crisis or worry, investors buy it to protect their money.</p>
<ul><li>It often moves <b>$20 to $50 a day</b>, sometimes much more: great opportunities, but high risk.</li><li>It reacts strongly to the <b>dollar</b> and <b>Fed rates</b>: strong dollar → gold often falls, and vice versa.</li><li>1 standard lot = 100 ounces. A $1 move = $100 profit/loss per lot, i.e. <b>$1 for 0.01 lot</b>.</li></ul>
<h2>Other assets available at a broker</h2>
<table><tr><th>Family</th><th>Examples</th></tr>
<tr><td>Metals</td><td>Gold (XAUUSD), Silver (XAGUSD)</td></tr>
<tr><td>Indices</td><td>US30 (Dow Jones), NAS100 (Nasdaq), GER40</td></tr>
<tr><td>Energy</td><td>Oil (USOIL, UKOIL)</td></tr>
<tr><td>Crypto</td><td>BTCUSD, ETHUSD</td></tr></table>
<div class="box warn"><b class="t">Watch out</b>Each asset has its own contract size and volatility. Always check what a move is worth before choosing your lot size.</div>`}}
]},
/* ---------- CHAPITRE 3 ---------- */
{t:{fr:"Comment on gagne et on perd",en:"How you win and lose money"},d:{fr:"Pips, lots et calculs de gains.",en:"Pips, lots and profit calculations."},
lessons:[
{t:{fr:"Le pip et le pipette",en:"Pip and pipette"},s:{fr:"L'unité qui mesure les mouvements de prix.",en:"The unit that measures price moves."},
b:{fr:`<p>Le <b>pip</b> (<i>percentage in point</i>) est l'unité standard pour mesurer un mouvement de prix.</p>
<table><tr><th>Actif</th><th>1 pip =</th><th>Exemple</th></tr>
<tr><td>EUR/USD, GBP/USD…</td><td>0,0001 (4ᵉ décimale)</td><td>1,0850 → 1,0870 = <b>20 pips</b></td></tr>
<tr><td>USD/JPY, EUR/JPY…</td><td>0,01 (2ᵉ décimale)</td><td>150,20 → 150,50 = <b>30 pips</b></td></tr>
<tr><td>Or (XAUUSD)</td><td>0,10 $ (usage courant)</td><td>3 860 → 3 865 = <b>50 pips</b></td></tr></table>
<h2>Le pipette</h2>
<p>La plupart des brokers affichent un chiffre de plus : la <b>pipette</b>, qui vaut <b>1/10 de pip</b>. Dans EUR/USD = 1,08505, le dernier « 5 » est une pipette.</p>
<div class="box tip"><b class="t">Sur l'Or</b>Certains traders comptent 1 pip = 0,01 $ ou 1 pip = 1 $. Chez SERGIO FX, on utilise la convention la plus répandue : <b>1 $ de mouvement = 10 pips</b>. L'important est d'utiliser toujours la même.</div>`,
en:`<p>A <b>pip</b> (<i>percentage in point</i>) is the standard unit for measuring a price move.</p>
<table><tr><th>Asset</th><th>1 pip =</th><th>Example</th></tr>
<tr><td>EUR/USD, GBP/USD…</td><td>0.0001 (4th decimal)</td><td>1.0850 → 1.0870 = <b>20 pips</b></td></tr>
<tr><td>USD/JPY, EUR/JPY…</td><td>0.01 (2nd decimal)</td><td>150.20 → 150.50 = <b>30 pips</b></td></tr>
<tr><td>Gold (XAUUSD)</td><td>$0.10 (common usage)</td><td>3,860 → 3,865 = <b>50 pips</b></td></tr></table>
<h2>The pipette</h2>
<p>Most brokers show one extra digit: the <b>pipette</b>, worth <b>1/10 of a pip</b>. In EUR/USD = 1.08505, the last "5" is a pipette.</p>
<div class="box tip"><b class="t">On Gold</b>Some traders count 1 pip = $0.01 or 1 pip = $1. At SERGIO FX we use the most common convention: <b>a $1 move = 10 pips</b>. What matters is to always use the same one.</div>`}},
{t:{fr:"Les lots",en:"Lots"},s:{fr:"Standard, mini et micro : la taille de ta position.",en:"Standard, mini and micro: your position size."},
b:{fr:`<p>Le <b>lot</b> indique la quantité que tu trades. Sur MT5, tu le choisis dans la case « Volume ».</p>
<table><tr><th>Lot</th><th>Volume MT5</th><th>Forex (unités)</th><th>Or (onces)</th></tr>
<tr><td>Standard</td><td>1,00</td><td>100 000</td><td>100</td></tr>
<tr><td>Mini</td><td>0,10</td><td>10 000</td><td>10</td></tr>
<tr><td>Micro</td><td>0,01</td><td>1 000</td><td>1</td></tr></table>
<p>Plus le lot est gros, plus chaque pip vaut d'argent : en gain comme en perte.</p>
<div class="box ex"><b class="t">Sur l'Or</b>Avec <b>0,01 lot</b>, un mouvement de 1 $ (10 pips) = <b>1 $</b> de gain ou de perte.<br>Avec <b>0,10 lot</b> = 10 $. Avec <b>1,00 lot</b> = 100 $.</div>
<div class="box warn"><b class="t">Erreur classique</b>Choisir son lot « au feeling ». Le lot se calcule à partir du risque et du Stop Loss (chapitre 9).</div>`,
en:`<p>The <b>lot</b> tells how much you trade. On MT5 you choose it in the "Volume" box.</p>
<table><tr><th>Lot</th><th>MT5 volume</th><th>Forex (units)</th><th>Gold (ounces)</th></tr>
<tr><td>Standard</td><td>1.00</td><td>100,000</td><td>100</td></tr>
<tr><td>Mini</td><td>0.10</td><td>10,000</td><td>10</td></tr>
<tr><td>Micro</td><td>0.01</td><td>1,000</td><td>1</td></tr></table>
<p>The bigger the lot, the more money each pip is worth: in profit and in loss.</p>
<div class="box ex"><b class="t">On Gold</b>With <b>0.01 lot</b>, a $1 move (10 pips) = <b>$1</b> profit or loss.<br>With <b>0.10 lot</b> = $10. With <b>1.00 lot</b> = $100.</div>
<div class="box warn"><b class="t">Classic mistake</b>Choosing your lot "by feel". Lot size is calculated from your risk and Stop Loss (chapter 9).</div>`}},
{t:{fr:"Calculer la valeur d'un pip",en:"Calculating pip value"},s:{fr:"Combien rapporte 1 pip selon ton lot.",en:"How much 1 pip is worth for your lot."},
b:{fr:`<h2>Paires qui finissent par USD (EUR/USD, GBP/USD…)</h2>
<p>C'est le cas le plus simple : la valeur d'un pip est fixe.</p>
<table><tr><th>Lot</th><th>Valeur d'1 pip</th></tr><tr><td>1,00</td><td>10 $</td></tr><tr><td>0,10</td><td>1 $</td></tr><tr><td>0,01</td><td>0,10 $</td></tr></table>
<h2>Autres paires : la formule</h2>
<div class="box ex"><b class="t">Valeur du pip = (taille du pip ÷ prix) × nombre d'unités</b>USD/JPY à 150,00, 1 lot standard :<br>(0,01 ÷ 150) × 100 000 = <b>6,67 $</b> par pip.</div>
<h2>L'Or</h2>
<table><tr><th>Lot</th><th>1 pip (0,10 $)</th><th>1 $ de mouvement</th></tr><tr><td>1,00</td><td>10 $</td><td>100 $</td></tr><tr><td>0,10</td><td>1 $</td><td>10 $</td></tr><tr><td>0,01</td><td>0,10 $</td><td>1 $</td></tr></table>
<div class="box tip"><b class="t">Bonne nouvelle</b>Tu n'as pas besoin de tout calculer à la main : MT5 affiche ton gain/perte en direct, et de nombreux calculateurs de pip gratuits existent en ligne. Mais comprendre la logique t'évitera des erreurs de lot.</div>`,
en:`<h2>Pairs ending in USD (EUR/USD, GBP/USD…)</h2>
<p>The simplest case: pip value is fixed.</p>
<table><tr><th>Lot</th><th>Value of 1 pip</th></tr><tr><td>1.00</td><td>$10</td></tr><tr><td>0.10</td><td>$1</td></tr><tr><td>0.01</td><td>$0.10</td></tr></table>
<h2>Other pairs: the formula</h2>
<div class="box ex"><b class="t">Pip value = (pip size ÷ price) × number of units</b>USD/JPY at 150.00, 1 standard lot:<br>(0.01 ÷ 150) × 100,000 = <b>$6.67</b> per pip.</div>
<h2>Gold</h2>
<table><tr><th>Lot</th><th>1 pip ($0.10)</th><th>$1 move</th></tr><tr><td>1.00</td><td>$10</td><td>$100</td></tr><tr><td>0.10</td><td>$1</td><td>$10</td></tr><tr><td>0.01</td><td>$0.10</td><td>$1</td></tr></table>
<div class="box tip"><b class="t">Good news</b>You don't have to calculate everything by hand: MT5 shows your profit/loss live, and many free pip calculators exist online. But understanding the logic will save you from lot-size mistakes.</div>`}},
{t:{fr:"Calculer un gain ou une perte",en:"Calculating profit or loss"},s:{fr:"Des exemples chiffrés, pas à pas.",en:"Worked examples, step by step."},
b:{fr:`<div class="box ex"><b class="t">Exemple 1 – BUY sur EUR/USD</b>Entrée : 1,0850 · Sortie : 1,0890 · Lot : 0,10<br>Mouvement : 1,0890 − 1,0850 = 40 pips<br>Valeur du pip à 0,10 lot : 1 $<br>Résultat : 40 × 1 $ = <b>+40 $</b></div>
<div class="box ex"><b class="t">Exemple 2 – SELL sur l'Or</b>Entrée : 3 871,75 · Sortie (TP) : 3 860,05 · Lot : 0,05<br>Mouvement : 3 871,75 − 3 860,05 = 11,70 $ = 117 pips<br>Valeur d'1 $ à 0,05 lot : 5 $<br>Résultat : 11,70 × 5 $ = <b>+58,50 $</b></div>
<div class="box ex"><b class="t">Exemple 3 – Stop Loss touché</b>BUY Or à 3 861,55 · SL : 3 858,02 · Lot : 0,10<br>Mouvement contre toi : 3,53 $ = 35 pips<br>Valeur d'1 $ à 0,10 lot : 10 $<br>Résultat : 3,53 × 10 $ = <b>−35,30 $</b></div>
<h2>N'oublie pas les frais</h2>
<p>Le résultat réel tient aussi compte du <b>spread</b>, d'éventuelles <b>commissions</b> et du <b>swap</b> si tu gardes le trade la nuit.</p>`,
en:`<div class="box ex"><b class="t">Example 1 – BUY EUR/USD</b>Entry: 1.0850 · Exit: 1.0890 · Lot: 0.10<br>Move: 1.0890 − 1.0850 = 40 pips<br>Pip value at 0.10 lot: $1<br>Result: 40 × $1 = <b>+$40</b></div>
<div class="box ex"><b class="t">Example 2 – SELL Gold</b>Entry: 3,871.75 · Exit (TP): 3,860.05 · Lot: 0.05<br>Move: 3,871.75 − 3,860.05 = $11.70 = 117 pips<br>Value of $1 at 0.05 lot: $5<br>Result: 11.70 × $5 = <b>+$58.50</b></div>
<div class="box ex"><b class="t">Example 3 – Stop Loss hit</b>BUY Gold at 3,861.55 · SL: 3,858.02 · Lot: 0.10<br>Move against you: $3.53 = 35 pips<br>Value of $1 at 0.10 lot: $10<br>Result: 3.53 × $10 = <b>−$35.30</b></div>
<h2>Don't forget costs</h2>
<p>The real result also includes the <b>spread</b>, any <b>commissions</b> and the <b>swap</b> if you hold the trade overnight.</p>`}}
]}
];

{t:{fr:"Les ordres de trading",en:"Trading orders"},d:{fr:"Entrer, sortir et protéger ses trades.",en:"Enter, exit and protect your trades."},
lessons:[
{t:{fr:"L'ordre au marché",en:"Market order"},s:{fr:"Entrer tout de suite, au prix actuel.",en:"Enter now, at the current price."},
b:{fr:`<p>Un <b>ordre au marché</b> est exécuté <b>immédiatement</b> au meilleur prix disponible.</p>
<ul><li><b>BUY</b> au marché : tu achètes au prix <b>Ask</b>.</li><li><b>SELL</b> au marché : tu vends au prix <b>Bid</b>.</li></ul>
<h2>Quand l'utiliser</h2>
<p>Quand le prix est déjà dans ta zone d'entrée et que tu veux être dans le mouvement tout de suite. C'est souvent le cas quand un signal dit « SELL GOLD NOW ».</p>
<h2>Le glissement (slippage)</h2>
<p>Pendant les mouvements très rapides (annonces), ton ordre peut être exécuté quelques pips plus loin que le prix affiché. C'est le <b>slippage</b>. Il peut être en ta faveur ou contre toi.</p>
<div class="box tip"><b class="t">Sur MT5</b>Nouvel ordre → Type : <b>Exécution au marché</b> → règle Volume, SL et TP → <b>Vendre</b> ou <b>Acheter</b>.</div>`,
en:`<p>A <b>market order</b> is filled <b>immediately</b> at the best available price.</p>
<ul><li><b>BUY</b> at market: you buy at the <b>Ask</b> price.</li><li><b>SELL</b> at market: you sell at the <b>Bid</b> price.</li></ul>
<h2>When to use it</h2>
<p>When price is already in your entry zone and you want to be in the move right away. That's often the case when a signal says "SELL GOLD NOW".</p>
<h2>Slippage</h2>
<p>During very fast moves (news), your order may fill a few pips away from the displayed price. That's <b>slippage</b>. It can be in your favour or against you.</p>
<div class="box tip"><b class="t">On MT5</b>New order → Type: <b>Market execution</b> → set Volume, SL and TP → <b>Sell</b> or <b>Buy</b>.</div>`}},
{t:{fr:"Les ordres en attente",en:"Pending orders"},s:{fr:"Buy Limit, Sell Limit, Buy Stop, Sell Stop.",en:"Buy Limit, Sell Limit, Buy Stop, Sell Stop."},
b:{fr:`<p>Un <b>ordre en attente</b> ne s'exécute que si le prix atteint le niveau que tu as choisi. Pratique pour ne pas rester devant l'écran.</p>
<table><tr><th>Ordre</th><th>Placé…</th><th>Idée</th></tr>
<tr><td>🟢 <b>Buy Limit</b></td><td>sous le prix actuel</td><td>« J'achète si le prix redescend sur mon support. »</td></tr>
<tr><td>🔴 <b>Sell Limit</b></td><td>au-dessus du prix actuel</td><td>« Je vends si le prix remonte sur ma résistance. »</td></tr>
<tr><td>🟢 <b>Buy Stop</b></td><td>au-dessus du prix actuel</td><td>« J'achète si le prix casse ce niveau vers le haut. »</td></tr>
<tr><td>🔴 <b>Sell Stop</b></td><td>sous le prix actuel</td><td>« Je vends si le prix casse ce niveau vers le bas. »</td></tr></table>
<div class="box ex"><b class="t">Exemple</b>L'or est à 3 865 et le coach repère une zone de vente vers 3 871. Tu places un <b>Sell Limit à 3 871</b> avec ton SL et ton TP. Si le prix monte jusqu'à 3 871, ton ordre se déclenche tout seul.</div>
<div class="box tip"><b class="t">À retenir</b><b>Limit</b> = je veux un meilleur prix (retour sur une zone). <b>Stop</b> = je veux confirmer la cassure.</div>`,
en:`<p>A <b>pending order</b> only fills if price reaches the level you chose. Handy when you can't stay in front of the screen.</p>
<table><tr><th>Order</th><th>Placed…</th><th>Idea</th></tr>
<tr><td>🟢 <b>Buy Limit</b></td><td>below current price</td><td>"I buy if price drops back to my support."</td></tr>
<tr><td>🔴 <b>Sell Limit</b></td><td>above current price</td><td>"I sell if price rises back to my resistance."</td></tr>
<tr><td>🟢 <b>Buy Stop</b></td><td>above current price</td><td>"I buy if price breaks this level upward."</td></tr>
<tr><td>🔴 <b>Sell Stop</b></td><td>below current price</td><td>"I sell if price breaks this level downward."</td></tr></table>
<div class="box ex"><b class="t">Example</b>Gold is at 3,865 and the coach spots a sell zone around 3,871. You place a <b>Sell Limit at 3,871</b> with your SL and TP. If price rises to 3,871, your order triggers by itself.</div>
<div class="box tip"><b class="t">Remember</b><b>Limit</b> = I want a better price (return to a zone). <b>Stop</b> = I want to confirm the breakout.</div>`}},
{t:{fr:"Stop Loss et Take Profit",en:"Stop Loss and Take Profit"},s:{fr:"Les deux protections de chaque trade.",en:"The two safeguards of every trade."},
b:{fr:`<h2>Le Stop Loss (SL)</h2>
<p>Le niveau où ton trade se ferme automatiquement <b>en perte</b> si le marché va contre toi. Il limite les dégâts.</p>
<ul><li>BUY : le SL est <b>sous</b> le prix d'entrée.</li><li>SELL : le SL est <b>au-dessus</b> du prix d'entrée.</li><li>Place-le là où ton idée n'est plus valable (au-delà de la zone, pas au hasard).</li></ul>
<h2>Le Take Profit (TP)</h2>
<p>Le niveau où ton trade se ferme automatiquement <b>en gain</b>. Il évite de regarder un trade gagnant se transformer en perte.</p>
<h2>TP1, TP2, TP3</h2>
<p>Certains traders sortent en plusieurs fois : une partie au TP1, une autre au TP2, etc. Après le TP1, on remonte souvent le SL au prix d'entrée (« <b>break-even</b> ») pour ne plus pouvoir perdre sur ce trade.</p>
<div class="box warn"><b class="t">Règle non négociable</b>Pas de trade sans Stop Loss. Et on ne recule jamais son SL pour « laisser respirer » un trade perdant.</div>`,
en:`<h2>Stop Loss (SL)</h2>
<p>The level where your trade closes automatically <b>at a loss</b> if the market goes against you. It limits the damage.</p>
<ul><li>BUY: the SL is <b>below</b> the entry price.</li><li>SELL: the SL is <b>above</b> the entry price.</li><li>Place it where your idea is no longer valid (beyond the zone, not at random).</li></ul>
<h2>Take Profit (TP)</h2>
<p>The level where your trade closes automatically <b>in profit</b>. It stops a winning trade from turning into a loss.</p>
<h2>TP1, TP2, TP3</h2>
<p>Some traders exit in steps: part at TP1, part at TP2, and so on. After TP1, the SL is often moved to the entry price ("<b>break-even</b>") so the trade can no longer lose.</p>
<div class="box warn"><b class="t">Non-negotiable rule</b>No trade without a Stop Loss. And never move your SL further away to "give room" to a losing trade.</div>`}},
{t:{fr:"Le Trailing Stop",en:"Trailing Stop"},s:{fr:"Un Stop Loss qui suit le prix.",en:"A Stop Loss that follows price."},
b:{fr:`<p>Le <b>Trailing Stop</b> (stop suiveur) déplace automatiquement ton Stop Loss quand le prix va dans ton sens. Il garde toujours la même distance avec le prix, mais <b>ne recule jamais</b>.</p>
<div class="box ex"><b class="t">Exemple</b>BUY Or à 3 860 avec un trailing de 50 pips (5 $).<br>Le prix monte à 3 870 → ton SL monte à 3 865.<br>Le prix monte à 3 880 → ton SL monte à 3 875.<br>Le prix redescend → ton SL reste à 3 875 : tu sécurises au moins +15 $ par once.</div>
<h2>Avantages et limites</h2>
<ul><li>✅ Protège les gains dans les grosses tendances.</li><li>✅ Pas besoin de surveiller en permanence.</li><li>❌ Dans un marché agité, il peut te faire sortir trop tôt.</li><li>❌ Sur MT5, le trailing ne fonctionne que si ta plateforme reste <b>ouverte et connectée</b>.</li></ul>
<div class="box tip"><b class="t">Sur MT5 (PC)</b>Clic droit sur le trade ouvert → <b>Trailing stop</b> → choisis la distance.</div>`,
en:`<p>A <b>Trailing Stop</b> automatically moves your Stop Loss when price goes your way. It keeps the same distance from price, but <b>never moves back</b>.</p>
<div class="box ex"><b class="t">Example</b>BUY Gold at 3,860 with a 50-pip ($5) trailing stop.<br>Price rises to 3,870 → your SL moves to 3,865.<br>Price rises to 3,880 → your SL moves to 3,875.<br>Price falls back → your SL stays at 3,875: you lock in at least +$15 per ounce.</div>
<h2>Pros and limits</h2>
<ul><li>✅ Protects profits in big trends.</li><li>✅ No need to watch all the time.</li><li>❌ In a choppy market it can take you out too early.</li><li>❌ On MT5, trailing only works while your platform stays <b>open and connected</b>.</li></ul>
<div class="box tip"><b class="t">On MT5 (PC)</b>Right-click the open trade → <b>Trailing stop</b> → choose the distance.</div>`}}
]},
/* ---------- CHAPITRE 5 ---------- */
{t:{fr:"Quand trader ?",en:"When to trade?"},d:{fr:"Les sessions, les chevauchements et les annonces.",en:"Sessions, overlaps and news."},
lessons:[
{t:{fr:"Les 4 sessions (heure de Lomé)",en:"The 4 sessions (GMT)"},s:{fr:"Un marché ouvert 24 h/24 du lundi au vendredi.",en:"A market open 24 hours, Monday to Friday."},
b:{fr:`<p>Le Forex ouvre le <b>dimanche soir</b> (vers 22:00, heure de Lomé) et ferme le <b>vendredi soir</b> (vers 22:00). Entre les deux, il tourne sans arrêt en suivant les grandes places financières.</p>
<table><tr><th>Session</th><th>Ouverture</th><th>Fermeture</th><th>Caractère</th></tr>
<tr><td>🇦🇺 Sydney</td><td>22:00</td><td>07:00</td><td>Calme</td></tr>
<tr><td>🇯🇵 Tokyo</td><td>00:00</td><td>09:00</td><td>Calme à moyen, actif sur le yen</td></tr>
<tr><td>🇬🇧 Londres</td><td>08:00</td><td>17:00</td><td>Très actif</td></tr>
<tr><td>🇺🇸 New York</td><td>13:00</td><td>22:00</td><td>Très actif jusqu'à ~17:00</td></tr></table>
<p><i>Horaires d'hiver (novembre à mars). En été, les sessions de Londres et New York commencent une heure plus tôt.</i></p>
<div class="box ex"><b class="t">Chez SERGIO FX</b>Session 1 : <b>08:00 – 11:30</b> (Londres) · Session 2 : <b>13:30 – 16:30</b> (US).</div>`,
en:`<p>Forex opens on <b>Sunday evening</b> (around 22:00 GMT) and closes on <b>Friday evening</b> (around 22:00). In between, it runs non-stop following the major financial centres.</p>
<table><tr><th>Session</th><th>Open</th><th>Close</th><th>Character</th></tr>
<tr><td>🇦🇺 Sydney</td><td>22:00</td><td>07:00</td><td>Quiet</td></tr>
<tr><td>🇯🇵 Tokyo</td><td>00:00</td><td>09:00</td><td>Quiet to medium, active on yen</td></tr>
<tr><td>🇬🇧 London</td><td>08:00</td><td>17:00</td><td>Very active</td></tr>
<tr><td>🇺🇸 New York</td><td>13:00</td><td>22:00</td><td>Very active until ~17:00</td></tr></table>
<p><i>Winter hours (November to March). In summer, the London and New York sessions start one hour earlier.</i></p>
<div class="box ex"><b class="t">At SERGIO FX</b>Session 1: <b>08:00 – 11:30</b> (London) · Session 2: <b>13:30 – 16:30</b> (US).</div>`}},
{t:{fr:"Les chevauchements de sessions",en:"Session overlaps"},s:{fr:"Les heures où le marché bouge le plus.",en:"The hours when the market moves most."},
b:{fr:`<p>Quand deux grandes sessions sont ouvertes en même temps, il y a plus de traders, plus de volume… et plus de mouvement.</p>
<h2>Londres + New York (13:00 – 17:00)</h2>
<p>Le chevauchement le plus important de la journée. Les grandes annonces américaines tombent souvent à <b>13:30</b>. C'est souvent là que l'Or fait ses plus gros mouvements.</p>
<h2>Tokyo + Londres (08:00 – 09:00)</h2>
<p>Plus court et moins actif, mais l'ouverture de Londres peut lancer la tendance de la journée.</p>
<h2>Ce que ça veut dire pour toi</h2>
<ul><li>Plus de mouvement = plus d'opportunités, mais aussi des Stop Loss touchés plus vite.</li><li>Les spreads sont généralement plus bas pendant ces périodes actives.</li><li>En dehors, le prix fait souvent du « range » (il tourne en rond).</li></ul>`,
en:`<p>When two major sessions are open at the same time, there are more traders, more volume… and more movement.</p>
<h2>London + New York (13:00 – 17:00)</h2>
<p>The most important overlap of the day. Major US news is often released at <b>13:30 GMT</b>. Gold often makes its biggest moves here.</p>
<h2>Tokyo + London (08:00 – 09:00)</h2>
<p>Shorter and less active, but the London open can set the day's trend.</p>
<h2>What it means for you</h2>
<ul><li>More movement = more opportunities, but Stop Losses also get hit faster.</li><li>Spreads are usually lower during these active periods.</li><li>Outside them, price often ranges (moves sideways).</li></ul>`}},
{t:{fr:"Le calendrier économique",en:"The economic calendar"},s:{fr:"Les annonces qui font exploser le marché.",en:"The news that makes the market explode."},
b:{fr:`<p>Le <b>calendrier économique</b> liste les publications prévues de la semaine (inflation, emploi, taux…), avec leur heure et leur niveau d'impact. Chaque matin, nous publions celles du jour dans le groupe.</p>
<h2>Les annonces à fort impact sur l'Or</h2>
<table><tr><th>Annonce</th><th>Ce qu'elle mesure</th><th>Quand (heure de Lomé, hiver)</th></tr>
<tr><td><b>NFP</b> (emploi US)</td><td>Créations d'emplois aux États-Unis</td><td>1ᵉʳ vendredi du mois, 13:30</td></tr>
<tr><td><b>CPI</b> (inflation)</td><td>Hausse des prix</td><td>Mi-mois, 13:30</td></tr>
<tr><td><b>Décision de la Fed (FOMC)</b></td><td>Taux d'intérêt américains</td><td>8 fois par an, 19:00</td></tr>
<tr><td><b>Ventes au détail</b></td><td>Consommation des ménages</td><td>Mi-mois, 13:30</td></tr>
<tr><td><b>Discours</b> (Fed, BCE…)</td><td>Indices sur la politique future</td><td>Variable</td></tr></table>
<div class="box warn"><b class="t">Pendant l'annonce</b>Spread qui s'élargit, prix qui fait des allers-retours violents, slippage. Les débutants devraient éviter d'ouvrir un trade quelques minutes avant et après.</div>
<p>Sites utiles : Forex Factory, Investing.com (calendrier économique).</p>`,
en:`<p>The <b>economic calendar</b> lists the week's scheduled releases (inflation, jobs, rates…), with their time and impact level. Every morning we post the day's events in the group.</p>
<h2>High-impact news for Gold</h2>
<table><tr><th>Release</th><th>What it measures</th><th>When (GMT, winter)</th></tr>
<tr><td><b>NFP</b> (US jobs)</td><td>US job creation</td><td>1st Friday of the month, 13:30</td></tr>
<tr><td><b>CPI</b> (inflation)</td><td>Rising prices</td><td>Mid-month, 13:30</td></tr>
<tr><td><b>Fed decision (FOMC)</b></td><td>US interest rates</td><td>8 times a year, 19:00</td></tr>
<tr><td><b>Retail sales</b></td><td>Household spending</td><td>Mid-month, 13:30</td></tr>
<tr><td><b>Speeches</b> (Fed, ECB…)</td><td>Hints about future policy</td><td>Varies</td></tr></table>
<div class="box warn"><b class="t">During the release</b>Wider spreads, violent back-and-forth moves, slippage. Beginners should avoid opening a trade a few minutes before and after.</div>
<p>Useful sites: Forex Factory, Investing.com (economic calendar).</p>`}},
{t:{fr:"Les meilleurs et les pires moments",en:"Best and worst times to trade"},s:{fr:"Organiser ta journée de trading.",en:"Plan your trading day."},
b:{fr:`<h2>✅ Les bons moments</h2>
<ul><li>Ouverture de <b>Londres</b> (08:00 – 11:00).</li><li>Chevauchement <b>Londres + New York</b> (13:30 – 16:30), hors minutes d'annonce.</li><li>Du <b>mardi au jeudi</b> : souvent les jours les plus réguliers.</li></ul>
<h2>❌ Les moments à éviter</h2>
<ul><li>Juste avant et après une grosse annonce (NFP, CPI, Fed).</li><li>La nuit et la session asiatique, pour l'Or (peu de volume, spreads plus larges).</li><li>Le <b>lundi matin</b> (marché qui démarre) et le <b>vendredi après-midi</b> (les gros acteurs ferment leurs positions).</li><li>Les jours fériés américains ou anglais.</li><li>Quand tu es fatigué, énervé ou que tu veux « te refaire » après une perte.</li></ul>
<div class="box tip"><b class="t">Routine conseillée</b>07:00 : lire le calendrier du jour · 08:00 : session Londres · 11:30 : pause · 13:30 : session US · 16:30 : on arrête et on note ses trades dans un journal.</div>`,
en:`<h2>✅ Good times</h2>
<ul><li>The <b>London</b> open (08:00 – 11:00 GMT).</li><li>The <b>London + New York</b> overlap (13:30 – 16:30), outside news minutes.</li><li><b>Tuesday to Thursday</b>: often the most consistent days.</li></ul>
<h2>❌ Times to avoid</h2>
<ul><li>Just before and after big news (NFP, CPI, Fed).</li><li>Night and the Asian session, for Gold (low volume, wider spreads).</li><li><b>Monday morning</b> (market warming up) and <b>Friday afternoon</b> (big players closing positions).</li><li>US or UK public holidays.</li><li>When you're tired, angry or trying to "win it back" after a loss.</li></ul>
<div class="box tip"><b class="t">Suggested routine</b>07:00: read the day's calendar · 08:00: London session · 11:30: break · 13:30: US session · 16:30: stop and log your trades in a journal.</div>`}}
]},
/* ---------- CHAPITRE 6 ---------- */
{t:{fr:"Qui trade le Forex ?",en:"Who trades Forex?"},d:{fr:"Les acteurs du marché et ta place parmi eux.",en:"Market players and your place among them."},
lessons:[
{t:{fr:"Banques centrales et institutions",en:"Central banks and institutions"},s:{fr:"Les acteurs qui font les grands mouvements.",en:"The players who make the big moves."},
b:{fr:`<h2>Les banques centrales</h2>
<p>Fed (États-Unis), BCE (zone euro), Banque d'Angleterre, Banque du Japon… Elles fixent les <b>taux d'intérêt</b> et pilotent l'économie. Une hausse des taux attire les capitaux et renforce souvent la devise ; une baisse l'affaiblit. Leurs annonces font bouger tout le marché, et l'Or en particulier.</p>
<h2>Les grandes banques</h2>
<p>Elles échangent des volumes énormes entre elles sur le <b>marché interbancaire</b> et fournissent les prix aux autres acteurs.</p>
<h2>Les fonds et les entreprises</h2>
<ul><li><b>Fonds d'investissement</b> : spéculent ou protègent leurs placements contre les variations de change.</li><li><b>Entreprises</b> : changent des devises pour payer leurs fournisseurs ou rapatrier leurs ventes à l'étranger.</li></ul>
<div class="box tip"><b class="t">Pourquoi c'est utile</b>Les zones où ces gros acteurs achètent ou vendent laissent des traces sur le graphique. Les repérer, c'est le cœur de notre travail en live.</div>`,
en:`<h2>Central banks</h2>
<p>The Fed (US), ECB (euro area), Bank of England, Bank of Japan… They set <b>interest rates</b> and steer the economy. A rate hike attracts capital and often strengthens the currency; a cut weakens it. Their announcements move the whole market, and Gold in particular.</p>
<h2>Big banks</h2>
<p>They trade huge volumes with each other on the <b>interbank market</b> and supply prices to other players.</p>
<h2>Funds and companies</h2>
<ul><li><b>Investment funds</b>: speculate or protect their investments against currency swings.</li><li><b>Companies</b>: exchange currencies to pay suppliers or bring foreign sales home.</li></ul>
<div class="box tip"><b class="t">Why it's useful</b>The zones where these big players buy or sell leave footprints on the chart. Spotting them is the core of our live work.</div>`}},
{t:{fr:"Le rôle du broker",en:"The broker's role"},s:{fr:"L'intermédiaire entre toi et le marché.",en:"The middleman between you and the market."},
b:{fr:`<p>En tant que particulier, tu ne peux pas aller directement sur le marché interbancaire. Le <b>broker</b> (courtier) fait le lien.</p>
<h2>Ce que fait le broker</h2>
<ul><li>Il t'ouvre un <b>compte de trading</b> et garde ton argent.</li><li>Il te donne une <b>plateforme</b> (MetaTrader 5, application mobile).</li><li>Il affiche les <b>prix</b> et exécute tes <b>ordres</b>.</li><li>Il te propose un <b>effet de levier</b>.</li></ul>
<h2>Comment il gagne de l'argent</h2>
<p>Principalement via le <b>spread</b>, parfois des <b>commissions</b> par lot, et le <b>swap</b> sur les positions gardées la nuit.</p>
<h2>Les points de vigilance</h2>
<ul><li>Vérifie qu'il est <b>régulé</b> par une autorité financière.</li><li>Teste un petit <b>retrait</b> au début pour vérifier que tout fonctionne.</li><li>Ne donne jamais tes identifiants à quelqu'un qui promet de « gérer ton compte ».</li></ul>
<div class="box ex"><b class="t">Notre broker</b>Nous utilisons <b>HFM (HF Markets)</b>. Le lien d'inscription et le guide sont disponibles en bas de cette page.</div>`,
en:`<p>As an individual you can't go straight to the interbank market. The <b>broker</b> is the link.</p>
<h2>What the broker does</h2>
<ul><li>Opens a <b>trading account</b> for you and holds your money.</li><li>Gives you a <b>platform</b> (MetaTrader 5, mobile app).</li><li>Shows <b>prices</b> and executes your <b>orders</b>.</li><li>Offers you <b>leverage</b>.</li></ul>
<h2>How it makes money</h2>
<p>Mainly through the <b>spread</b>, sometimes <b>commissions</b> per lot, and the <b>swap</b> on positions held overnight.</p>
<h2>Things to watch</h2>
<ul><li>Check it is <b>regulated</b> by a financial authority.</li><li>Test a small <b>withdrawal</b> early to check everything works.</li><li>Never give your login to someone promising to "manage your account".</li></ul>
<div class="box ex"><b class="t">Our broker</b>We use <b>HFM (HF Markets)</b>. The sign-up link and guide are at the bottom of this page.</div>`}},
{t:{fr:"Le trader particulier",en:"The retail trader"},s:{fr:"Toi : tes forces et tes faiblesses.",en:"You: your strengths and weaknesses."},
b:{fr:`<p>Les traders particuliers représentent une petite part du volume total. On ne peut pas faire bouger le marché… mais on a des avantages.</p>
<h2>Tes forces</h2>
<ul><li><b>Flexibilité</b> : tu n'es pas obligé de trader tous les jours. Tu peux attendre le meilleur moment.</li><li><b>Petite taille</b> : tu entres et sors facilement, sans faire bouger le prix.</li><li><b>Pas de patron</b> : tu choisis ta méthode et ton rythme.</li></ul>
<h2>Tes faiblesses</h2>
<ul><li><b>Les émotions</b> : peur, avidité, envie de se refaire.</li><li><b>Le manque de formation</b> : beaucoup commencent sans comprendre le levier.</li><li><b>Le surtrading</b> : prendre trop de trades, trop gros.</li></ul>
<div class="box tip"><b class="t">Le profil qui réussit</b>Il apprend, s'entraîne en démo, suit un plan, risque peu par trade, tient un journal et accepte les pertes comme faisant partie du métier.</div>`,
en:`<p>Retail traders are a small part of total volume. We can't move the market… but we have advantages.</p>
<h2>Your strengths</h2>
<ul><li><b>Flexibility</b>: you don't have to trade every day. You can wait for the best moment.</li><li><b>Small size</b>: you get in and out easily without moving price.</li><li><b>No boss</b>: you choose your method and pace.</li></ul>
<h2>Your weaknesses</h2>
<ul><li><b>Emotions</b>: fear, greed, the urge to win it back.</li><li><b>Lack of training</b>: many start without understanding leverage.</li><li><b>Overtrading</b>: too many trades, too big.</li></ul>
<div class="box tip"><b class="t">The profile that succeeds</b>Learns, practises on demo, follows a plan, risks little per trade, keeps a journal and accepts losses as part of the job.</div>`}}
]}
];

{t:{fr:"Pourquoi trader le Forex ?",en:"Why trade Forex?"},d:{fr:"Les avantages et les vrais risques.",en:"The advantages and the real risks."},
lessons:[
{t:{fr:"Les avantages",en:"The advantages"},s:{fr:"Ce qui attire autant de traders.",en:"What attracts so many traders."},
b:{fr:`<ul><li><b>Un marché immense et liquide</b> : on entre et on sort facilement, avec des frais faibles.</li><li><b>Ouvert 24 h/24 en semaine</b> : tu peux trader avant ou après ton travail ou tes cours.</li><li><b>Gagner à la hausse comme à la baisse</b> : un SELL est aussi simple qu'un BUY.</li><li><b>Petit capital de départ</b> : on peut commencer avec quelques dizaines de dollars en micro lots.</li><li><b>Compte démo gratuit</b> : on s'entraîne avec de l'argent virtuel.</li><li><b>Tout depuis ton téléphone</b> : MT5 fonctionne sur Android et iPhone.</li><li><b>Beaucoup de ressources</b> : formations, calendrier, communauté.</li></ul>
<div class="box tip"><b class="t">Mais…</b>Accessible ne veut pas dire facile. Le trading est une compétence qui se travaille, comme un métier.</div>`,
en:`<ul><li><b>A huge, liquid market</b>: easy to get in and out, with low costs.</li><li><b>Open 24 hours on weekdays</b>: trade before or after work or class.</li><li><b>Profit from rises and falls</b>: a SELL is as simple as a BUY.</li><li><b>Small starting capital</b>: start with a few tens of dollars in micro lots.</li><li><b>Free demo account</b>: practise with virtual money.</li><li><b>Everything from your phone</b>: MT5 runs on Android and iPhone.</li><li><b>Plenty of resources</b>: courses, calendar, community.</li></ul>
<div class="box tip"><b class="t">But…</b>Accessible doesn't mean easy. Trading is a skill you work on, like a profession.</div>`}},
{t:{fr:"Les risques réels",en:"The real risks"},s:{fr:"Ce que personne ne te dit sur les réseaux.",en:"What nobody tells you on social media."},
b:{fr:`<ul><li><b>La majorité des débutants perdent de l'argent.</b> Les brokers régulés en Europe doivent d'ailleurs afficher le pourcentage de clients qui perdent : il est souvent supérieur à 70 %.</li><li><b>L'effet de levier</b> multiplie les pertes autant que les gains.</li><li><b>La volatilité</b> : l'Or peut bouger de 20 $ en quelques minutes pendant une annonce.</li><li><b>Les émotions</b> : la peur fait sortir trop tôt, l'avidité fait rester trop longtemps, la colère fait « revenge trader ».</li><li><b>Les frais</b> : spread, commissions et swap grignotent les petits gains.</li></ul>
<div class="box warn"><b class="t">Règle de base</b>Ne trade qu'avec de l'argent que tu peux te permettre de perdre. Jamais l'argent du loyer, de la nourriture ou des études. Jamais d'argent emprunté.</div>`,
en:`<ul><li><b>Most beginners lose money.</b> Regulated brokers in Europe must even display the share of clients who lose: it's often over 70%.</li><li><b>Leverage</b> magnifies losses as much as gains.</li><li><b>Volatility</b>: Gold can move $20 in minutes during news.</li><li><b>Emotions</b>: fear makes you exit too early, greed makes you stay too long, anger makes you "revenge trade".</li><li><b>Costs</b>: spread, commissions and swap eat into small gains.</li></ul>
<div class="box warn"><b class="t">Basic rule</b>Only trade money you can afford to lose. Never rent, food or school money. Never borrowed money.</div>`}}
]},
/* ---------- CHAPITRE 8 ---------- */
{t:{fr:"Marge et effet de levier",en:"Margin and leverage"},d:{fr:"Comprendre ton compte de marge pour ne pas le brûler.",en:"Understand your margin account so you don't blow it."},
lessons:[
{t:{fr:"Le levier expliqué simplement",en:"Leverage made simple"},s:{fr:"Contrôler une grosse position avec peu d'argent.",en:"Control a big position with little money."},
b:{fr:`<p>L'<b>effet de levier</b> permet d'ouvrir une position plus grosse que l'argent présent sur ton compte. Le broker « prête » la différence.</p>
<table><tr><th>Levier</th><th>Avec 100 $, tu contrôles…</th></tr><tr><td>1:50</td><td>5 000 $</td></tr><tr><td>1:100</td><td>10 000 $</td></tr><tr><td>1:500</td><td>50 000 $</td></tr></table>
<h2>Une arme à double tranchant</h2>
<div class="box ex"><b class="t">Exemple</b>Compte de 100 $. Tu ouvres 0,10 lot sur l'Or (10 onces ≈ 38 600 $ de valeur). Un mouvement de 10 $ contre toi = <b>−100 $</b> : ton compte est vidé.<br>Avec 0,01 lot, le même mouvement = −10 $.</div>
<p>Le levier ne change pas ton analyse. Il change <b>la taille de tes gains et de tes pertes</b>. Un levier élevé n'est pas dangereux en soi : c'est la <b>taille de lot</b> trop grosse qui l'est.</p>
<div class="box tip"><b class="t">Conseil</b>Choisis ta taille de lot avec la règle du 1 % (chapitre 9), pas en fonction du levier disponible.</div>`,
en:`<p><b>Leverage</b> lets you open a position larger than the money in your account. The broker "lends" the difference.</p>
<table><tr><th>Leverage</th><th>With $100 you control…</th></tr><tr><td>1:50</td><td>$5,000</td></tr><tr><td>1:100</td><td>$10,000</td></tr><tr><td>1:500</td><td>$50,000</td></tr></table>
<h2>A double-edged sword</h2>
<div class="box ex"><b class="t">Example</b>$100 account. You open 0.10 lot on Gold (10 ounces ≈ $38,600 of value). A $10 move against you = <b>−$100</b>: your account is wiped.<br>With 0.01 lot, the same move = −$10.</div>
<p>Leverage doesn't change your analysis. It changes <b>the size of your wins and losses</b>. High leverage isn't dangerous in itself: an oversized <b>lot</b> is.</p>
<div class="box tip"><b class="t">Tip</b>Choose your lot size with the 1% rule (chapter 9), not based on the leverage available.</div>`}},
{t:{fr:"Marge, marge libre, niveau de marge",en:"Margin, free margin, margin level"},s:{fr:"Les chiffres en bas de ton écran MT5.",en:"The numbers at the bottom of your MT5 screen."},
b:{fr:`<table><tr><th>Terme MT5</th><th>Signification</th></tr>
<tr><td><b>Solde (Balance)</b></td><td>L'argent sur ton compte, sans les trades ouverts.</td></tr>
<tr><td><b>Capitaux propres (Equity)</b></td><td>Solde + gains/pertes des trades ouverts. C'est ce que vaut vraiment ton compte à l'instant.</td></tr>
<tr><td><b>Marge</b></td><td>L'argent bloqué par le broker pour garder tes positions ouvertes.</td></tr>
<tr><td><b>Marge libre</b></td><td>Equity − Marge. Ce qui reste pour encaisser des pertes ou ouvrir d'autres trades.</td></tr>
<tr><td><b>Niveau de marge</b></td><td>(Equity ÷ Marge) × 100 %.</td></tr></table>
<div class="box ex"><b class="t">Exemple</b>Solde : 500 $. Tu ouvres un trade qui demande 40 $ de marge. Il est en perte de −60 $.<br>Equity = 440 $ · Marge libre = 400 $ · Niveau de marge = 440 ÷ 40 = <b>1 100 %</b>.</div>
<p>Plus le niveau de marge est élevé, plus tu es en sécurité. S'il baisse trop, le broker intervient (leçon suivante).</p>`,
en:`<table><tr><th>MT5 term</th><th>Meaning</th></tr>
<tr><td><b>Balance</b></td><td>The money in your account, excluding open trades.</td></tr>
<tr><td><b>Equity</b></td><td>Balance + open trades' profit/loss. What your account is really worth right now.</td></tr>
<tr><td><b>Margin</b></td><td>Money the broker locks to keep your positions open.</td></tr>
<tr><td><b>Free margin</b></td><td>Equity − Margin. What's left to absorb losses or open other trades.</td></tr>
<tr><td><b>Margin level</b></td><td>(Equity ÷ Margin) × 100%.</td></tr></table>
<div class="box ex"><b class="t">Example</b>Balance: $500. You open a trade requiring $40 margin. It's at −$60.<br>Equity = $440 · Free margin = $400 · Margin level = 440 ÷ 40 = <b>1,100%</b>.</div>
<p>The higher the margin level, the safer you are. If it drops too far, the broker steps in (next lesson).</p>`}},
{t:{fr:"Appel de marge et Stop Out",en:"Margin call and Stop Out"},s:{fr:"Quand le broker ferme tes positions.",en:"When the broker closes your positions."},
b:{fr:`<h2>L'appel de marge (Margin Call)</h2>
<p>Quand ton niveau de marge descend sous un certain seuil (souvent autour de <b>50 % à 100 %</b> selon le broker), tu reçois un avertissement : ton compte est en danger.</p>
<h2>Le Stop Out</h2>
<p>Si le niveau de marge continue de baisser jusqu'au seuil de <b>Stop Out</b> (souvent entre <b>20 % et 50 %</b>), le broker <b>ferme automatiquement tes positions</b>, en commençant par la plus perdante. C'est pour éviter que ton compte passe en négatif.</p>
<div class="box warn"><b class="t">Comment l'éviter</b><ul><li>Toujours un Stop Loss.</li><li>Petite taille de lot (règle du 1 %).</li><li>Pas trop de trades ouverts en même temps.</li><li>Ne jamais ajouter des positions sur un trade perdant pour « faire la moyenne ».</li></ul></div>
<p>Les seuils exacts dépendent de ton broker et de ton type de compte : vérifie-les dans les conditions de ton compte HFM.</p>`,
en:`<h2>Margin Call</h2>
<p>When your margin level drops below a certain threshold (often around <b>50% to 100%</b> depending on the broker), you get a warning: your account is in danger.</p>
<h2>Stop Out</h2>
<p>If the margin level keeps falling to the <b>Stop Out</b> threshold (often between <b>20% and 50%</b>), the broker <b>automatically closes your positions</b>, starting with the biggest loser. This stops your account going negative.</p>
<div class="box warn"><b class="t">How to avoid it</b><ul><li>Always use a Stop Loss.</li><li>Small lot size (1% rule).</li><li>Not too many trades open at once.</li><li>Never add to a losing trade to "average down".</li></ul></div>
<p>Exact thresholds depend on your broker and account type: check them in your HFM account conditions.</p>`}},
{t:{fr:"Le swap (frais de nuit)",en:"Swap (overnight fees)"},s:{fr:"Ce que coûte un trade gardé la nuit.",en:"What a trade held overnight costs."},
b:{fr:`<p>Si tu gardes une position ouverte après la clôture de la journée de trading (vers 22:00, heure de Lomé), le broker applique un <b>swap</b> : des frais (ou parfois un petit crédit) liés à la différence de taux d'intérêt entre les deux devises.</p>
<ul><li>Le swap peut être <b>négatif</b> (tu payes) ou <b>positif</b> (tu reçois), selon la paire et le sens (BUY ou SELL).</li><li>Sur l'Or, le swap est généralement négatif dans les deux sens.</li><li>Le <b>mercredi</b>, le swap est souvent compté <b>trois fois</b> pour couvrir le week-end.</li></ul>
<div class="box tip"><b class="t">Pour nous</b>Nos trades sont pris et fermés pendant les sessions de la journée : le swap nous concerne peu. Mais si tu gardes une position plusieurs jours, vérifie le swap dans les spécifications du symbole sur MT5 (clic droit → Spécifications).</div>
<p>Certains brokers proposent des comptes <b>sans swap</b> (« islamiques ») sur demande.</p>`,
en:`<p>If you keep a position open past the end of the trading day (around 22:00 GMT), the broker applies a <b>swap</b>: a fee (or sometimes a small credit) based on the interest-rate difference between the two currencies.</p>
<ul><li>Swap can be <b>negative</b> (you pay) or <b>positive</b> (you receive), depending on the pair and direction (BUY or SELL).</li><li>On Gold, swap is usually negative both ways.</li><li>On <b>Wednesday</b>, swap is often charged <b>three times</b> to cover the weekend.</li></ul>
<div class="box tip"><b class="t">For us</b>Our trades are opened and closed during the day's sessions: swap barely affects us. But if you hold a position for days, check the swap in the symbol specifications on MT5 (right-click → Specification).</div>
<p>Some brokers offer <b>swap-free</b> ("Islamic") accounts on request.</p>`}}
]},
/* ---------- CHAPITRE 9 ---------- */
{t:{fr:"La gestion du risque",en:"Risk management"},d:{fr:"La compétence n°1 pour durer dans le trading.",en:"The number-one skill to last in trading."},
lessons:[
{t:{fr:"La règle du 1 %",en:"The 1% rule"},s:{fr:"Ne jamais risquer plus de 1 % par trade.",en:"Never risk more than 1% per trade."},
b:{fr:`<p>La règle la plus simple et la plus puissante : <b>ne risque jamais plus de 1 % (maximum 2 %) de ton capital sur un seul trade</b>. Le « risque », c'est ce que tu perds si ton Stop Loss est touché.</p>
<table><tr><th>Capital</th><th>Risque max à 1 %</th></tr><tr><td>100 $</td><td>1 $</td></tr><tr><td>500 $</td><td>5 $</td></tr><tr><td>1 000 $</td><td>10 $</td></tr></table>
<h2>Pourquoi ça marche</h2>
<p>Même les meilleurs traders enchaînent des pertes. Avec 1 % par trade, <b>10 pertes de suite</b> ne te font perdre qu'environ 10 % du compte. Avec 10 % par trade, 10 pertes te font perdre près des deux tiers.</p>
<div class="box tip"><b class="t">Le but</b>Rester dans la partie assez longtemps pour que ta méthode fonctionne. Un compte qui survit peut grandir ; un compte vidé, non.</div>`,
en:`<p>The simplest and most powerful rule: <b>never risk more than 1% (2% max) of your capital on a single trade</b>. "Risk" is what you lose if your Stop Loss is hit.</p>
<table><tr><th>Capital</th><th>Max risk at 1%</th></tr><tr><td>$100</td><td>$1</td></tr><tr><td>$500</td><td>$5</td></tr><tr><td>$1,000</td><td>$10</td></tr></table>
<h2>Why it works</h2>
<p>Even the best traders have losing streaks. At 1% per trade, <b>10 losses in a row</b> cost you only about 10% of the account. At 10% per trade, 10 losses cost you nearly two thirds.</p>
<div class="box tip"><b class="t">The goal</b>Stay in the game long enough for your method to work. An account that survives can grow; a blown account can't.</div>`}},
{t:{fr:"Calculer sa taille de lot",en:"Calculating your lot size"},s:{fr:"À partir de ton risque et de ton Stop Loss.",en:"From your risk and your Stop Loss."},
b:{fr:`<div class="box ex"><b class="t">La formule</b>Taille de lot = Montant risqué ÷ (Distance du SL en pips × Valeur d'1 pip pour 1 lot)</div>
<h2>Exemple sur l'Or</h2>
<p>Capital 500 $, risque 1 % = <b>5 $</b>. Entrée 3 868,30, SL 3 878,15 → distance 9,85 $ = <b>98,5 pips</b>.<br>Valeur d'1 pip pour 1 lot sur l'Or = 10 $.<br>Lot = 5 ÷ (98,5 × 10) = 0,005 → arrondi au minimum <b>0,01</b> (risque réel ≈ 9,85 $, soit 2 %).</p>
<div class="box warn"><b class="t">Leçon</b>Avec un petit compte et un SL large sur l'Or, même 0,01 lot peut dépasser 1 %. Dans ce cas, soit tu acceptes 2 % max, soit tu passes ton tour.</div>
<h2>Exemple sur EUR/USD</h2>
<p>Capital 1 000 $, risque 1 % = <b>10 $</b>. SL à 20 pips. Valeur d'1 pip pour 1 lot = 10 $.<br>Lot = 10 ÷ (20 × 10) = <b>0,05 lot</b>.</p>
<p>Astuce : de nombreux calculateurs de taille de position gratuits existent en ligne, et certaines applis le font automatiquement.</p>`,
en:`<div class="box ex"><b class="t">The formula</b>Lot size = Amount at risk ÷ (SL distance in pips × Value of 1 pip for 1 lot)</div>
<h2>Gold example</h2>
<p>Capital $500, 1% risk = <b>$5</b>. Entry 3,868.30, SL 3,878.15 → distance $9.85 = <b>98.5 pips</b>.<br>Value of 1 pip for 1 lot on Gold = $10.<br>Lot = 5 ÷ (98.5 × 10) = 0.005 → rounded up to the minimum <b>0.01</b> (real risk ≈ $9.85, i.e. 2%).</p>
<div class="box warn"><b class="t">Lesson</b>With a small account and a wide SL on Gold, even 0.01 lot can exceed 1%. In that case, either accept 2% max, or skip the trade.</div>
<h2>EUR/USD example</h2>
<p>Capital $1,000, 1% risk = <b>$10</b>. SL of 20 pips. Value of 1 pip for 1 lot = $10.<br>Lot = 10 ÷ (20 × 10) = <b>0.05 lot</b>.</p>
<p>Tip: many free position-size calculators exist online, and some apps do it automatically.</p>`}},
{t:{fr:"Le ratio risque/rendement",en:"Risk/reward ratio"},s:{fr:"Gagner plus que ce qu'on risque.",en:"Win more than you risk."},
b:{fr:`<p>Le <b>ratio risque/rendement</b> (R:R) compare ce que tu risques (distance au SL) à ce que tu peux gagner (distance au TP).</p>
<div class="box ex"><b class="t">Exemple</b>SELL Or à 3 868,30 · SL 3 878,15 (risque 9,85 $) · TP 3 834,90 (gain 33,40 $).<br>R:R = 33,40 ÷ 9,85 ≈ <b>1:3,4</b>.</div>
<h2>Pourquoi c'est puissant</h2>
<table><tr><th>R:R</th><th>Taux de réussite minimum pour ne pas perdre</th></tr><tr><td>1:1</td><td>50 %</td></tr><tr><td>1:2</td><td>33 %</td></tr><tr><td>1:3</td><td>25 %</td></tr></table>
<p>Avec un R:R de 1:2, sur 10 trades à 1 % de risque : 4 gagnants (+8 %) et 6 perdants (−6 %) = <b>+2 %</b>. Tu peux te tromper plus souvent que tu as raison… et gagner quand même.</p>
<div class="box tip"><b class="t">À retenir</b>Vise au moins <b>1:2</b>. Un trade où tu risques 10 $ pour en gagner 5 doit être une exception, pas la règle.</div>`,
en:`<p>The <b>risk/reward ratio</b> (R:R) compares what you risk (distance to SL) with what you can win (distance to TP).</p>
<div class="box ex"><b class="t">Example</b>SELL Gold at 3,868.30 · SL 3,878.15 (risk $9.85) · TP 3,834.90 (gain $33.40).<br>R:R = 33.40 ÷ 9.85 ≈ <b>1:3.4</b>.</div>
<h2>Why it's powerful</h2>
<table><tr><th>R:R</th><th>Minimum win rate to break even</th></tr><tr><td>1:1</td><td>50%</td></tr><tr><td>1:2</td><td>33%</td></tr><tr><td>1:3</td><td>25%</td></tr></table>
<p>With a 1:2 R:R over 10 trades at 1% risk: 4 winners (+8%) and 6 losers (−6%) = <b>+2%</b>. You can be wrong more often than right… and still make money.</p>
<div class="box tip"><b class="t">Remember</b>Aim for at least <b>1:2</b>. A trade risking $10 to make $5 should be the exception, not the rule.</div>`}}
]},
