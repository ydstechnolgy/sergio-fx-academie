{t:{fr:"Premiers pas sur MetaTrader 5",en:"First steps on MetaTrader 5"},d:{fr:"Installer, lire l'écran et passer ton premier ordre.",en:"Install, read the screen and place your first order."},
lessons:[
{t:{fr:"Installer MT5 et se connecter",en:"Install MT5 and log in"},s:{fr:"Relier l'application à ton compte HFM.",en:"Connect the app to your HFM account."},
b:{fr:`<ol><li>Télécharge <b>MetaTrader 5</b> (éditeur : MetaQuotes) sur le Play Store, l'App Store ou depuis l'espace client HFM pour PC.</li><li>Ouvre l'application → <b>Paramètres</b> (ou menu ☰) → <b>Nouveau compte</b> → <b>Se connecter à un compte existant</b>.</li><li>Cherche le serveur de ton broker : tape <b>HFM</b> ou <b>HF Markets</b>, puis choisis le serveur indiqué dans l'email reçu à l'ouverture de ton compte (serveur <b>Demo</b> pour un compte démo, <b>Live</b> pour un compte réel).</li><li>Entre ton <b>identifiant</b> (numéro de compte MT5) et ton <b>mot de passe</b>.</li><li>Appuie sur <b>Connexion</b>. Ton solde s'affiche dans l'onglet Trade.</li></ol>
<div class="box tip"><b class="t">Commence par un compte démo</b>Dans ton espace HFM, crée un compte démo MT5 gratuit. Tu t'entraînes dans les mêmes conditions, sans risquer d'argent réel.</div>
<div class="box warn"><b class="t">Sécurité</b>Ne partage jamais ton mot de passe principal. Si un coach doit voir ton compte, donne uniquement le mot de passe « investisseur » (lecture seule).</div>`,
en:`<ol><li>Download <b>MetaTrader 5</b> (publisher: MetaQuotes) from the Play Store, App Store or the HFM client area for PC.</li><li>Open the app → <b>Settings</b> (or ☰ menu) → <b>New account</b> → <b>Login to an existing account</b>.</li><li>Search for your broker's server: type <b>HFM</b> or <b>HF Markets</b>, then pick the server shown in the email you got when opening your account (<b>Demo</b> server for a demo account, <b>Live</b> for a real account).</li><li>Enter your <b>login</b> (MT5 account number) and <b>password</b>.</li><li>Tap <b>Login</b>. Your balance appears in the Trade tab.</li></ol>
<div class="box tip"><b class="t">Start with a demo account</b>In your HFM area, create a free MT5 demo account. You practise in the same conditions without risking real money.</div>
<div class="box warn"><b class="t">Security</b>Never share your main password. If a coach needs to see your account, only give the "investor" password (read-only).</div>`}},
{t:{fr:"Lire l'écran de MT5",en:"Reading the MT5 screen"},s:{fr:"Cotations, graphique, Trade et Historique.",en:"Quotes, chart, Trade and History."},
b:{fr:`<p>Sur l'application mobile, MT5 a 4 onglets principaux en bas de l'écran :</p>
<table><tr><th>Onglet</th><th>À quoi il sert</th></tr>
<tr><td><b>Cotations</b></td><td>La liste des actifs avec leurs prix Bid et Ask. Appuie sur <b>+</b> pour ajouter XAUUSD si besoin.</td></tr>
<tr><td><b>Graphique</b></td><td>Le graphique en bougies. Change l'unité de temps (M1, M5, H1…) et ajoute des indicateurs.</td></tr>
<tr><td><b>Trade</b></td><td>Tes positions ouvertes, ton Solde, ton Equity, ta Marge et ta Marge libre.</td></tr>
<tr><td><b>Historique</b></td><td>Tous tes trades fermés, avec le résultat de chacun.</td></tr></table>
<h2>Sur le graphique</h2>
<ul><li>Pince avec deux doigts pour zoomer.</li><li>Appuie sur l'icône <b>f</b> pour ajouter un indicateur.</li><li>Appuie sur l'icône d'horloge (ou en haut) pour changer l'unité de temps.</li></ul>
<div class="box tip"><b class="t">Conseil</b>Garde ta liste de cotations courte : XAUUSD et une ou deux paires suffisent pour débuter.</div>`,
en:`<p>On the mobile app, MT5 has 4 main tabs at the bottom of the screen:</p>
<table><tr><th>Tab</th><th>What it's for</th></tr>
<tr><td><b>Quotes</b></td><td>The list of assets with their Bid and Ask prices. Tap <b>+</b> to add XAUUSD if needed.</td></tr>
<tr><td><b>Chart</b></td><td>The candlestick chart. Change the timeframe (M1, M5, H1…) and add indicators.</td></tr>
<tr><td><b>Trade</b></td><td>Your open positions, Balance, Equity, Margin and Free margin.</td></tr>
<tr><td><b>History</b></td><td>All your closed trades, with each result.</td></tr></table>
<h2>On the chart</h2>
<ul><li>Pinch with two fingers to zoom.</li><li>Tap the <b>f</b> icon to add an indicator.</li><li>Tap the clock icon (or the top bar) to change the timeframe.</li></ul>
<div class="box tip"><b class="t">Tip</b>Keep your quotes list short: XAUUSD and one or two pairs are enough to start.</div>`}},
{t:{fr:"Passer son premier ordre en démo",en:"Placing your first demo order"},s:{fr:"Pas à pas, avec SL et TP.",en:"Step by step, with SL and TP."},
b:{fr:`<ol><li>Va dans <b>Cotations</b>, appuie sur <b>XAUUSD</b> → <b>Trade</b> (ou nouvel ordre).</li><li>Choisis le type : <b>Exécution au marché</b> (entrée immédiate) ou un ordre en attente (Buy Limit, Sell Limit…).</li><li>Règle le <b>Volume</b> : commence par <b>0,01</b>.</li><li>Entre ton <b>Stop Loss</b> et ton <b>Take Profit</b>.</li><li>Appuie sur <b>Vendre</b> (SELL) ou <b>Acheter</b> (BUY).</li><li>Le trade apparaît dans l'onglet <b>Trade</b> avec son gain/perte en direct.</li></ol>
<h2>Modifier ou fermer</h2>
<ul><li><b>Modifier</b> SL/TP : appui long sur le trade → Modifier la position.</li><li><b>Fermer</b> : appui long → Clôturer la position (ou glisser selon la version).</li></ul>
<div class="box ex"><b class="t">Exercice</b>Recopie en démo un signal du groupe (entrée, SL, TP) avec 0,01 lot, et observe comment le trade évolue. Fais-le 20 fois avant de passer en réel.</div>`,
en:`<ol><li>Go to <b>Quotes</b>, tap <b>XAUUSD</b> → <b>Trade</b> (or new order).</li><li>Choose the type: <b>Market execution</b> (instant entry) or a pending order (Buy Limit, Sell Limit…).</li><li>Set the <b>Volume</b>: start with <b>0.01</b>.</li><li>Enter your <b>Stop Loss</b> and <b>Take Profit</b>.</li><li>Tap <b>Sell</b> or <b>Buy</b>.</li><li>The trade appears in the <b>Trade</b> tab with its live profit/loss.</li></ol>
<h2>Modify or close</h2>
<ul><li><b>Modify</b> SL/TP: long-press the trade → Modify position.</li><li><b>Close</b>: long-press → Close position (or swipe, depending on version).</li></ul>
<div class="box ex"><b class="t">Exercise</b>Copy a group signal (entry, SL, TP) on demo with 0.01 lot and watch how the trade evolves. Do it 20 times before going live.</div>`}},
{t:{fr:"Lire son historique de trades",en:"Reading your trade history"},s:{fr:"Analyser ses résultats pour progresser.",en:"Analyse your results to improve."},
b:{fr:`<p>L'onglet <b>Historique</b> montre tous tes trades fermés. En haut, tu peux filtrer par période : aujourd'hui, semaine, mois, ou dates personnalisées.</p>
<h2>Ce que tu y trouves</h2>
<ul><li>Pour chaque trade : actif, BUY/SELL, volume, prix d'entrée et de sortie, résultat.</li><li>En bas : <b>Profit</b> total, <b>Dépôts</b>, <b>Retraits</b>, <b>Swap</b>, <b>Commission</b> et <b>Solde</b>.</li></ul>
<h2>Tenir un journal de trading</h2>
<p>Pour progresser, note chaque trade dans un journal (cahier, Excel ou application) :</p>
<ul><li>Date, heure, actif, BUY/SELL</li><li>Raison de l'entrée (zone, bougie, signal)</li><li>SL, TP, lot, résultat</li><li>Ton émotion pendant le trade</li><li>Ce que tu ferais différemment</li></ul>
<div class="box tip"><b class="t">Le vrai secret</b>Après 20 ou 30 trades, relis ton journal. Tu verras tes erreurs qui reviennent (trop gros lot, trade pendant les news, SL déplacé…) et tu sauras exactement quoi corriger.</div>`,
en:`<p>The <b>History</b> tab shows all your closed trades. At the top you can filter by period: today, week, month or custom dates.</p>
<h2>What you'll find</h2>
<ul><li>For each trade: asset, BUY/SELL, volume, entry and exit price, result.</li><li>At the bottom: total <b>Profit</b>, <b>Deposits</b>, <b>Withdrawals</b>, <b>Swap</b>, <b>Commission</b> and <b>Balance</b>.</li></ul>
<h2>Keep a trading journal</h2>
<p>To improve, log every trade in a journal (notebook, Excel or an app):</p>
<ul><li>Date, time, asset, BUY/SELL</li><li>Reason for entry (zone, candle, signal)</li><li>SL, TP, lot, result</li><li>How you felt during the trade</li><li>What you'd do differently</li></ul>
<div class="box tip"><b class="t">The real secret</b>After 20 or 30 trades, reread your journal. You'll see your recurring mistakes (lot too big, trading the news, moving the SL…) and know exactly what to fix.</div>`}}
]}
];

const OLD2={n:2,icon:"hand",t:{fr:"Brokers et analyse",en:"Brokers and analysis"},d:{fr:"Choisir un bon broker et découvrir les façons d'analyser les marchés.",en:"Choose a good broker and discover the ways to analyse the markets."},
lessons:[
{id:"2-1",t:{fr:"Bien choisir son broker",en:"Choosing a broker"},s:{fr:"Les critères qui comptent vraiment.",en:"The criteria that really matter."},
b:{fr:`<p>Ton broker garde ton argent et exécute tes ordres. Le choisir est donc une décision importante.</p>
<h2>Les critères à vérifier</h2>
<ul><li><b>La régulation</b> : le broker doit être enregistré auprès d'une autorité financière (FCA au Royaume-Uni, CySEC à Chypre, FSCA en Afrique du Sud…). Vérifie le numéro de licence sur le site de l'autorité.</li><li><b>Les frais</b> : spread, commissions, frais de nuit (swap).</li><li><b>La plateforme</b> : MetaTrader 5 est la plus utilisée, sur PC et téléphone.</li><li><b>Dépôts et retraits</b> : moyens disponibles chez toi (Mobile Money, carte, crypto…) et rapidité des retraits.</li><li><b>Le service client</b> : disponible et en français si possible.</li><li><b>Le compte démo</b> : pour t'entraîner gratuitement.</li></ul>
<h2>Les types de comptes</h2>
<p>La plupart des brokers proposent plusieurs comptes : certains avec un spread plus large mais sans commission, d'autres avec un spread très faible et une petite commission. Pour débuter, un compte standard suffit.</p>
<div class="box ex"><b class="t">Notre broker</b>À SERGIO FX, nous utilisons <b>HFM (HF Markets)</b>. Le guide d'inscription étape par étape est disponible auprès de l'équipe.</div>
<div class="box warn"><b class="t">Méfiance</b>Un broker non régulé, des bonus trop beaux ou des retraits qui traînent sont des signaux d'alerte.</div>`,
en:`<p>Your broker holds your money and executes your orders. Choosing one is an important decision.</p>
<h2>Criteria to check</h2>
<ul><li><b>Regulation</b>: the broker must be registered with a financial authority (FCA in the UK, CySEC in Cyprus, FSCA in South Africa…). Check the licence number on the authority's website.</li><li><b>Costs</b>: spread, commissions, overnight fees (swap).</li><li><b>Platform</b>: MetaTrader 5 is the most widely used, on PC and phone.</li><li><b>Deposits and withdrawals</b>: methods available in your country (Mobile Money, card, crypto…) and how fast withdrawals are.</li><li><b>Customer support</b>: available, ideally in your language.</li><li><b>Demo account</b>: to practise for free.</li></ul>
<h2>Account types</h2>
<p>Most brokers offer several accounts: some with a wider spread and no commission, others with a very tight spread and a small commission. To start, a standard account is enough.</p>
<div class="box ex"><b class="t">Our broker</b>At SERGIO FX we use <b>HFM (HF Markets)</b>. A step-by-step sign-up guide is available from the team.</div>
<div class="box warn"><b class="t">Red flags</b>An unregulated broker, bonuses that look too good or slow withdrawals are warning signs.</div>`}},
{id:"2-2",t:{fr:"Les 3 types d'analyse",en:"The 3 types of analysis"},s:{fr:"Technique, fondamentale et sentiment.",en:"Technical, fundamental and sentiment."},
b:{fr:`<p>Pour décider d'acheter ou de vendre, les traders utilisent trois grandes familles d'analyse. Les meilleurs les combinent.</p>
<h2>1. L'analyse technique</h2>
<p>Elle étudie le <b>graphique des prix</b> : tendances, supports et résistances, chandeliers, indicateurs. L'idée : l'histoire a tendance à se répéter, et le prix reflète déjà toute l'information disponible. C'est l'analyse que nous utilisons le plus en live.</p>
<h2>2. L'analyse fondamentale</h2>
<p>Elle étudie l'<b>économie</b> : taux d'intérêt, inflation, emploi, croissance, décisions des banques centrales. Exemple : si la Fed laisse entendre qu'elle va baisser ses taux, le dollar a tendance à baisser… et l'Or à monter.</p>
<h2>3. L'analyse du sentiment</h2>
<p>Elle cherche à savoir si la majorité des traders est plutôt <b>acheteuse ou vendeuse</b>, et à quel point elle est sûre d'elle. Quand tout le monde est du même côté, le marché peut se retourner brutalement.</p>
<table><tr><th>Analyse</th><th>Question</th><th>Outils</th></tr><tr><td>Technique</td><td>Où le prix va-t-il réagir ?</td><td>Graphiques, indicateurs</td></tr><tr><td>Fondamentale</td><td>Pourquoi le prix bouge-t-il ?</td><td>Calendrier économique, news</td></tr><tr><td>Sentiment</td><td>Que pensent les autres traders ?</td><td>Positionnement, ambiance du marché</td></tr></table>
<div class="box tip"><b class="t">Conseil</b>Débutant ? Commence par l'analyse technique, et consulte toujours le calendrier économique avant de trader.</div>`,
en:`<p>To decide whether to buy or sell, traders use three main families of analysis. The best traders combine them.</p>
<h2>1. Technical analysis</h2>
<p>It studies the <b>price chart</b>: trends, support and resistance, candlesticks, indicators. The idea: history tends to repeat itself, and price already reflects all available information. It's the analysis we use most in our lives.</p>
<h2>2. Fundamental analysis</h2>
<p>It studies the <b>economy</b>: interest rates, inflation, jobs, growth, central bank decisions. Example: if the Fed hints at cutting rates, the dollar tends to fall… and Gold tends to rise.</p>
<h2>3. Sentiment analysis</h2>
<p>It tries to know whether most traders are <b>buying or selling</b>, and how confident they are. When everyone is on the same side, the market can reverse sharply.</p>
<table><tr><th>Analysis</th><th>Question</th><th>Tools</th></tr><tr><td>Technical</td><td>Where will price react?</td><td>Charts, indicators</td></tr><tr><td>Fundamental</td><td>Why is price moving?</td><td>Economic calendar, news</td></tr><tr><td>Sentiment</td><td>What do other traders think?</td><td>Positioning, market mood</td></tr></table>
<div class="box tip"><b class="t">Tip</b>Beginner? Start with technical analysis, and always check the economic calendar before trading.</div>`}},
{id:"2-3",t:{fr:"Les types de graphiques",en:"Types of charts"},s:{fr:"Ligne, barres et chandeliers.",en:"Line, bar and candlestick."},
b:{fr:`<p>Un graphique montre l'évolution du prix dans le temps. Il en existe trois types principaux.</p>
<h2>Le graphique en ligne</h2>
<p>Il relie les prix de <b>clôture</b> de chaque période. Simple et clair pour voir la tendance générale, mais il cache les détails.</p>
<h2>Le graphique en barres (OHLC)</h2>
<p>Chaque barre montre 4 prix : <b>Ouverture</b> (petit trait à gauche), <b>Plus haut</b> (haut de la barre), <b>Plus bas</b> (bas de la barre) et <b>Clôture</b> (petit trait à droite).</p>
<h2>Le graphique en chandeliers japonais</h2>
<p>Il montre les mêmes 4 prix, mais de façon beaucoup plus visuelle. C'est le plus utilisé par les traders.</p>
${candleSVG('fr')}
<ul><li><b>Bougie verte</b> (haussière) : la clôture est plus haute que l'ouverture.</li><li><b>Bougie rouge</b> (baissière) : la clôture est plus basse que l'ouverture.</li><li>Le <b>corps</b> = l'écart entre ouverture et clôture. Les <b>mèches</b> = les extrêmes atteints.</li></ul>
<h2>Les unités de temps</h2>
<p>Chaque bougie peut représenter 1 minute (M1), 5 minutes (M5), 1 heure (H1), 1 jour (D1)… En live, nous regardons souvent les petites unités (M1, M3, M5) pour entrer, et les grandes (H1, H4) pour la direction générale.</p>`,
en:`<p>A chart shows how price changes over time. There are three main types.</p>
<h2>Line chart</h2>
<p>It connects the <b>closing</b> prices of each period. Simple and clear to see the overall trend, but it hides the details.</p>
<h2>Bar chart (OHLC)</h2>
<p>Each bar shows 4 prices: <b>Open</b> (small tick on the left), <b>High</b> (top of the bar), <b>Low</b> (bottom of the bar) and <b>Close</b> (small tick on the right).</p>
<h2>Japanese candlestick chart</h2>
<p>It shows the same 4 prices, but in a much more visual way. It's the one most traders use.</p>
${candleSVG('en')}
<ul><li><b>Green candle</b> (bullish): close is higher than open.</li><li><b>Red candle</b> (bearish): close is lower than open.</li><li>The <b>body</b> = the gap between open and close. The <b>wicks</b> = the extremes reached.</li></ul>
<h2>Timeframes</h2>
<p>Each candle can represent 1 minute (M1), 5 minutes (M5), 1 hour (H1), 1 day (D1)… In our lives we often use small timeframes (M1, M3, M5) to enter, and larger ones (H1, H4) for the overall direction.</p>`}}
]};
const OLD3={n:3,icon:"candle",t:{fr:"L'analyse technique",en:"Technical analysis"},d:{fr:"Le guide du débutant pour lire un graphique : niveaux clés, bougies, Fibonacci et indicateurs.",en:"The beginner's guide to reading a chart: key levels, candles, Fibonacci and indicators."},
lessons:[
{id:"3-1",t:{fr:"Supports et résistances",en:"Support and resistance"},s:{fr:"Les zones où le prix réagit.",en:"The zones where price reacts."},
b:{fr:`<p>Les supports et résistances sont les bases de l'analyse technique. Ce sont des <b>zones</b> où le prix a déjà réagi dans le passé et risque de réagir à nouveau.</p>
${srSVG('fr')}
<h2>Le support</h2>
<p>Une zone <b>sous</b> le prix où les acheteurs ont été plus forts que les vendeurs : le prix a « rebondi » vers le haut. C'est comme un plancher.</p>
<h2>La résistance</h2>
<p>Une zone <b>au-dessus</b> du prix où les vendeurs ont repris le contrôle : le prix a été repoussé vers le bas. C'est comme un plafond.</p>
<h2>Comment les tracer</h2>
<ul><li>Repère les endroits où le prix s'est retourné <b>au moins deux fois</b>.</li><li>Trace une <b>zone</b> plutôt qu'une ligne parfaite : le prix dépasse souvent un peu.</li><li>Commence sur une grande unité de temps (H1, H4), puis descends.</li></ul>
<h2>Quand un niveau casse</h2>
<p>Quand le prix casse franchement une résistance, celle-ci devient souvent un nouveau <b>support</b> (et inversement). On appelle ça l'inversion de rôle.</p>
<div class="box tip"><b class="t">Dans nos lives</b>Les « SELL ZONE » et « BUY ZONE » que tu vois sur nos graphiques sont des zones de résistance et de support.</div>`,
en:`<p>Support and resistance are the basics of technical analysis. They are <b>zones</b> where price has reacted in the past and may react again.</p>
${srSVG('en')}
<h2>Support</h2>
<p>A zone <b>below</b> price where buyers were stronger than sellers: price "bounced" up. Think of it as a floor.</p>
<h2>Resistance</h2>
<p>A zone <b>above</b> price where sellers took control: price was pushed back down. Think of it as a ceiling.</p>
<h2>How to draw them</h2>
<ul><li>Look for places where price turned <b>at least twice</b>.</li><li>Draw a <b>zone</b> rather than a perfect line: price often overshoots a little.</li><li>Start on a higher timeframe (H1, H4), then zoom in.</li></ul>
<h2>When a level breaks</h2>
<p>When price clearly breaks a resistance, it often becomes new <b>support</b> (and vice versa). This is called a role reversal.</p>
<div class="box tip"><b class="t">In our lives</b>The "SELL ZONE" and "BUY ZONE" you see on our charts are resistance and support zones.</div>`}},
{id:"3-2",t:{fr:"Les chandeliers japonais",en:"Japanese candlesticks"},s:{fr:"Lire les bougies et les figures clés.",en:"Read candles and key patterns."},
b:{fr:`<p>Chaque bougie raconte la bataille entre acheteurs et vendeurs pendant une période. Certaines formes donnent des indices sur la suite.</p>
<h2>Les bougies à connaître</h2>
<ul><li><b>Grand corps, petites mèches</b> : un camp a dominé toute la période. Mouvement fort.</li><li><b>Doji</b> : ouverture ≈ clôture. Indécision, le marché hésite.</li><li><b>Marteau</b> : petit corps en haut, longue mèche basse. En bas d'une baisse, il montre que les acheteurs ont repoussé le prix : possible retournement haussier.</li><li><b>Étoile filante</b> : petit corps en bas, longue mèche haute. En haut d'une hausse : possible retournement baissier.</li></ul>
<h2>Les figures à deux bougies</h2>
<ul><li><b>Avalement haussier</b> : une bougie verte « avale » entièrement la bougie rouge précédente. Signal d'achat potentiel sur un support.</li><li><b>Avalement baissier</b> : une bougie rouge avale la bougie verte précédente. Signal de vente potentiel sur une résistance.</li></ul>
<div class="box tip"><b class="t">La clé</b>Une figure de bougie seule ne suffit pas. Elle devient intéressante quand elle apparaît <b>sur une zone importante</b> (support, résistance).</div>`,
en:`<p>Each candle tells the story of the battle between buyers and sellers during a period. Some shapes give clues about what comes next.</p>
<h2>Candles to know</h2>
<ul><li><b>Big body, small wicks</b>: one side dominated the whole period. Strong move.</li><li><b>Doji</b>: open ≈ close. Indecision, the market is hesitating.</li><li><b>Hammer</b>: small body at the top, long lower wick. At the bottom of a decline it shows buyers pushed price back: possible bullish reversal.</li><li><b>Shooting star</b>: small body at the bottom, long upper wick. At the top of a rise: possible bearish reversal.</li></ul>
<h2>Two-candle patterns</h2>
<ul><li><b>Bullish engulfing</b>: a green candle fully "engulfs" the previous red candle. Potential buy signal at support.</li><li><b>Bearish engulfing</b>: a red candle engulfs the previous green candle. Potential sell signal at resistance.</li></ul>
<div class="box tip"><b class="t">The key</b>A candle pattern alone is not enough. It becomes interesting when it appears <b>at an important zone</b> (support, resistance).</div>`}},
{id:"3-3",t:{fr:"Fibonacci",en:"Fibonacci"},s:{fr:"Trouver où le prix peut corriger.",en:"Find where price may pull back."},
b:{fr:`<p>Le prix ne monte ou ne descend jamais en ligne droite : il avance, recule un peu (on dit qu'il « corrige » ou fait un « retracement »), puis repart. L'outil <b>Fibonacci</b> aide à estimer jusqu'où il peut reculer.</p>
<h2>Les niveaux de retracement</h2>
<p>Les plus utilisés : <b>23,6 % – 38,2 % – 50 % – 61,8 % – 78,6 %</b>. Les zones 50 % et 61,8 % sont souvent les plus surveillées.</p>
<h2>Comment l'utiliser</h2>
<ol><li>Repère un mouvement net (une impulsion).</li><li>En tendance haussière : trace l'outil du <b>plus bas vers le plus haut</b>. En tendance baissière : du <b>plus haut vers le plus bas</b>.</li><li>Observe si le prix réagit sur un niveau, surtout s'il correspond à un support ou une résistance.</li></ol>
<div class="box ex"><b class="t">Dans nos lives</b>Quand tu vois « SELL ZONE [0,718] » ou « BUY [OTE] », il s'agit de zones de retracement que le coach utilise pour chercher une entrée dans le sens du mouvement principal.</div>
<h2>Les extensions</h2>
<p>Les niveaux <b>127,2 %</b> et <b>161,8 %</b> servent à estimer où placer un objectif (Take Profit) quand le prix repart.</p>
<div class="box warn"><b class="t">Attention</b>Fibonacci n'est pas magique. Il indique des zones possibles, pas des certitudes. Toujours un Stop Loss.</div>`,
en:`<p>Price never moves in a straight line: it advances, pulls back a little (a "retracement"), then continues. The <b>Fibonacci</b> tool helps estimate how far it may pull back.</p>
<h2>Retracement levels</h2>
<p>The most used: <b>23.6% – 38.2% – 50% – 61.8% – 78.6%</b>. The 50% and 61.8% zones are often the most watched.</p>
<h2>How to use it</h2>
<ol><li>Spot a clear move (an impulse).</li><li>In an uptrend: draw the tool from the <b>low to the high</b>. In a downtrend: from the <b>high to the low</b>.</li><li>Watch whether price reacts at a level, especially when it lines up with support or resistance.</li></ol>
<div class="box ex"><b class="t">In our lives</b>When you see "SELL ZONE [0.718]" or "BUY [OTE]", these are retracement zones the coach uses to find an entry in the direction of the main move.</div>
<h2>Extensions</h2>
<p>The <b>127.2%</b> and <b>161.8%</b> levels help estimate where to place a target (Take Profit) when price moves on.</p>
<div class="box warn"><b class="t">Warning</b>Fibonacci is not magic. It shows possible zones, not certainties. Always use a Stop Loss.</div>`}},
{id:"3-4",t:{fr:"Les moyennes mobiles",en:"Moving averages"},s:{fr:"Voir la tendance d'un coup d'œil.",en:"See the trend at a glance."},
b:{fr:`${chTrend('fr')}
<p>Une <b>moyenne mobile</b> calcule le prix moyen sur un certain nombre de bougies et le trace sous forme de ligne. Elle « lisse » le graphique pour mieux voir la tendance.</p>
<h2>Les deux types principaux</h2>
<ul><li><b>SMA</b> (moyenne mobile simple) : toutes les bougies comptent autant.</li><li><b>EMA</b> (moyenne mobile exponentielle) : les bougies récentes comptent plus. Elle réagit plus vite.</li></ul>
<h2>Les réglages courants</h2>
<ul><li><b>20</b> : tendance à court terme.</li><li><b>50</b> : tendance à moyen terme.</li><li><b>200</b> : tendance de fond, très suivie par les institutions.</li></ul>
<h2>Comment les lire</h2>
<ul><li>Prix <b>au-dessus</b> de la moyenne et moyenne qui monte : tendance haussière, on cherche plutôt des achats.</li><li>Prix <b>en dessous</b> et moyenne qui descend : tendance baissière, on cherche plutôt des ventes.</li><li>Quand une moyenne courte croise une moyenne longue, cela peut signaler un changement de tendance.</li></ul>
<div class="box tip"><b class="t">Astuce</b>En tendance, les moyennes mobiles servent souvent de support ou de résistance « dynamique ».</div>`,
en:`${chTrend('en')}
<p>A <b>moving average</b> calculates the average price over a number of candles and plots it as a line. It "smooths" the chart to show the trend more clearly.</p>
<h2>The two main types</h2>
<ul><li><b>SMA</b> (simple moving average): every candle counts equally.</li><li><b>EMA</b> (exponential moving average): recent candles count more. It reacts faster.</li></ul>
<h2>Common settings</h2>
<ul><li><b>20</b>: short-term trend.</li><li><b>50</b>: medium-term trend.</li><li><b>200</b>: long-term trend, closely watched by institutions.</li></ul>
<h2>How to read them</h2>
<ul><li>Price <b>above</b> the average and the average rising: uptrend, look mainly for buys.</li><li>Price <b>below</b> and the average falling: downtrend, look mainly for sells.</li><li>When a short average crosses a long one, it may signal a change of trend.</li></ul>
<div class="box tip"><b class="t">Tip</b>In a trend, moving averages often act as "dynamic" support or resistance.</div>`}},
{id:"3-5",t:{fr:"Les indicateurs populaires",en:"Popular chart indicators"},s:{fr:"RSI, MACD, Bollinger, Stochastique, ATR.",en:"RSI, MACD, Bollinger, Stochastic, ATR."},
b:{fr:`<p>Les indicateurs sont des calculs faits à partir du prix. Ils aident à confirmer une idée, mais ne doivent jamais décider à ta place.</p>
<table><tr><th>Indicateur</th><th>À quoi il sert</th><th>Lecture simple</th></tr>
<tr><td><b>RSI</b></td><td>Mesure la force du mouvement</td><td>Au-dessus de 70 : suracheté. En dessous de 30 : survendu.</td></tr>
<tr><td><b>MACD</b></td><td>Suit l'élan de la tendance</td><td>Croisement des lignes = changement d'élan possible.</td></tr>
<tr><td><b>Bandes de Bollinger</b></td><td>Mesurent la volatilité</td><td>Bandes serrées = calme avant un mouvement. Bandes larges = forte volatilité.</td></tr>
<tr><td><b>Stochastique</b></td><td>Compare la clôture aux derniers extrêmes</td><td>Au-dessus de 80 : suracheté. En dessous de 20 : survendu.</td></tr>
<tr><td><b>ATR</b></td><td>Mesure l'amplitude moyenne des bougies</td><td>Aide à placer un Stop Loss adapté à la volatilité.</td></tr></table>
<h2>Les erreurs à éviter</h2>
<ul><li>Mettre 10 indicateurs sur le graphique : trop d'informations = confusion.</li><li>Acheter juste parce que le RSI est sous 30 : en forte tendance, il peut rester « survendu » longtemps.</li><li>Oublier les zones clés : l'indicateur confirme, le niveau décide.</li></ul>
<div class="box tip"><b class="t">Notre conseil</b>Maîtrise d'abord les supports/résistances et les bougies. Ajoute ensuite un ou deux indicateurs maximum.</div>`,
en:`<p>Indicators are calculations based on price. They help confirm an idea, but should never decide for you.</p>
<table><tr><th>Indicator</th><th>What it does</th><th>Simple reading</th></tr>
<tr><td><b>RSI</b></td><td>Measures the strength of the move</td><td>Above 70: overbought. Below 30: oversold.</td></tr>
<tr><td><b>MACD</b></td><td>Tracks trend momentum</td><td>Lines crossing = possible change in momentum.</td></tr>
<tr><td><b>Bollinger Bands</b></td><td>Measure volatility</td><td>Tight bands = calm before a move. Wide bands = high volatility.</td></tr>
<tr><td><b>Stochastic</b></td><td>Compares the close to recent extremes</td><td>Above 80: overbought. Below 20: oversold.</td></tr>
<tr><td><b>ATR</b></td><td>Measures average candle range</td><td>Helps set a Stop Loss suited to volatility.</td></tr></table>
<h2>Mistakes to avoid</h2>
<ul><li>Putting 10 indicators on the chart: too much information = confusion.</li><li>Buying just because RSI is below 30: in a strong trend it can stay "oversold" for a long time.</li><li>Forgetting key zones: the indicator confirms, the level decides.</li></ul>
<div class="box tip"><b class="t">Our advice</b>Master support/resistance and candles first. Then add one or two indicators at most.</div>`}}
]};

  [1,16,6,80,'4',''],[8,16,66,80,'5',L(l,'Graphique','Chart')],[76,16,23,80,'6',L(l,'Liste de surveillance','Watchlist')]]
 :[[3,5,94,10,'1',L(l,'Barre du haut : symbole, unité de temps, f (indicateurs), + (ordre)','Top bar: symbol, timeframe, f (indicators), + (order)')],[3,18,94,60,'2',L(l,'Graphique','Chart')],[3,81,94,14,'3',L(l,'Onglets : Cotations · Graphique · Trade · Historique · Paramètres','Tabs: Quotes · Chart · Trade · History · Settings')]];

{t:{fr:"Ouvrir son compte HFM pas à pas",en:"Opening your HFM account step by step"},s:{fr:"De l'inscription au compte vérifié.",en:"From sign-up to a verified account."},
b:{fr:`<ol class="steps"><li>Ouvre le lien d'inscription SERGIO FX : <a href="${HFM}" target="_blank" rel="noopener">hfm.com (lien partenaire)</a> → <b>S'inscrire</b>.</li><li>Choisis ton <b>pays</b>, entre ton <b>email</b> et un <b>mot de passe</b> solide (8 à 15 caractères avec majuscule, minuscule, chiffre et caractère spécial).</li><li>Entre le <b>code à 6 chiffres</b> reçu par email (vérifie les spams).</li><li>Remplis ton profil : prénom et nom <b>identiques à ta pièce d'identité</b>, téléphone, date de naissance.</li><li>Devise du compte : <b>USD</b> (elle ne pourra plus être changée). Coche les conditions.</li><li>Ton adresse, puis le <b>profil investisseur</b> : réponds honnêtement.</li><li><b>Vérification d'identité</b> : photo nette de ton passeport, carte d'identité ou permis.</li><li><b>Vérification du téléphone</b> par SMS ou WhatsApp.</li><li>Dans <b>« Mes comptes de trading »</b>, ouvre un compte <b>MT5 démo</b> pour t'entraîner, puis un compte réel quand tu seras prêt.</li></ol>
<div class="box tip"><b class="t">Garde précieusement</b>L'email de HFM contient ton <b>numéro de compte MT5</b>, ton <b>mot de passe</b> et le nom du <b>serveur</b>. Tu en auras besoin pour te connecter à MetaTrader 5 (chapitre 3).</div>
<p>Un souci pendant l'inscription ? Écris-nous sur <a href="${WA}" target="_blank" rel="noopener">WhatsApp</a>.</p>`,
en:`<ol class="steps"><li>Open the SERGIO FX sign-up link: <a href="${HFM}" target="_blank" rel="noopener">hfm.com (partner link)</a> → <b>Register</b>.</li><li>Choose your <b>country</b>, enter your <b>email</b> and a strong <b>password</b> (8 to 15 characters with upper case, lower case, a number and a special character).</li><li>Enter the <b>6-digit code</b> sent by email (check spam).</li><li>Fill in your profile: first and last name <b>exactly as on your ID</b>, phone, date of birth.</li><li>Account currency: <b>USD</b> (it can't be changed later). Accept the terms.</li><li>Your address, then the <b>investor profile</b>: answer honestly.</li><li><b>Identity check</b>: a sharp photo of your passport, ID card or driving licence.</li><li><b>Phone check</b> by SMS or WhatsApp.</li><li>In <b>"My trading accounts"</b>, open an <b>MT5 demo</b> account to practise, then a live account when you're ready.</li></ol>
<div class="box tip"><b class="t">Keep it safe</b>HFM's email contains your <b>MT5 account number</b>, <b>password</b> and <b>server</b> name. You'll need them to log in to MetaTrader 5 (chapter 3).</div>
<p>Stuck during sign-up? Message us on <a href="${WA}" target="_blank" rel="noopener">WhatsApp</a>.</p>`}},
{t:{fr:"Démo, réel, dépôt et retrait",en:"Demo, live, deposits and withdrawals"},s:{fr:"Passer au réel sans se brûler.",en:"Going live without getting burned."},
b:{fr:`<h2>Le compte démo</h2><p>Argent virtuel, prix réels. C'est ton terrain d'entraînement : apprendre les boutons de MT5, tester la méthode, prendre l'habitude du Stop Loss. Règle chez SERGIO FX : <b>au moins 20 trades en démo</b> avant le réel.</p>
<h2>Le compte réel</h2><ul><li>Commence <b>petit</b> : un montant que tu peux perdre sans que ça change ta vie.</li><li>Garde le même lot et le même risque qu'en démo (0,01 lot pour commencer sur l'Or).</li><li>Attends-toi à ressentir plus d'émotions : c'est normal, c'est pour ça qu'on commence petit.</li></ul>
<h2>Dépôt et retrait</h2><ul><li>Dépôt depuis ton espace client (Mobile Money, carte, crypto… selon ce qui est disponible chez toi).</li><li>Le retrait se fait en général par le <b>même moyen</b> que le dépôt.</li><li>Fais un <b>petit retrait test</b> au début pour vérifier que tout fonctionne.</li><li>Ton compte doit être <b>vérifié</b> (pièce d'identité) pour retirer.</li></ul>
<div class="box warn"><b class="t">Sécurité</b>Ne donne jamais tes identifiants. Si quelqu'un doit regarder ton compte, donne seulement le mot de passe <b>investisseur</b> (lecture seule).</div>`,
en:`<h2>The demo account</h2><p>Virtual money, real prices. Your training ground: learn the MT5 buttons, test the method, build the Stop Loss habit. SERGIO FX rule: <b>at least 20 demo trades</b> before going live.</p>
<h2>The live account</h2><ul><li>Start <b>small</b>: an amount you can lose without it changing your life.</li><li>Keep the same lot and risk as on demo (0.01 lot to start on Gold).</li><li>Expect stronger emotions: that's normal, and why we start small.</li></ul>
<h2>Deposits and withdrawals</h2><ul><li>Deposit from your client area (Mobile Money, card, crypto… depending on what's available in your country).</li><li>Withdrawals usually go back through the <b>same method</b> as the deposit.</li><li>Make a <b>small test withdrawal</b> early to check everything works.</li><li>Your account must be <b>verified</b> (ID) to withdraw.</li></ul>
<div class="box warn"><b class="t">Security</b>Never give out your login. If someone needs to look at your account, only give the <b>investor</b> (read-only) password.</div>`}}
]},
/* ---------- CH 2 TradingView ---------- */
{t:{fr:"TradingView : ton atelier d'analyse",en:"TradingView: your analysis workshop"},d:{fr:"Créer ton compte, ajouter tes paires et préparer tes graphiques.",en:"Create your account, add your pairs and set up your charts."},
lessons:[
{t:{fr:"Créer son compte TradingView",en:"Creating a TradingView account"},s:{fr:"Gratuit, sur PC et téléphone.",en:"Free, on PC and phone."},
b:{fr:`<p><b>TradingView</b> est la plateforme de graphiques la plus utilisée par les traders. C'est là qu'on <b>analyse</b> (tracer les zones, la tendance, préparer le plan). MT5, lui, sert à <b>exécuter</b> les ordres.</p>
<ol class="steps"><li>Va sur <b>tradingview.com</b> (ou télécharge l'application « TradingView » sur le Play Store / App Store).</li><li>Clique sur l'icône de profil en haut à droite → <b>S'inscrire</b> (Sign up).</li><li>Inscris-toi avec ton <b>Google</b> ou ton <b>email</b>.</li><li>Choisis le plan <b>Basic (gratuit)</b> : il suffit largement pour débuter.</li><li>Passe l'interface en français : menu du profil → <b>Langue</b> → Français.</li></ol>
<div class="box tip"><b class="t">Bon à savoir</b>Le plan gratuit a quelques limites (nombre d'indicateurs par graphique, publicités…). Pour notre méthode basée sur le prix et les zones, ce n'est pas un problème.</div>`,
en:`<p><b>TradingView</b> is the charting platform most traders use. It's where we <b>analyse</b> (draw zones and trends, prepare the plan). MT5 is used to <b>execute</b> orders.</p>
<ol class="steps"><li>Go to <b>tradingview.com</b> (or download the "TradingView" app from the Play Store / App Store).</li><li>Click the profile icon at the top right → <b>Sign up</b>.</li><li>Sign up with <b>Google</b> or your <b>email</b>.</li><li>Choose the <b>Basic (free)</b> plan: plenty to start with.</li><li>Set your language: profile menu → <b>Language</b>.</li></ol>
<div class="box tip"><b class="t">Good to know</b>The free plan has some limits (indicators per chart, ads…). For our price-and-zones method, that's not a problem.</div>`}},
{t:{fr:"Découvrir l'interface",en:"Getting to know the interface"},s:{fr:"Les 6 zones de l'écran.",en:"The 6 areas of the screen."},
b:{fr:`<p>Ouvre un graphique : menu <b>Produits → Supergraphiques</b> (ou « Graphique » dans l'appli).</p>${ui('fr','tv')}
<ol class="steps"><li><b>Recherche du symbole</b> : tape le nom de l'actif (XAUUSD, EURUSD…).</li><li><b>Unité de temps</b> : 1m, 5m, 15m, 1h, 4h, 1D…</li><li><b>Indicateurs</b> : ajouter une moyenne mobile, un RSI…</li><li><b>Outils de dessin</b> (barre de gauche) : lignes, rectangles, Fibonacci, position longue/courte, texte.</li><li><b>Le graphique</b> : molette pour zoomer, clic-glisser pour se déplacer dans le temps.</li><li><b>Liste de surveillance</b> (à droite) : tes actifs favoris en un clic.</li></ol>`,
en:`<p>Open a chart: <b>Products → Supercharts</b> menu (or "Chart" in the app).</p>${ui('en','tv')}
<ol class="steps"><li><b>Symbol search</b>: type the asset name (XAUUSD, EURUSD…).</li><li><b>Timeframe</b>: 1m, 5m, 15m, 1h, 4h, 1D…</li><li><b>Indicators</b>: add a moving average, an RSI…</li><li><b>Drawing tools</b> (left bar): lines, rectangles, Fibonacci, long/short position, text.</li><li><b>The chart</b>: scroll to zoom, click-drag to move through time.</li><li><b>Watchlist</b> (right): your favourite assets in one click.</li></ol>`}},
{t:{fr:"Ajouter tes paires et régler ton graphique",en:"Adding your pairs and setting up your chart"},s:{fr:"Liste de surveillance, bougies et fuseau horaire.",en:"Watchlist, candles and time zone."},
b:{fr:`<h2>1. Créer ta liste de surveillance</h2>
<ol class="steps"><li>Dans le panneau de droite, clique sur <b>+</b> (Ajouter un symbole).</li><li>Tape <b>XAUUSD</b> et choisis une source Forex/CFD connue (par exemple <b>OANDA</b>).</li><li>Ajoute aussi <b>EURUSD</b>, <b>GBPUSD</b>, <b>USDJPY</b> et <b>DXY</b> (l'indice du dollar, très utile pour l'Or).</li><li>Clique sur un symbole de la liste pour l'afficher sur le graphique.</li></ol>
<h2>2. Régler le graphique</h2>
<ul><li><b>Type</b> : bougies japonaises (icône à côté de l'unité de temps).</li><li><b>Fuseau horaire</b> : clic droit sur le graphique → <b>Paramètres</b> → <b>Symbole/Échelles</b> → fuseau <b>UTC</b>. C'est l'heure de Lomé : tes horaires de session correspondront à ceux du groupe.</li><li><b>Couleurs</b> : Paramètres → Symbole → bougies vertes/rouges si tu préfères.</li></ul>
<div class="box warn"><b class="t">Prix légèrement différents</b>Le prix de l'Or sur TradingView (OANDA) peut différer de quelques dixièmes de celui de ton broker sur MT5. C'est normal : chaque fournisseur a ses prix. Pour <b>exécuter</b>, c'est toujours le prix de MT5 qui compte.</div>`,
en:`<h2>1. Build your watchlist</h2>
<ol class="steps"><li>In the right panel, click <b>+</b> (Add symbol).</li><li>Type <b>XAUUSD</b> and pick a well-known Forex/CFD source (for example <b>OANDA</b>).</li><li>Also add <b>EURUSD</b>, <b>GBPUSD</b>, <b>USDJPY</b> and <b>DXY</b> (the dollar index, very useful for Gold).</li><li>Click a symbol in the list to show it on the chart.</li></ol>
<h2>2. Set up the chart</h2>
<ul><li><b>Type</b>: Japanese candlesticks (icon next to the timeframe).</li><li><b>Time zone</b>: right-click the chart → <b>Settings</b> → <b>Symbol/Scales</b> → time zone <b>UTC</b>. That's Lomé time, so session times match the group's.</li><li><b>Colours</b>: Settings → Symbol → green/red candles if you prefer.</li></ul>
<div class="box warn"><b class="t">Slightly different prices</b>Gold's price on TradingView (OANDA) can differ by a few tenths from your broker's on MT5. That's normal: each provider has its own prices. To <b>execute</b>, MT5's price is what counts.</div>`}},
{t:{fr:"Les outils de dessin",en:"Drawing tools"},s:{fr:"Lignes, zones, Fibonacci et texte.",en:"Lines, zones, Fibonacci and text."},
b:{fr:`<table><tr><th>Outil</th><th>Où ?</th><th>Usage</th></tr>
<tr><td><b>Ligne de tendance</b></td><td>1ᵉʳ groupe (lignes)</td><td>Relier les creux ou les sommets</td></tr>
<tr><td><b>Ligne horizontale</b></td><td>1ᵉʳ groupe</td><td>Marquer un niveau précis</td></tr>
<tr><td><b>Rectangle</b></td><td>Groupe formes</td><td>Dessiner une zone (SELL ZONE, BUY ZONE)</td></tr>
<tr><td><b>Retracement de Fibonacci</b></td><td>Groupe Fibonacci</td><td>Trouver les zones de correction (50 %, 61,8 %, 0,718…)</td></tr>
<tr><td><b>Position longue / courte</b></td><td>Groupe prévisions et mesures</td><td>Planifier entrée, SL, TP et voir le ratio</td></tr>
<tr><td><b>Texte</b></td><td>Groupe annotations</td><td>Noter « H4 résistance », « M5 entrée »…</td></tr></table>
<h2>Astuces</h2>
<ul><li>Un <b>double-clic</b> sur un dessin ouvre ses réglages (couleur, épaisseur, prolonger à droite).</li><li>Utilise une <b>couleur par unité de temps</b> (ex. rouge pour D1, orange pour H4, bleu pour H1) : tu sauras d'un coup d'œil d'où vient chaque zone.</li><li>Le cadenas (en bas de la barre d'outils) verrouille tes dessins pour ne pas les déplacer par erreur.</li><li>Clique sur l'étoile d'un outil pour l'ajouter à ta barre de favoris.</li></ul>`,
en:`<table><tr><th>Tool</th><th>Where?</th><th>Use</th></tr>
<tr><td><b>Trend line</b></td><td>1st group (lines)</td><td>Connect lows or highs</td></tr>
<tr><td><b>Horizontal line</b></td><td>1st group</td><td>Mark an exact level</td></tr>
<tr><td><b>Rectangle</b></td><td>Shapes group</td><td>Draw a zone (SELL ZONE, BUY ZONE)</td></tr>
<tr><td><b>Fibonacci retracement</b></td><td>Fibonacci group</td><td>Find pullback zones (50%, 61.8%, 0.718…)</td></tr>
<tr><td><b>Long / short position</b></td><td>Forecasting & measurement group</td><td>Plan entry, SL, TP and see the ratio</td></tr>
<tr><td><b>Text</b></td><td>Annotation group</td><td>Note "H4 resistance", "M5 entry"…</td></tr></table>
<h2>Tips</h2>
<ul><li><b>Double-click</b> a drawing to open its settings (colour, thickness, extend right).</li><li>Use <b>one colour per timeframe</b> (e.g. red for D1, orange for H4, blue for H1): you'll know at a glance where each zone comes from.</li><li>The lock (bottom of the toolbar) locks your drawings so you don't move them by mistake.</li><li>Click a tool's star to add it to your favourites bar.</li></ul>`}},
{t:{fr:"Planifier un trade avec l'outil position",en:"Planning a trade with the position tool"},s:{fr:"Entrée, SL, TP et ratio en un dessin.",en:"Entry, SL, TP and ratio in one drawing."},
b:{fr:`<p>L'outil <b>Position longue</b> (achat) ou <b>Position courte</b> (vente) dessine exactement ce que tu vois dans nos captures de signaux : une zone verte (gain) et une zone rouge (risque).</p>
<ol class="steps"><li>Choisis <b>Position courte</b> pour un SELL (ou longue pour un BUY).</li><li>Clique sur ton <b>prix d'entrée</b>.</li><li>Tire le bord de la zone rouge jusqu'à ton <b>Stop Loss</b>, et celui de la zone verte jusqu'à ton <b>Take Profit</b>.</li><li>L'outil affiche le <b>ratio risque/rendement</b> et la distance en points.</li><li>Double-clic → onglet <b>Entrées</b> : indique la taille de ton compte et le risque (1 %) pour qu'il calcule la quantité.</li></ol>
<div class="box ex"><b class="t">Lire une capture du coach</b>Sur nos captures, l'étiquette « Stop: 9.851 » donne la distance du SL, « Risk/reward ratio: 3.3 » le ratio, et les étiquettes colorées sur l'échelle de droite donnent l'entrée (grise), le SL (rouge) et le TP (verte).</div>`,
en:`<p>The <b>Long position</b> (buy) or <b>Short position</b> (sell) tool draws exactly what you see in our signal screenshots: a green zone (profit) and a red zone (risk).</p>
<ol class="steps"><li>Choose <b>Short position</b> for a SELL (or long for a BUY).</li><li>Click your <b>entry price</b>.</li><li>Drag the edge of the red zone to your <b>Stop Loss</b>, and the green zone's edge to your <b>Take Profit</b>.</li><li>The tool shows the <b>risk/reward ratio</b> and the distance in points.</li><li>Double-click → <b>Inputs</b> tab: enter your account size and risk (1%) so it calculates the quantity.</li></ol>
<div class="box ex"><b class="t">Reading the coach's screenshot</b>On our screenshots, the "Stop: 9.851" label gives the SL distance, "Risk/reward ratio: 3.3" the ratio, and the coloured tags on the right scale give the entry (grey), SL (red) and TP (green).</div>`}},
{t:{fr:"Indicateurs, alertes et sauvegarde",en:"Indicators, alerts and saving"},s:{fr:"Ne plus rester collé à l'écran.",en:"Stop staring at the screen."},
b:{fr:`<h2>Ajouter un indicateur</h2><p>Clique sur <b>Indicateurs</b> en haut → tape « Moving Average » ou « RSI » → clique dessus. Double-clic sur l'indicateur pour changer sa période (ex. 50 ou 200).</p>
<h2>Créer une alerte</h2>
<ol class="steps"><li>Fais un clic droit sur ta zone (ou ta ligne) → <b>Ajouter une alerte</b>.</li><li>Condition : <b>XAUUSD</b> « Croisement » ton niveau.</li><li>Choisis la notification : application mobile, email, son.</li><li>Valide. Tu seras prévenu quand le prix arrive sur ta zone, même téléphone en poche.</li></ol>
<h2>Sauvegarder ta mise en page</h2><p>Quand tu es connecté, TradingView <b>enregistre automatiquement</b> tes dessins dans le cloud. Tu les retrouves sur ton PC et ton téléphone. Donne un nom à ta mise en page (menu en haut à droite) : par exemple « OR – SERGIO FX ».</p>`,
en:`<h2>Adding an indicator</h2><p>Click <b>Indicators</b> at the top → type "Moving Average" or "RSI" → click it. Double-click the indicator to change its period (e.g. 50 or 200).</p>
<h2>Creating an alert</h2>
<ol class="steps"><li>Right-click your zone (or line) → <b>Add alert</b>.</li><li>Condition: <b>XAUUSD</b> "Crossing" your level.</li><li>Choose the notification: mobile app, email, sound.</li><li>Confirm. You'll be notified when price reaches your zone, even with your phone in your pocket.</li></ol>
<h2>Saving your layout</h2><p>When logged in, TradingView <b>saves your drawings automatically</b> to the cloud. You'll find them on your PC and phone. Name your layout (top-right menu): e.g. "GOLD – SERGIO FX".</p>`}}
]},

{t:{fr:"Gérer un trade ouvert",en:"Managing an open trade"},s:{fr:"Modifier le SL/TP, break-even, clôture partielle.",en:"Modify SL/TP, break-even, partial close."},
b:{fr:`<h2>Modifier le Stop Loss ou le Take Profit</h2><p>Onglet <b>Trade</b> → appui long sur la position → <b>Modifier la position</b> → change le SL ou le TP → <b>Modifier</b>.</p>
<h2>Mettre au break-even</h2><p>Quand le trade a bien avancé (souvent au TP1), place le <b>SL au prix d'entrée</b>. Si le marché revient, tu sors à 0 au lieu de perdre. C'est ce qu'on annonce dans le groupe par « SL au BE ».</p>
<h2>Clôture partielle</h2><p>Appui long → <b>Clôturer la position</b> → au lieu du volume total, entre une partie (ex. 0,02 sur 0,04) → clôturer. Tu encaisses une partie du gain et laisses courir le reste vers le TP2.</p>
<div class="box ex"><b class="t">Exemple</b>SELL Or 0,04 lot à 3 868. TP1 touché à 3 858 (+40 $) → tu fermes 0,02 lot (+20 $ encaissés) et mets le SL du reste à 3 868. Pire scénario désormais : +20 $.</div>
<div class="box warn"><b class="t">Ne jamais faire</b>Éloigner son SL quand le trade est perdant. On peut <b>réduire</b> le risque, jamais l'augmenter.</div>`,
en:`<h2>Modifying the Stop Loss or Take Profit</h2><p><b>Trade</b> tab → long-press the position → <b>Modify position</b> → change SL or TP → <b>Modify</b>.</p>
<h2>Moving to break-even</h2><p>When the trade has moved well (often at TP1), set the <b>SL at the entry price</b>. If the market comes back, you exit at 0 instead of losing. That's what "SL to BE" means in the group.</p>
<h2>Partial close</h2><p>Long-press → <b>Close position</b> → instead of the full volume, enter part of it (e.g. 0.02 of 0.04) → close. You bank part of the profit and let the rest run to TP2.</p>
<div class="box ex"><b class="t">Example</b>SELL Gold 0.04 lot at 3,868. TP1 hit at 3,858 (+$40) → close 0.02 lot (+$20 banked) and move the remaining SL to 3,868. Worst case now: +$20.</div>
<div class="box warn"><b class="t">Never</b>Move your SL further away on a losing trade. You can <b>reduce</b> risk, never increase it.</div>`}},
{t:{fr:"MT5 sur ordinateur",en:"MT5 on desktop"},s:{fr:"Raccourcis et trading en un clic.",en:"Shortcuts and one-click trading."},
b:{fr:`<ul><li><b>F9</b> : nouvel ordre.</li><li><b>Ctrl+M</b> : afficher/masquer la fenêtre des cotations (Market Watch).</li><li><b>Ctrl+T</b> : afficher la boîte à outils (onglets Trade, Historique…).</li><li><b>Double-clic</b> sur une position : la modifier ou la fermer.</li><li>Sur le graphique, tu peux <b>glisser les lignes SL et TP</b> directement avec la souris.</li><li><b>Trading en un clic</b> : clic droit sur le graphique → Trading en un clic. Des boutons BUY/SELL apparaissent en haut à gauche. Pratique mais dangereux si tu cliques trop vite : à activer seulement quand tu maîtrises.</li></ul>
<div class="box tip"><b class="t">Le duo gagnant</b>Analyse sur <b>TradingView</b> (dessins, alertes) → exécution sur <b>MT5</b> (ordre, SL, TP). Beaucoup de traders ont TradingView sur le PC et MT5 sur le téléphone.</div>`,
en:`<ul><li><b>F9</b>: new order.</li><li><b>Ctrl+M</b>: show/hide Market Watch.</li><li><b>Ctrl+T</b>: show the Toolbox (Trade, History tabs…).</li><li><b>Double-click</b> a position: modify or close it.</li><li>On the chart you can <b>drag the SL and TP lines</b> directly with the mouse.</li><li><b>One-click trading</b>: right-click the chart → One Click Trading. BUY/SELL buttons appear top-left. Handy but risky if you click too fast: only enable it once you're comfortable.</li></ul>
<div class="box tip"><b class="t">The winning combo</b>Analyse on <b>TradingView</b> (drawings, alerts) → execute on <b>MT5</b> (order, SL, TP). Many traders keep TradingView on the PC and MT5 on their phone.</div>`}}
];
