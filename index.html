const LV4={n:4,icon:"layers",t:{fr:"Structure et Top-Down Analysis",en:"Market structure and top-down analysis"},d:{fr:"Lire la structure du marché et analyser du grand vers le petit : la méthode utilisée en live.",en:"Read market structure and analyse from big to small: the method used in our lives."},
chapters:[
{t:{fr:"La structure du marché",en:"Market structure"},d:{fr:"Tendances, cassures, zones et liquidité.",en:"Trends, breaks, zones and liquidity."},
lessons:[
{t:{fr:"Hausse, baisse ou range ?",en:"Uptrend, downtrend or range?"},s:{fr:"Lire les sommets et les creux.",en:"Read the highs and lows."},
b:{fr:`<p>La <b>structure</b> du marché, c'est la façon dont le prix construit ses sommets (highs) et ses creux (lows). C'est la première chose à regarder sur un graphique.</p>
${chStruct('fr')}
<table><tr><th>Structure</th><th>Sommets</th><th>Creux</th><th>On cherche…</th></tr>
<tr><td>🟢 Haussière</td><td>de plus en plus hauts (<b>HH</b>)</td><td>de plus en plus hauts (<b>HL</b>)</td><td>des BUY sur les creux</td></tr>
<tr><td>🔴 Baissière</td><td>de plus en plus bas (<b>LH</b>)</td><td>de plus en plus bas (<b>LL</b>)</td><td>des SELL sur les sommets</td></tr>
<tr><td>⚪ Range</td><td>au même niveau</td><td>au même niveau</td><td>acheter en bas, vendre en haut… ou attendre</td></tr></table>
<div class="box tip"><b class="t">Abréviations anglaises</b>HH = Higher High · HL = Higher Low · LH = Lower High · LL = Lower Low. Tu les verras partout, y compris dans nos lives.</div>`,
en:`<p>Market <b>structure</b> is how price builds its highs and lows. It's the first thing to look at on a chart.</p>
${chStruct('en')}
<table><tr><th>Structure</th><th>Highs</th><th>Lows</th><th>We look for…</th></tr>
<tr><td>🟢 Bullish</td><td>higher (<b>HH</b>)</td><td>higher (<b>HL</b>)</td><td>BUYs at the lows</td></tr>
<tr><td>🔴 Bearish</td><td>lower (<b>LH</b>)</td><td>lower (<b>LL</b>)</td><td>SELLs at the highs</td></tr>
<tr><td>⚪ Range</td><td>at the same level</td><td>at the same level</td><td>buy low, sell high… or wait</td></tr></table>
<div class="box tip"><b class="t">Abbreviations</b>HH = Higher High · HL = Higher Low · LH = Lower High · LL = Lower Low. You'll see them everywhere, including in our lives.</div>`}},
{t:{fr:"BOS et CHoCH : cassures de structure",en:"BOS and CHoCH: structure breaks"},s:{fr:"Savoir si la tendance continue ou change.",en:"Know whether the trend continues or changes."},
b:{fr:`<h2>BOS – Break of Structure</h2><p>Une <b>cassure dans le sens de la tendance</b>. En hausse, le prix clôture au-dessus du dernier sommet : la tendance <b>continue</b>.</p>
<h2>CHoCH – Change of Character</h2><p>La <b>première cassure dans le sens inverse</b>. En baisse, le prix casse enfin le dernier LH : les vendeurs perdent le contrôle, un retournement est <b>possible</b>.</p>
${chChoch('fr')}
<ul><li>Un BOS confirme : on continue à trader dans le même sens.</li><li>Un CHoCH alerte : on arrête de trader l'ancienne tendance et on attend une confirmation de la nouvelle.</li><li>On parle de cassure quand une bougie <b>clôture</b> au-delà du niveau, pas quand une mèche le dépasse.</li></ul>
<div class="box ex"><b class="t">Sur les petites unités</b>C'est un CHoCH sur M5 ou M1, dans une zone repérée sur H4, qui sert souvent de signal d'entrée en live (voir chapitre 2).</div>`,
en:`<h2>BOS – Break of Structure</h2><p>A <b>break in the direction of the trend</b>. In an uptrend, price closes above the last high: the trend <b>continues</b>.</p>
<h2>CHoCH – Change of Character</h2><p>The <b>first break in the opposite direction</b>. In a downtrend, price finally breaks the last LH: sellers are losing control, a reversal is <b>possible</b>.</p>
${chChoch('en')}
<ul><li>A BOS confirms: keep trading in the same direction.</li><li>A CHoCH warns: stop trading the old trend and wait for confirmation of the new one.</li><li>It's a break when a candle <b>closes</b> beyond the level, not when a wick pokes through.</li></ul>
<div class="box ex"><b class="t">On lower timeframes</b>A CHoCH on M5 or M1, inside a zone spotted on H4, is often the entry signal in our lives (see chapter 2).</div>`}},
{t:{fr:"Zones d'offre et de demande",en:"Supply and demand zones"},s:{fr:"Les fameuses SELL ZONE et BUY ZONE.",en:"The famous SELL ZONE and BUY ZONE."},
b:{fr:`<p>Avant un mouvement violent, le prix fait souvent une petite pause (une « base »). C'est là que de gros ordres ont été placés. Quand le prix revient sur cette base, une partie de ces ordres peut encore réagir.</p>
${chSD('fr')}
<ul><li><b>Zone de demande (BUY ZONE)</b> : la base <b>avant une forte hausse</b>. On y cherche des achats.</li><li><b>Zone d'offre (SELL ZONE)</b> : la base <b>avant une forte baisse</b>. On y cherche des ventes.</li></ul>
<h2>Comment la tracer</h2><ol class="steps"><li>Repère un mouvement fort (grandes bougies dans le même sens).</li><li>Remonte à la dernière petite consolidation (ou la dernière bougie opposée) juste avant.</li><li>Trace un rectangle du plus haut au plus bas de cette base.</li><li>Prolonge-le vers la droite et attends le retour du prix.</li></ol>
<div class="box tip"><b class="t">Une bonne zone</b>Départ explosif, peu de temps passé dans la base, pas encore « touchée » depuis, et dans le sens de la tendance de fond.</div>`,
en:`<p>Before a violent move, price often pauses briefly (a "base"). That's where big orders were placed. When price returns to that base, some of those orders may still react.</p>
${chSD('en')}
<ul><li><b>Demand zone (BUY ZONE)</b>: the base <b>before a strong rally</b>. Look for buys there.</li><li><b>Supply zone (SELL ZONE)</b>: the base <b>before a strong drop</b>. Look for sells there.</li></ul>
<h2>How to draw it</h2><ol class="steps"><li>Find a strong move (big candles in one direction).</li><li>Go back to the last small consolidation (or last opposite candle) just before it.</li><li>Draw a rectangle from that base's high to its low.</li><li>Extend it to the right and wait for price to return.</li></ol>
<div class="box tip"><b class="t">A good zone</b>Explosive departure, little time spent in the base, not yet "touched" since, and aligned with the higher-timeframe trend.</div>`}},
{t:{fr:"La liquidité",en:"Liquidity"},s:{fr:"Pourquoi le prix va chercher les Stop Loss.",en:"Why price hunts Stop Losses."},
b:{fr:`<p>Les gros acteurs ont besoin de beaucoup de contreparties pour remplir leurs ordres. Où les trouver ? Là où les petits traders ont placé leurs <b>Stop Loss</b> et leurs ordres en attente : c'est la <b>liquidité</b>.</p>
<h2>Où se cache la liquidité</h2><ul><li>Au-dessus des <b>sommets égaux</b> (double top) et sous les <b>creux égaux</b>.</li><li>Au-dessus du plus haut et sous le plus bas de la veille et de la session asiatique.</li><li>Autour des chiffres ronds (3 850, 3 900…).</li></ul>
<h2>Le « sweep » (balayage)</h2><p>Le prix dépasse rapidement un sommet ou un creux évident (il déclenche les stops), puis repart violemment dans l'autre sens. Beaucoup de débutants se font sortir juste avant le vrai mouvement.</p>
<div class="box tip"><b class="t">Ce que ça change pour toi</b><ul><li>Ne place pas ton SL <b>exactement</b> sur un sommet/creux évident : ajoute une marge.</li><li>Un sweep de liquidité suivi d'un CHoCH dans une zone clé est un signal très surveillé.</li><li>Dans nos captures, « $$$ » désigne une zone de liquidité.</li></ul></div>`,
en:`<p>Big players need lots of counterparties to fill their orders. Where do they find them? Where small traders placed their <b>Stop Losses</b> and pending orders: that's <b>liquidity</b>.</p>
<h2>Where liquidity hides</h2><ul><li>Above <b>equal highs</b> (double top) and below <b>equal lows</b>.</li><li>Above the previous day's and Asian session's high, and below their low.</li><li>Around round numbers (3,850, 3,900…).</li></ul>
<h2>The sweep</h2><p>Price quickly pokes past an obvious high or low (triggering stops), then reverses sharply. Many beginners get stopped out right before the real move.</p>
<div class="box tip"><b class="t">What it means for you</b><ul><li>Don't put your SL <b>exactly</b> on an obvious high/low: add a buffer.</li><li>A liquidity sweep followed by a CHoCH at a key zone is a closely watched signal.</li><li>In our screenshots, "$$$" marks a liquidity zone.</li></ul></div>`}},
{t:{fr:"Premium, discount et OTE",en:"Premium, discount and OTE"},s:{fr:"Acheter « pas cher », vendre « cher ».",en:"Buy cheap, sell expensive."},
b:{fr:`<p>Trace un Fibonacci sur le dernier grand mouvement. Le niveau <b>50 %</b> coupe la zone en deux :</p>
<ul><li><b>Zone premium</b> (au-dessus de 50 %) : le prix est « cher ». C'est là qu'on préfère <b>vendre</b>.</li><li><b>Zone discount</b> (en dessous de 50 %) : le prix est « bon marché ». C'est là qu'on préfère <b>acheter</b>.</li></ul>
<h2>L'OTE (Optimal Trade Entry)</h2><p>La zone de retracement entre <b>62 % et 79 %</b> environ. C'est souvent là que le prix termine sa correction avant de repartir dans le sens de la tendance. Les niveaux 0,705 et 0,718 que tu vois sur nos graphiques (« SELL ZONE [0,718] », « BUY [OTE] ») sont dans cette zone.</p>
<div class="box ex"><b class="t">Exemple</b>L'Or baisse de 3 912 à 3 835, puis remonte. Fibonacci tracé du sommet au creux : l'OTE se situe environ entre 3 883 et 3 896. Si une zone d'offre H4 se trouve aussi là, c'est une zone de vente de qualité.</div>`,
en:`<p>Draw a Fibonacci on the last big move. The <b>50%</b> level splits it in two:</p>
<ul><li><b>Premium zone</b> (above 50%): price is "expensive". That's where we prefer to <b>sell</b>.</li><li><b>Discount zone</b> (below 50%): price is "cheap". That's where we prefer to <b>buy</b>.</li></ul>
<h2>OTE (Optimal Trade Entry)</h2><p>The retracement zone between roughly <b>62% and 79%</b>. Price often ends its pullback there before resuming the trend. The 0.705 and 0.718 levels on our charts ("SELL ZONE [0.718]", "BUY [OTE]") sit in this zone.</p>
<div class="box ex"><b class="t">Example</b>Gold drops from 3,912 to 3,835, then bounces. Fibonacci from the high to the low: the OTE sits roughly between 3,883 and 3,896. If an H4 supply zone is also there, it's a quality sell zone.</div>`}}
]},
{t:{fr:"Le Top-Down Analysis",en:"Top-down analysis"},d:{fr:"Analyser du grand vers le petit, étape par étape.",en:"Analyse from big to small, step by step."},
lessons:[
{t:{fr:"Le principe du top-down",en:"The top-down principle"},s:{fr:"Trois unités de temps, trois rôles.",en:"Three timeframes, three roles."},
b:{fr:`<p>Le <b>top-down analysis</b>, c'est analyser le marché <b>du haut vers le bas</b> : on commence par la grande unité de temps pour connaître la direction, puis on descend pour trouver la zone, et enfin l'entrée précise.</p>
<table><tr><th>Étape</th><th>Unité</th><th>Question</th><th>Résultat</th></tr>
<tr><td>① Biais</td><td>D1 / H4</td><td>Quelle est la tendance de fond ?</td><td>« Je cherche des SELL » ou « des BUY »</td></tr>
<tr><td>② Zone</td><td>H1 (ou M15)</td><td>Où le prix pourrait-il réagir ?</td><td>Une SELL ZONE ou une BUY ZONE</td></tr>
<tr><td>③ Entrée</td><td>M5 / M1</td><td>Le prix confirme-t-il dans ma zone ?</td><td>Entrée, SL, TP précis</td></tr></table>
<div class="box tip"><b class="t">Pourquoi c'est puissant</b>Tu trades dans le sens des gros acteurs (grande unité), à un endroit logique (zone), avec un petit Stop Loss (petite unité). Résultat : de meilleurs ratios risque/rendement.</div>
<div class="box warn"><b class="t">L'erreur classique</b>Ne regarder que le M1 ou le M5. Tu vois des signaux partout… souvent contre la tendance de fond.</div>`,
en:`<p><b>Top-down analysis</b> means analysing the market <b>from the top down</b>: start with the higher timeframe to know the direction, then go down to find the zone, and finally the precise entry.</p>
<table><tr><th>Step</th><th>Timeframe</th><th>Question</th><th>Result</th></tr>
<tr><td>① Bias</td><td>D1 / H4</td><td>What's the underlying trend?</td><td>"I'm looking for SELLs" or "BUYs"</td></tr>
<tr><td>② Zone</td><td>H1 (or M15)</td><td>Where could price react?</td><td>A SELL ZONE or BUY ZONE</td></tr>
<tr><td>③ Entry</td><td>M5 / M1</td><td>Is price confirming in my zone?</td><td>Precise entry, SL, TP</td></tr></table>
<div class="box tip"><b class="t">Why it's powerful</b>You trade with the big players (higher timeframe), at a logical place (zone), with a small Stop Loss (lower timeframe). Result: better risk/reward ratios.</div>
<div class="box warn"><b class="t">The classic mistake</b>Only looking at M1 or M5. You see signals everywhere… often against the bigger trend.</div>`}},
{t:{fr:"Étape 1 : le biais (D1 / H4)",en:"Step 1: the bias (D1 / H4)"},s:{fr:"Décider si on cherche des achats ou des ventes.",en:"Decide whether to look for buys or sells."},
b:{fr:`<ol class="steps"><li>Ouvre <b>XAUUSD en D1</b> sur TradingView. Zoome pour voir 3 à 6 mois.</li><li>Identifie la structure : HH/HL (haussier) ou LH/LL (baissier) ?</li><li>Marque les grandes zones (sommets et creux majeurs, zones d'offre/demande) avec un rectangle d'une couleur dédiée.</li><li>Passe en <b>H4</b> : même travail sur les 2 à 4 dernières semaines.</li><li>Écris ton biais en texte sur le graphique : « Biais : SELL tant que 3 912 n'est pas cassé ».</li></ol>
${chTD1('fr')}
<div class="box tip"><b class="t">Si D1 et H4 ne sont pas d'accord</b>Le H4 corrige peut-être contre le D1. Sois plus prudent, réduis ton risque ou attends que les deux s'alignent.</div>`,
en:`<ol class="steps"><li>Open <b>XAUUSD on D1</b> in TradingView. Zoom out to see 3 to 6 months.</li><li>Identify the structure: HH/HL (bullish) or LH/LL (bearish)?</li><li>Mark the big zones (major highs and lows, supply/demand) with a rectangle in a dedicated colour.</li><li>Switch to <b>H4</b>: same work on the last 2 to 4 weeks.</li><li>Write your bias on the chart: "Bias: SELL while 3,912 holds".</li></ol>
${chTD1('en')}
<div class="box tip"><b class="t">If D1 and H4 disagree</b>H4 may be correcting against D1. Be more careful, reduce your risk or wait for both to line up.</div>`}},
{t:{fr:"Étape 2 : la zone (H1)",en:"Step 2: the zone (H1)"},s:{fr:"Affiner l'endroit où on attend le prix.",en:"Refine where we wait for price."},
b:{fr:`<ol class="steps"><li>Passe en <b>H1</b>. Tes zones H4 sont toujours visibles.</li><li>Repère la zone H4 la plus proche dans le sens de ton biais (une SELL ZONE si tu es vendeur).</li><li>Affine-la sur H1 : la dernière base avant la chute, ou la zone OTE (62–79 %) du dernier mouvement.</li><li>Cherche la <b>confluence</b> : zone H4 + OTE + liquidité au-dessus d'un sommet égal…</li><li>Pose une <b>alerte</b> TradingView au bord de la zone. Tu n'as plus besoin de fixer l'écran.</li></ol>
${chTD2('fr')}
<div class="box ex"><b class="t">Ici</b>Le prix remonte dans la zone H4 (3 870–3 884). Juste au-dessus des derniers sommets, vers 3 879, se trouve de la liquidité ($$$) : le prix pourrait aller la chercher avant de baisser. On attend maintenant un signal sur M5.</div>`,
en:`<ol class="steps"><li>Switch to <b>H1</b>. Your H4 zones are still visible.</li><li>Find the nearest H4 zone in the direction of your bias (a SELL ZONE if you're a seller).</li><li>Refine it on H1: the last base before the drop, or the OTE zone (62–79%) of the last move.</li><li>Look for <b>confluence</b>: H4 zone + OTE + liquidity above equal highs…</li><li>Set a TradingView <b>alert</b> at the edge of the zone. No more staring at the screen.</li></ol>
${chTD2('en')}
<div class="box ex"><b class="t">Here</b>Price rallies into the H4 zone (3,870–3,884). Just above the latest highs, near 3,879, sits liquidity ($$$): price may grab it before dropping. Now we wait for an M5 signal.</div>`}},
{t:{fr:"Étape 3 : l'entrée (M5 / M1)",en:"Step 3: the entry (M5 / M1)"},s:{fr:"Attendre la confirmation et poser le trade.",en:"Wait for confirmation and place the trade."},
b:{fr:`<ol class="steps"><li>Quand l'alerte sonne, passe en <b>M5</b> (ou M1).</li><li>Dans la zone, le prix monte encore un peu… <b>n'entre pas tout de suite</b>.</li><li>Attends le <b>CHoCH</b> : le prix casse le dernier creux M5. Les vendeurs reprennent la main.</li><li>Entrée au marché ou sur le petit retour (retest) du niveau cassé.</li><li><b>SL</b> au-dessus du sommet de la zone (avec une marge). <b>TP</b> sur le prochain creux ou la prochaine zone de demande.</li><li>Calcule ton lot (règle du 1 %), puis passe l'ordre sur MT5.</li></ol>
${chTD3('fr')}
<div class="box ex"><b class="t">Le plan</b>SELL 3 872 · SL 3 882 (10 $ = 100 pips) · TP 3 850 (22 $ = 220 pips). Ratio ≈ <b>1:2,2</b>. Capital 1 000 $, risque 1 % = 10 $ → 10 ÷ (100 × 10) = <b>0,01 lot</b>.</div>`,
en:`<ol class="steps"><li>When the alert fires, switch to <b>M5</b> (or M1).</li><li>Inside the zone, price pushes a little higher… <b>don't enter yet</b>.</li><li>Wait for the <b>CHoCH</b>: price breaks the last M5 low. Sellers take over.</li><li>Enter at market or on the small retest of the broken level.</li><li><b>SL</b> above the zone's high (with a buffer). <b>TP</b> at the next low or demand zone.</li><li>Calculate your lot (1% rule), then place the order on MT5.</li></ol>
${chTD3('en')}
<div class="box ex"><b class="t">The plan</b>SELL 3,872 · SL 3,882 ($10 = 100 pips) · TP 3,850 ($22 = 220 pips). Ratio ≈ <b>1:2.2</b>. Capital $1,000, 1% risk = $10 → 10 ÷ (100 × 10) = <b>0.01 lot</b>.</div>`}},
{t:{fr:"Ta checklist top-down",en:"Your top-down checklist"},s:{fr:"À cocher avant chaque trade.",en:"Tick it before every trade."},
b:{fr:`<div class="check" data-k="td">
<label><input type="checkbox"> <b>D1/H4</b> : j'ai identifié la structure et écrit mon biais (BUY ou SELL).</label>
<label><input type="checkbox"> <b>D1/H4</b> : j'ai marqué les zones majeures et la liquidité évidente.</label>
<label><input type="checkbox"> <b>Calendrier</b> : pas d'annonce forte dans les 30 prochaines minutes.</label>
<label><input type="checkbox"> <b>H1</b> : le prix est dans (ou proche de) une zone dans le sens de mon biais.</label>
<label><input type="checkbox"> <b>H1</b> : il y a au moins une confluence (OTE, liquidité, ligne de tendance…).</label>
<label><input type="checkbox"> <b>M5/M1</b> : j'ai un signal confirmé (CHoCH, avalement, étoile filante/marteau…).</label>
<label><input type="checkbox"> <b>Plan</b> : entrée, SL et TP sont fixés, ratio d'au moins 1:2.</label>
<label><input type="checkbox"> <b>Risque</b> : mon lot correspond à 1 % maximum de mon capital.</label>
<label><input type="checkbox"> <b>Moi</b> : je suis calme, je ne cherche pas à « me refaire ».</label></div>
<p class="checkres"></p>
<div class="box tip"><b class="t">Règle</b>S'il manque une seule case, <b>pas de trade</b>. Le marché sera encore là demain.</div>`,
en:`<div class="check" data-k="td">
<label><input type="checkbox"> <b>D1/H4</b>: I've identified the structure and written my bias (BUY or SELL).</label>
<label><input type="checkbox"> <b>D1/H4</b>: I've marked the major zones and obvious liquidity.</label>
<label><input type="checkbox"> <b>Calendar</b>: no high-impact news in the next 30 minutes.</label>
<label><input type="checkbox"> <b>H1</b>: price is in (or near) a zone in the direction of my bias.</label>
<label><input type="checkbox"> <b>H1</b>: there's at least one confluence (OTE, liquidity, trend line…).</label>
<label><input type="checkbox"> <b>M5/M1</b>: I have a confirmed signal (CHoCH, engulfing, shooting star/hammer…).</label>
<label><input type="checkbox"> <b>Plan</b>: entry, SL and TP are set, ratio of at least 1:2.</label>
<label><input type="checkbox"> <b>Risk</b>: my lot equals 1% of my capital at most.</label>
<label><input type="checkbox"> <b>Me</b>: I'm calm, I'm not trying to "win it back".</label></div>
<p class="checkres"></p>
<div class="box tip"><b class="t">Rule</b>If a single box is missing, <b>no trade</b>. The market will still be there tomorrow.</div>`}}
]}
]};

const LV5={n:5,icon:"brain",t:{fr:"Gestion et psychologie",en:"Management and psychology"},d:{fr:"Le plan de trading, la gestion des positions et le mental : ce qui sépare les traders qui durent des autres.",en:"Trading plan, position management and mindset: what separates traders who last from the rest."},
chapters:[
{t:{fr:"Ton plan de trading",en:"Your trading plan"},d:{fr:"Écrire tes règles et mesurer tes résultats.",en:"Write your rules and measure your results."},
lessons:[
{t:{fr:"Écrire son plan de trading",en:"Writing your trading plan"},s:{fr:"Tes règles, noir sur blanc.",en:"Your rules, in black and white."},
b:{fr:`<p>Un trader sans plan, c'est un conducteur sans itinéraire. Le plan te dit <b>quoi faire avant</b> que les émotions arrivent.</p>
<div class="box ex"><b class="t">Modèle de plan SERGIO FX (à recopier et compléter)</b>
<b>1. Actif</b> : XAUUSD uniquement.<br><b>2. Horaires</b> : 08:00–11:30 et 13:30–16:30 (heure de Lomé). Pas de trade 15 min avant/après une annonce forte.<br><b>3. Méthode</b> : top-down D1/H4 → H1 → M5. Entrée seulement après confirmation dans une zone.<br><b>4. Risque</b> : 1 % par trade, maximum 2 trades perdants par jour, puis j'arrête.<br><b>5. Ratio minimum</b> : 1:2.<br><b>6. Gestion</b> : SL au break-even au TP1, clôture de 50 % au TP1.<br><b>7. Journal</b> : chaque trade noté avec capture avant/après.<br><b>8. Revue</b> : chaque samedi, je relis la semaine.</div>
<div class="box tip"><b class="t">Le plus important</b>Ton plan doit être <b>simple</b> et tenir sur une page. Tu dois pouvoir le suivre même un jour de fatigue.</div>`,
en:`<p>A trader without a plan is a driver without a route. The plan tells you <b>what to do before</b> emotions show up.</p>
<div class="box ex"><b class="t">SERGIO FX plan template (copy and fill in)</b>
<b>1. Asset</b>: XAUUSD only.<br><b>2. Hours</b>: 08:00–11:30 and 13:30–16:30 (GMT). No trades 15 min before/after high-impact news.<br><b>3. Method</b>: top-down D1/H4 → H1 → M5. Entry only after confirmation in a zone.<br><b>4. Risk</b>: 1% per trade, max 2 losing trades per day, then I stop.<br><b>5. Minimum ratio</b>: 1:2.<br><b>6. Management</b>: SL to break-even at TP1, close 50% at TP1.<br><b>7. Journal</b>: every trade logged with before/after screenshots.<br><b>8. Review</b>: every Saturday, I review the week.</div>
<div class="box tip"><b class="t">Most important</b>Your plan must be <b>simple</b> and fit on one page. You should be able to follow it even on a tired day.</div>`}},
{t:{fr:"Gérer une position gagnante",en:"Managing a winning position"},s:{fr:"TP partiels, break-even et laisser courir.",en:"Partial TPs, break-even and letting it run."},
b:{fr:`<p>Entrer est facile. Bien <b>sortir</b> fait la différence.</p>
<table><tr><th>Méthode</th><th>Comment</th><th>Pour qui</th></tr>
<tr><td><b>TP unique</b></td><td>Tout se ferme au TP</td><td>Débutants : simple et clair</td></tr>
<tr><td><b>TP partiels</b></td><td>50 % au TP1, 50 % au TP2 avec SL au break-even</td><td>Sécuriser tout en visant plus loin</td></tr>
<tr><td><b>Trailing</b></td><td>Le SL suit le prix sous chaque nouveau creux (ou au-dessus de chaque sommet)</td><td>Grandes tendances</td></tr></table>
<h2>Quand mettre le SL au break-even ?</h2><ul><li>Quand le prix a parcouru <b>au moins 1 fois ton risque</b> (ratio 1:1), ou au TP1.</li><li>Pas trop tôt : un break-even trop rapide te fait sortir à 0 sur de bons trades.</li></ul>
<div class="box warn"><b class="t">Piège</b>Fermer un trade gagnant trop tôt « par peur », mais laisser courir les perdants « en espérant ». C'est exactement l'inverse qu'il faut faire.</div>`,
en:`<p>Getting in is easy. Getting <b>out</b> well makes the difference.</p>
<table><tr><th>Method</th><th>How</th><th>For whom</th></tr>
<tr><td><b>Single TP</b></td><td>Everything closes at TP</td><td>Beginners: simple and clear</td></tr>
<tr><td><b>Partial TPs</b></td><td>50% at TP1, 50% at TP2 with SL at break-even</td><td>Lock in profit while aiming further</td></tr>
<tr><td><b>Trailing</b></td><td>The SL follows price under each new low (or above each high)</td><td>Big trends</td></tr></table>
<h2>When to move the SL to break-even?</h2><ul><li>When price has moved <b>at least 1× your risk</b> (1:1), or at TP1.</li><li>Not too early: a hasty break-even takes you out at 0 on good trades.</li></ul>
<div class="box warn"><b class="t">Trap</b>Closing winners too early "out of fear" but letting losers run "hoping". Do exactly the opposite.</div>`}},
{t:{fr:"Le journal de trading",en:"The trading journal"},s:{fr:"Ton meilleur professeur.",en:"Your best teacher."},
b:{fr:`<p>Chaque trade noté est une leçon gratuite. Après 20 trades, ton journal te dit exactement quoi corriger.</p>
<table><tr><th>Date</th><th>Heure</th><th>Sens</th><th>Entrée</th><th>SL</th><th>TP</th><th>Lot</th><th>Résultat</th><th>Raison</th><th>Émotion</th></tr>
<tr><td>17/11</td><td>09:12</td><td>SELL</td><td>3 871,75</td><td>3 875,37</td><td>3 860,06</td><td>0,02</td><td>+23 $</td><td>SELL ZONE H4 + CHoCH M5</td><td>Calme</td></tr>
<tr><td>17/11</td><td>14:25</td><td>SELL</td><td>3 864,01</td><td>3 868,89</td><td>3 836,17</td><td>0,02</td><td>−10 $</td><td>Entrée sans confirmation</td><td>Impatient</td></tr></table>
<ul><li>Fais une <b>capture avant</b> (ton plan) et <b>après</b> (le résultat).</li><li>Note honnêtement ton émotion : c'est souvent là que se cache l'erreur.</li><li>Un simple cahier, Google Sheets ou une application de journal font l'affaire.</li></ul>`,
en:`<p>Every logged trade is a free lesson. After 20 trades, your journal tells you exactly what to fix.</p>
<table><tr><th>Date</th><th>Time</th><th>Side</th><th>Entry</th><th>SL</th><th>TP</th><th>Lot</th><th>Result</th><th>Reason</th><th>Emotion</th></tr>
<tr><td>17/11</td><td>09:12</td><td>SELL</td><td>3,871.75</td><td>3,875.37</td><td>3,860.06</td><td>0.02</td><td>+$23</td><td>H4 SELL ZONE + M5 CHoCH</td><td>Calm</td></tr>
<tr><td>17/11</td><td>14:25</td><td>SELL</td><td>3,864.01</td><td>3,868.89</td><td>3,836.17</td><td>0.02</td><td>−$10</td><td>Entry without confirmation</td><td>Impatient</td></tr></table>
<ul><li>Take a <b>before</b> screenshot (your plan) and an <b>after</b> one (the result).</li><li>Be honest about your emotion: that's often where the mistake hides.</li><li>A notebook, Google Sheets or a journal app all work.</li></ul>`}},
{t:{fr:"Tes statistiques : savoir si tu progresses",en:"Your stats: knowing if you're improving"},s:{fr:"Taux de réussite, ratio moyen et espérance.",en:"Win rate, average ratio and expectancy."},
b:{fr:`<ul><li><b>Taux de réussite</b> = trades gagnants ÷ total des trades.</li><li><b>Gain moyen</b> et <b>perte moyenne</b> (en $ ou en R, R = ton risque).</li><li><b>Espérance</b> = (taux de réussite × gain moyen) − (taux d'échec × perte moyenne).</li></ul>
<div class="box ex"><b class="t">Exemple sur 20 trades à 10 $ de risque</b>8 gagnants à +20 $ en moyenne, 12 perdants à −10 $.<br>Taux de réussite : 40 %.<br>Espérance : 0,40 × 20 − 0,60 × 10 = 8 − 6 = <b>+2 $ par trade</b>.<br>Tu perds plus souvent que tu ne gagnes… et tu es quand même gagnant.</div>
<p>Si ton espérance est négative après 30 à 50 trades, ne change pas tout : regarde ton journal pour trouver <b>l'erreur qui revient</b> (entrées sans confirmation, SL déplacé, trades pendant les news…).</p>`,
en:`<ul><li><b>Win rate</b> = winning trades ÷ total trades.</li><li><b>Average win</b> and <b>average loss</b> (in $ or in R, where R = your risk).</li><li><b>Expectancy</b> = (win rate × average win) − (loss rate × average loss).</li></ul>
<div class="box ex"><b class="t">Example over 20 trades risking $10</b>8 winners averaging +$20, 12 losers at −$10.<br>Win rate: 40%.<br>Expectancy: 0.40 × 20 − 0.60 × 10 = 8 − 6 = <b>+$2 per trade</b>.<br>You lose more often than you win… and you're still profitable.</div>
<p>If your expectancy is negative after 30 to 50 trades, don't change everything: check your journal for <b>the recurring mistake</b> (entries without confirmation, moved SL, trading the news…).</p>`}}
]},
{t:{fr:"La psychologie du trader",en:"Trading psychology"},d:{fr:"Maîtriser ses émotions et tenir sur la durée.",en:"Master your emotions and last."},
lessons:[
{t:{fr:"Les émotions qui coûtent cher",en:"Expensive emotions"},s:{fr:"Peur, avidité, FOMO et revanche.",en:"Fear, greed, FOMO and revenge."},
b:{fr:`<table><tr><th>Émotion</th><th>Ce qu'elle te fait faire</th><th>Antidote</th></tr>
<tr><td><b>Peur</b></td><td>Sortir trop tôt, ne pas prendre un bon signal</td><td>Un risque petit (1 %) : perdre n'est plus grave</td></tr>
<tr><td><b>Avidité</b></td><td>Lot trop gros, refuser de prendre son TP</td><td>TP fixé à l'avance, lot calculé</td></tr>
<tr><td><b>FOMO</b> (peur de rater)</td><td>Entrer en retard, au milieu du mouvement</td><td>« Pas dans ma zone = pas mon trade »</td></tr>
<tr><td><b>Revanche</b></td><td>Retrader tout de suite après une perte pour « se refaire »</td><td>Règle : après 2 pertes, j'arrête pour la journée</td></tr>
<tr><td><b>Excès de confiance</b></td><td>Après 3 gains, doubler le lot</td><td>Même risque, toujours</td></tr></table>
<div class="box tip"><b class="t">Le bon état d'esprit</b>Un trade n'est qu'un trade parmi les 100 prochains. Ce qui compte, c'est de bien appliquer ton plan, pas le résultat d'un seul trade.</div>`,
en:`<table><tr><th>Emotion</th><th>What it makes you do</th><th>Antidote</th></tr>
<tr><td><b>Fear</b></td><td>Exit too early, skip a good signal</td><td>Small risk (1%): losing is no big deal</td></tr>
<tr><td><b>Greed</b></td><td>Lot too big, refusing to take profit</td><td>TP set in advance, calculated lot</td></tr>
<tr><td><b>FOMO</b> (fear of missing out)</td><td>Entering late, mid-move</td><td>"Not in my zone = not my trade"</td></tr>
<tr><td><b>Revenge</b></td><td>Trading again right after a loss to "win it back"</td><td>Rule: after 2 losses, I stop for the day</td></tr>
<tr><td><b>Overconfidence</b></td><td>Doubling the lot after 3 wins</td><td>Same risk, always</td></tr></table>
<div class="box tip"><b class="t">The right mindset</b>One trade is just one of the next 100. What matters is executing your plan well, not the result of a single trade.</div>`}},
{t:{fr:"Encaisser une série de pertes",en:"Handling a losing streak"},s:{fr:"Pourquoi protéger son capital avant tout.",en:"Why protecting capital comes first."},
b:{fr:`<p>Les séries de pertes arrivent à <b>tout le monde</b>. Ce qui compte, c'est leur taille.</p>
<table><tr><th>Perte sur le compte</th><th>Gain nécessaire pour revenir à zéro</th></tr><tr><td>−10 %</td><td>+11 %</td></tr><tr><td>−20 %</td><td>+25 %</td></tr><tr><td>−50 %</td><td>+100 %</td></tr><tr><td>−80 %</td><td>+400 %</td></tr></table>
<p>Plus tu perds, plus c'est dur de revenir. Avec 1 % de risque par trade, il faut une série énorme pour faire de gros dégâts.</p>
<h2>Que faire pendant une mauvaise série ?</h2><ul><li>Réduire le risque (0,5 % au lieu de 1 %).</li><li>Faire une pause de 1 ou 2 jours.</li><li>Relire le journal : erreur de méthode ou simple malchance ?</li><li>Revenir en démo quelques jours si besoin.</li></ul>`,
en:`<p>Losing streaks happen to <b>everyone</b>. What matters is their size.</p>
<table><tr><th>Account loss</th><th>Gain needed to break even</th></tr><tr><td>−10%</td><td>+11%</td></tr><tr><td>−20%</td><td>+25%</td></tr><tr><td>−50%</td><td>+100%</td></tr><tr><td>−80%</td><td>+400%</td></tr></table>
<p>The more you lose, the harder it is to recover. At 1% risk per trade, it takes a huge streak to do serious damage.</p>
<h2>What to do during a bad streak?</h2><ul><li>Reduce risk (0.5% instead of 1%).</li><li>Take a 1 or 2-day break.</li><li>Reread your journal: method error or just bad luck?</li><li>Go back to demo for a few days if needed.</li></ul>`}},
{t:{fr:"Discipline et routine",en:"Discipline and routine"},s:{fr:"Les habitudes des traders qui durent.",en:"The habits of traders who last."},
b:{fr:`<ul><li><b>Toujours la même routine</b> : calendrier, top-down, alertes, attente.</li><li><b>Limite quotidienne</b> : 2 trades perdants ou −2 % → on ferme MT5 pour la journée.</li><li><b>Pas de trade fatigué</b>, énervé, ou sous pression d'argent.</li><li><b>Hors des horaires</b> : on ne regarde pas le prix toutes les 5 minutes.</li><li><b>Revue hebdomadaire</b> le week-end : ce qui a marché, ce qui doit changer.</li><li><b>Hygiène de vie</b> : sommeil, sport, pauses. Un cerveau reposé prend de meilleures décisions.</li></ul>
<div class="box tip"><b class="t">À retenir</b>La discipline, c'est faire ce qui est prévu… surtout quand tu n'en as pas envie.</div>`,
en:`<ul><li><b>Same routine every time</b>: calendar, top-down, alerts, wait.</li><li><b>Daily limit</b>: 2 losing trades or −2% → close MT5 for the day.</li><li><b>No trading tired</b>, angry or under money pressure.</li><li><b>Outside trading hours</b>: don't check price every 5 minutes.</li><li><b>Weekly review</b> at the weekend: what worked, what must change.</li><li><b>Lifestyle</b>: sleep, exercise, breaks. A rested brain makes better decisions.</li></ul>
<div class="box tip"><b class="t">Remember</b>Discipline is doing what you planned… especially when you don't feel like it.</div>`}},
{t:{fr:"Trader autour des annonces",en:"Trading around the news"},s:{fr:"Pourquoi on se met souvent à l'écart.",en:"Why we often step aside."},
b:{fr:`<p>Pendant une annonce forte (NFP, CPI, Fed), l'Or peut bouger de 15 à 40 $ en quelques minutes, dans les deux sens.</p>
<ul><li><b>Avant</b> : pas de nouvelle position 15 à 30 minutes avant. Si tu as un trade en gain, sécurise-le (break-even ou clôture partielle).</li><li><b>Pendant</b> : spreads élargis, glissements, faux mouvements. On regarde, on ne touche à rien.</li><li><b>Après</b> : attends que la poussière retombe (15–30 min). Le vrai mouvement se dessine souvent ensuite, avec de belles zones à trader.</li></ul>
<div class="box warn"><b class="t">Règle débutant</b>Ne trade jamais « l'annonce » elle-même. C'est un casino, pas une stratégie.</div>`,
en:`<p>During high-impact news (NFP, CPI, Fed), Gold can move $15 to $40 in minutes, both ways.</p>
<ul><li><b>Before</b>: no new position 15 to 30 minutes ahead. If you have a winning trade, protect it (break-even or partial close).</li><li><b>During</b>: wider spreads, slippage, fake moves. Watch, don't touch.</li><li><b>After</b>: let the dust settle (15–30 min). The real move often appears then, with good zones to trade.</li></ul>
<div class="box warn"><b class="t">Beginner rule</b>Never trade "the release" itself. It's a casino, not a strategy.</div>`}}
]},
{t:{fr:"Aller plus loin",en:"Going further"},d:{fr:"Prop firms et plan de progression.",en:"Prop firms and progression plan."},
lessons:[
{t:{fr:"Les prop firms",en:"Prop firms"},s:{fr:"Trader le capital d'une société.",en:"Trading a firm's capital."},
b:{fr:`<p>Une <b>prop firm</b> (société de trading pour compte propre) te confie un capital (5 000 $, 10 000 $, 100 000 $…) si tu réussis une <b>évaluation</b>. Tu gardes ensuite une grande partie des gains (souvent 80 % ou plus).</p>
<h2>Comment ça marche</h2><ul><li>Tu paies des frais d'inscription au challenge.</li><li>Tu dois atteindre un <b>objectif de gain</b> (ex. +8 %) sans dépasser une <b>perte journalière maximale</b> (ex. −5 %) ni une <b>perte totale maximale</b> (ex. −10 %).</li><li>Souvent 2 phases, puis un compte financé.</li></ul>
<div class="box warn"><b class="t">Avant de te lancer</b><ul><li>Sois rentable en démo et sur un petit compte réel pendant plusieurs mois.</li><li>Lis les règles en détail : chaque société a les siennes (horaires des news, week-end, lots…).</li><li>Les frais de challenge sont perdus si tu échoues : ce n'est pas un raccourci.</li></ul></div>
<p>Avec la règle du 1 % et un ratio de 1:2, les objectifs d'une prop firm deviennent atteignables sans prendre de risques fous.</p>`,
en:`<p>A <b>prop firm</b> (proprietary trading firm) gives you capital ($5,000, $10,000, $100,000…) if you pass an <b>evaluation</b>. You then keep a large share of the profits (often 80% or more).</p>
<h2>How it works</h2><ul><li>You pay a challenge fee.</li><li>You must hit a <b>profit target</b> (e.g. +8%) without breaching a <b>maximum daily loss</b> (e.g. −5%) or a <b>maximum total loss</b> (e.g. −10%).</li><li>Often 2 phases, then a funded account.</li></ul>
<div class="box warn"><b class="t">Before you start</b><ul><li>Be profitable on demo and on a small live account for several months.</li><li>Read the rules in detail: each firm has its own (news times, weekends, lots…).</li><li>Challenge fees are lost if you fail: it's not a shortcut.</li></ul></div>
<p>With the 1% rule and a 1:2 ratio, prop firm targets become reachable without taking crazy risks.</p>`}},
{t:{fr:"Ton plan de progression",en:"Your progression plan"},s:{fr:"De débutant à trader autonome.",en:"From beginner to independent trader."},
b:{fr:`<ol class="steps"><li><b>Semaines 1–2</b> : termine la formation, ouvre TradingView et un compte démo MT5.</li><li><b>Semaines 3–6</b> : 20 trades minimum en démo, top-down à chaque fois, journal rempli.</li><li><b>Mois 2</b> : petit compte réel, 0,01 lot, mêmes règles. Objectif : la discipline, pas l'argent.</li><li><b>Mois 3–6</b> : si l'espérance est positive, augmente doucement (le risque reste à 1 %, c'est le capital qui grandit).</li><li><b>Ensuite</b> : prop firm ou compte plus gros, toujours avec le même plan.</li></ol>
<div class="box tip"><b class="t">Le secret</b>Passer d'un niveau à l'autre seulement quand le précédent est maîtrisé. La patience est la compétence la plus rentable du trading.</div>`,
en:`<ol class="steps"><li><b>Weeks 1–2</b>: finish the course, open TradingView and an MT5 demo account.</li><li><b>Weeks 3–6</b>: at least 20 demo trades, top-down every time, journal filled in.</li><li><b>Month 2</b>: small live account, 0.01 lot, same rules. Goal: discipline, not money.</li><li><b>Months 3–6</b>: if expectancy is positive, scale up slowly (risk stays at 1%, the capital grows).</li><li><b>Then</b>: prop firm or a bigger account, always with the same plan.</li></ol>
<div class="box tip"><b class="t">The secret</b>Only move up a level once the previous one is mastered. Patience is the most profitable skill in trading.</div>`}}
]}
]};

function signalCard(l){return `<div class="sig"><div class="sig-h">🚨 ${L(l,'SIGNAL GRATUIT','FREE SIGNAL')} 🚨</div>
<div>🥇 XAUUSD (${L(l,'OR','GOLD')})</div><div class="sell">🔴 SELL</div>
<div>📍 ${L(l,'Entrée','Entry')} : 3868.32</div><div>❌ SL : 3878.17</div><div>✅ TP : 3834.89</div>
<div class="muted">⚠️ ${L(l,'Gérez bien votre risque la famille','Manage your risk, family')} 💪</div></div>`}
function dayline(l){const r=L(l,[['07:00','📅','Calendrier économique du jour publié dans le groupe'],['07:30','🔔','Annonce du live TikTok'],['08:00','🇬🇧','Ouverture de Londres : session 1 en live'],['08:00–11:30','🚨','Analyse en direct et signaux'],['11:30','☕','Clôture de la session du matin, bilan'],['13:30','🇺🇸','Session 2 (US) : annonces souvent à 13:30'],['16:30','📊','Fin de journée : bilan, TP/SL, rendez-vous du lendemain'],['Soir','📝','Ton journal de trading et ta revue']],
[['07:00','📅','Daily economic calendar posted in the group'],['07:30','🔔','TikTok live announcement'],['08:00','🇬🇧','London open: session 1 live'],['08:00–11:30','🚨','Live analysis and signals'],['11:30','☕','Morning session close, recap'],['13:30','🇺🇸','Session 2 (US): news often at 13:30'],['16:30','📊','End of day: recap, TP/SL, next-day meeting'],['Evening','📝','Your trading journal and review']]);
return `<div class="tl">${r.map(([h,i,t])=>`<div><b>${h}</b><span>${i}</span><p>${t}</p></div>`).join('')}</div>`}
const LV6={n:6,icon:"flag",t:{fr:"La pratique : vis le trading",en:"Practice: live the trading"},d:{fr:"La journée type, les signaux, les lives et les exercices pour passer de la théorie à la pratique.",en:"The typical day, signals, lives and exercises to go from theory to practice."},

lessons:[

b:{fr:`${dayline('fr')}
<div class="box tip"><b class="t">Ton rôle</b>Pendant les lives, ouvre ton TradingView à côté. Refais le top-down en même temps que le coach : c'est comme ça que l'œil se forme.</div>`,
en:`${dayline('en')}
<div class="box tip"><b class="t">Your role</b>During the lives, keep your TradingView open alongside. Redo the top-down with the coach: that's how your eye gets trained.</div>`}},
{t:{fr:"Lire le message du matin",en:"Reading the morning message"},s:{fr:"Calendrier économique et sessions.",en:"Economic calendar and sessions."},
b:{fr:`<div class="sig"><div>Bonjour la famille ❤️</div><div>📅 Aujourd'hui on surveille (heure de Lomé) :</div><div>• 07:00 🇬🇧 Inflation (CPI)</div><div>• 15:00 🇬🇧 Discours du gouverneur de la BoE</div><div>• 19:00 🇺🇸 Compte rendu de la Fed (FOMC)</div><div class="muted">Ça peut bouger très vite autour de ces heures ⚡</div></div>
<h2>Comment l'utiliser</h2><ul><li>Note les heures dans ton téléphone (alarme 15 min avant).</li><li>🇺🇸 = dollar = <b>l'Or réagit fort</b>. 🇬🇧 ou 🇪🇺 = impact surtout sur GBP/EUR, mais l'Or peut bouger aussi.</li><li>Pas de nouveau trade dans les 15–30 minutes autour d'une annonce forte.</li><li>Une annonce à 19:00 est après nos sessions : ferme ou sécurise tes positions avant.</li></ul>`,
en:`<div class="sig"><div>Good morning family ❤️</div><div>📅 Today we're watching (GMT):</div><div>• 07:00 🇬🇧 Inflation (CPI)</div><div>• 15:00 🇬🇧 BoE Governor speech</div><div>• 19:00 🇺🇸 Fed minutes (FOMC)</div><div class="muted">Things can move fast around these times ⚡</div></div>
<h2>How to use it</h2><ul><li>Note the times on your phone (alarm 15 min before).</li><li>🇺🇸 = dollar = <b>Gold reacts strongly</b>. 🇬🇧 or 🇪🇺 = mostly GBP/EUR, but Gold can move too.</li><li>No new trade within 15–30 minutes of high-impact news.</li><li>A 19:00 release is after our sessions: close or protect your positions before.</li></ul>`}},
{t:{fr:"Profiter des lives TikTok",en:"Getting the most from TikTok lives"},s:{fr:"Apprendre en regardant un pro trader.",en:"Learn by watching a pro trade."},
b:{fr:`<ul><li><b>Arrive à l'heure</b> : le top-down se fait souvent au début du live.</li><li><b>Prends des notes</b> : zones, biais, raison de chaque entrée.</li><li><b>Pose des questions précises</b> : « Pourquoi cette zone et pas l'autre ? » plutôt que « On achète ? ».</li><li><b>Ne copie pas à l'aveugle</b> : comprends le pourquoi, sinon tu ne sauras pas gérer le trade.</li><li><b>Respecte le chat</b> : pas de spam, pas de liens. Les modérateurs suppriment les messages hors sujet.</li></ul>
<div class="box warn"><b class="t">Attention aux arnaqueurs</b>Personne de l'équipe ne te contactera en privé pour te demander de l'argent ou tes identifiants. En cas de doute : <a href="${WA}" target="_blank" rel="noopener">+228 79 86 78 79</a>.</div>`,
en:`<ul><li><b>Be on time</b>: the top-down is often done at the start of the live.</li><li><b>Take notes</b>: zones, bias, reason for each entry.</li><li><b>Ask precise questions</b>: "Why this zone and not the other?" rather than "Do we buy?".</li><li><b>Don't copy blindly</b>: understand the why, or you won't know how to manage the trade.</li><li><b>Respect the chat</b>: no spam, no links. Moderators delete off-topic messages.</li></ul>
<div class="box warn"><b class="t">Beware of scammers</b>No one from the team will DM you asking for money or your login. If in doubt: <a href="${WA}" target="_blank" rel="noopener">+228 79 86 78 79</a>.</div>`}}
]},
{t:{fr:"Les signaux",en:"Signals"},d:{fr:"Lire, copier et suivre un signal.",en:"Read, copy and follow a signal."},
lessons:[
{t:{fr:"Lire un signal",en:"Reading a signal"},s:{fr:"Chaque ligne a un sens.",en:"Every line has a meaning."},
b:{fr:`${signalCard('fr')}
<table><tr><th>Ligne</th><th>Signification</th></tr><tr><td>XAUUSD</td><td>L'actif : l'Or contre le dollar</td></tr><tr><td>SELL / BUY</td><td>Le sens : vendre (on parie sur la baisse) ou acheter</td></tr><tr><td>Entrée / PE</td><td>Prix d'entrée (PE = point d'entrée). « PE 3883-3882 » = une petite zone d'entrée</td></tr><tr><td>SL</td><td>Stop Loss : là où on sort si on a tort</td></tr><tr><td>TP (TP1, TP2…)</td><td>Take Profit : là où on encaisse</td></tr></table>
<div class="box ex"><b class="t">Calcul rapide sur ce signal</b>Risque : 3 878,17 − 3 868,32 = 9,85 $ (≈ 98 pips). Gain visé : 3 868,32 − 3 834,89 = 33,43 $ (≈ 334 pips). Ratio ≈ <b>1:3,4</b>. Avec 0,01 lot : risque ≈ 9,85 $, gain ≈ 33,43 $.</div>`,
en:`${signalCard('en')}
<table><tr><th>Line</th><th>Meaning</th></tr><tr><td>XAUUSD</td><td>The asset: Gold against the dollar</td></tr><tr><td>SELL / BUY</td><td>Direction: sell (betting on a drop) or buy</td></tr><tr><td>Entry / PE</td><td>Entry price (PE = entry point). "PE 3883-3882" = a small entry zone</td></tr><tr><td>SL</td><td>Stop Loss: where we exit if wrong</td></tr><tr><td>TP (TP1, TP2…)</td><td>Take Profit: where we bank</td></tr></table>
<div class="box ex"><b class="t">Quick maths on this signal</b>Risk: 3,878.17 − 3,868.32 = $9.85 (≈ 98 pips). Target: 3,868.32 − 3,834.89 = $33.43 (≈ 334 pips). Ratio ≈ <b>1:3.4</b>. With 0.01 lot: risk ≈ $9.85, gain ≈ $33.43.</div>`}},
{t:{fr:"Copier un signal sur MT5 en 60 secondes",en:"Copying a signal to MT5 in 60 seconds"},s:{fr:"Au marché ou en ordre en attente.",en:"At market or as a pending order."},
b:{fr:`<h2>Le prix est encore proche de l'entrée → ordre au marché</h2>
<ol class="steps"><li>MT5 → <b>Cotations</b> → XAUUSD → <b>Trade</b>.</li><li>Type : <b>Exécution au marché</b>.</li><li>Volume : ton lot calculé (0,01 pour débuter).</li><li>Stop Loss : <b>3878.17</b> · Take Profit : <b>3834.89</b>.</li><li>Appuie sur <b>Vendre</b>. Vérifie dans l'onglet Trade que SL et TP sont bien là.</li></ol>
<h2>Le prix n'est pas encore à l'entrée → ordre en attente</h2>
<ol class="steps"><li>Type : <b>Sell Limit</b> si l'entrée est <b>au-dessus</b> du prix actuel (Buy Limit si elle est en dessous pour un achat).</li><li>Prix : le prix d'entrée du signal. Ajoute SL et TP.</li><li>Valide. L'ordre se déclenche tout seul si le prix y arrive.</li></ol>
<div class="box warn"><b class="t">Le prix est déjà parti loin ?</b>Si le prix a déjà fait une bonne partie du chemin vers le TP, <b>ne cours pas après</b>. Ton ratio serait mauvais. Un signal raté n'est pas une perte.</div>`,
en:`<h2>Price is still near the entry → market order</h2>
<ol class="steps"><li>MT5 → <b>Quotes</b> → XAUUSD → <b>Trade</b>.</li><li>Type: <b>Market execution</b>.</li><li>Volume: your calculated lot (0.01 to start).</li><li>Stop Loss: <b>3878.17</b> · Take Profit: <b>3834.89</b>.</li><li>Tap <b>Sell</b>. Check in the Trade tab that SL and TP are set.</li></ol>
<h2>Price isn't at the entry yet → pending order</h2>
<ol class="steps"><li>Type: <b>Sell Limit</b> if the entry is <b>above</b> current price (Buy Limit if below, for a buy).</li><li>Price: the signal's entry price. Add SL and TP.</li><li>Confirm. The order triggers by itself if price gets there.</li></ol>
<div class="box warn"><b class="t">Price already ran far?</b>If price has already covered a good part of the way to TP, <b>don't chase it</b>. Your ratio would be poor. A missed signal is not a loss.</div>`}},
{t:{fr:"Suivre le signal jusqu'au bout",en:"Following the signal to the end"},s:{fr:"TP1 HIT, break-even, SL touché.",en:"TP1 HIT, break-even, SL hit."},
b:{fr:`<table><tr><th>Message dans le groupe</th><th>Ce que tu fais</th></tr>
<tr><td>« TP1 HIT ✅ +50 pips »</td><td>Ferme une partie si tu suis les TP partiels, et/ou mets ton SL au prix d'entrée.</td></tr>
<tr><td>« SL au BE »</td><td>Modifie ton SL au prix d'entrée : le trade ne peut plus perdre.</td></tr>
<tr><td>« TP2 / TP3 HIT »</td><td>Le reste se ferme automatiquement si ton TP est placé. Sinon, ferme.</td></tr>
<tr><td>« On ferme »</td><td>Le coach voit un danger (annonce, retournement) : ferme manuellement.</td></tr>
<tr><td>« SL touché ❌ »</td><td>Rien à faire : ton Stop Loss a joué son rôle. Note-le dans ton journal.</td></tr></table>
<div class="box tip"><b class="t">Bien vivre un SL</b>Un SL fait partie du métier. Un trader avec un ratio de 1:3 peut perdre 2 trades sur 3 et rester gagnant. Ce qui serait grave, c'est de ne pas avoir de SL.</div>`,
en:`<table><tr><th>Group message</th><th>What you do</th></tr>
<tr><td>"TP1 HIT ✅ +50 pips"</td><td>Close part if you use partial TPs, and/or move your SL to entry.</td></tr>
<tr><td>"SL to BE"</td><td>Move your SL to the entry price: the trade can no longer lose.</td></tr>
<tr><td>"TP2 / TP3 HIT"</td><td>The rest closes automatically if your TP is set. Otherwise, close it.</td></tr>
<tr><td>"We're closing"</td><td>The coach sees danger (news, reversal): close manually.</td></tr>
<tr><td>"SL hit ❌"</td><td>Nothing to do: your Stop Loss did its job. Log it in your journal.</td></tr></table>
<div class="box tip"><b class="t">Living with a SL</b>A SL is part of the job. A trader with a 1:3 ratio can lose 2 trades out of 3 and stay profitable. What would be serious is having no SL.</div>`}}
]},
{t:{fr:"Exercices pratiques",en:"Practical exercises"},d:{fr:"Passer de la théorie à l'action.",en:"Turn theory into action."},
lessons:[
{t:{fr:"Exercice 1 : ton premier top-down",en:"Exercise 1: your first top-down"},s:{fr:"Sur TradingView, à envoyer au coach.",en:"On TradingView, to send to the coach."},
b:{fr:`<div class="check" data-k="ex1">
<label><input type="checkbox"> J'ai créé mon compte TradingView et réglé le fuseau horaire sur UTC.</label>
<label><input type="checkbox"> J'ai ajouté XAUUSD, EURUSD, GBPUSD et DXY à ma liste de surveillance.</label>

 const c=COURSE.find(x=>x.n==n);if(!c)return home();
 const chapters=c.chapters.map((ch,ci)=>`<section class="chap"><div class="chap-h"><span class="num">${ci+1}</span><div><h3>${ch.t[LANG]}</h3><p>${ch.d[LANG]}</p></div></div>
  <ol>${ch.lessons.map(x=>`<li class="${DONE[x.id]?'done':''}"><a href="#/lesson/${x.id}">${x.t[LANG]}</a><p>${x.s[LANG]}</p></li>`).join('')}</ol></section>`).join('');
 return `<div class="wrap"><div class="lvhead">${badge(c.icon)}<div><small style="color:var(--muted)">${T('level')} ${c.n} ${T('of')} ${COURSE.length}</small><h1>${c.t[LANG]}</h1><p>${c.d[LANG]}</p><a class="btn" href="#/lesson/${c.lessons[0].id}">${T('startLv')} →</a></div></div>
 <div class="grid2"><div class="prog"><h4>${T('progress')}</h4><div class="pct">${pct(c)}%</div><div class="bar"><i style="width:${pct(c)}%"></i></div><p style="color:var(--muted);font-size:14px;margin-top:8px">${c.lessons.filter(x=>DONE[x.id]).length} / ${c.lessons.length} ${T('lessons')}${BEST[c.n]!=null?` · quiz ${BEST[c.n]}%`:''}</p>
 <nav class="toc">${c.chapters.map((ch,ci)=>`<a href="#/lesson/${ch.lessons[0].id}">${ci+1}. ${ch.t[LANG]}</a>`).join('')}<a href="#/quiz/${c.n}">📝 ${T('quiz')}</a></nav></div>
 <div class="outline"><h4>${T('outline')}</h4>${chapters}<a class="btn" href="#/quiz/${c.n}">${T('quizGo')}</a></div></div>${cta()}</div>`;
}
function lesson(id){
 const i=all.findIndex(x=>x.id==id);if(i<0)return home();const x=all[i],p=all[i-1],nx=all[i+1];
 const last=!nx||nx.lv.n!==x.lv.n;
 return `<div class="wrap"><article class="lesson"><div class="crumb"><a href="#/">${T('home')}</a> › <a href="#/level/${x.lv.n}">${T('level')} ${x.lv.n} · ${x.lv.t[LANG]}</a> › ${CHW[LANG]} ${x.chi} · ${x.ch.t[LANG]}</div>
 <h1>${x.t[LANG]}</h1><p class="lead">${x.s[LANG]}</p>${x.b[LANG]}
 <button class="btn ${DONE[x.id]?'ghost':''} done-btn" onclick="toggleDone('${x.id}')">${DONE[x.id]?T('isDone'):T('markDone')}</button>
 <div class="pager">${p?`<a class="btn ghost sm" href="#/lesson/${p.id}">${T('prev')}</a>`:`<span></span>`}${last?`<a class="btn sm" href="#/quiz/${x.lv.n}">📝 ${T('quiz')} →</a>`:`<a class="btn sm" href="#/lesson/${nx.id}">${T('next')}</a>`}</div>
 </article>${cta()}</div>`;
}

/* ----- Quiz, examen, certificat ----- */
let QZ=null;
function quizView(qs,title,sub,key){
 QZ={qs,ans:{},key};
 return `<div class="wrap"><article class="lesson quiz"><div class="crumb"><a href="#/">${T('home')}</a> › ${title}</div><h1>${title}</h1><p class="lead">${sub}</p>
 ${qs.map((q,k)=>`<div class="q" id="q${k}"><b>${k+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button class="opt" onclick="pick(${k},${j})">${o}</button>`).join('')}<div class="exp"></div></div>`).join('')}
 <div id="qres"></div></article></div>`;
}
function pick(k,j){if(!QZ||QZ.ans[k]!=null)return;QZ.ans[k]=j;const q=QZ.qs[k],el=document.getElementById('q'+k),bs=el.querySelectorAll('.opt');
 bs[q[2]].classList.add('ok');if(j!=q[2])bs[j].classList.add('ko');el.querySelector('.exp').textContent=(j==q[2]?'✅ ':'❌ ')+q[3];
 const n=Object.keys(QZ.ans).length;if(n<QZ.qs.length)return;
 const good=QZ.qs.filter((q,i)=>QZ.ans[i]==q[2]).length,sc=Math.round(100*good/QZ.qs.length),r=document.getElementById('qres');
 if(QZ.key=='exam'){r.innerHTML=`<div class="cta"><h3>${T('result')}</h3><div class="score">${sc}%</div><p>${sc>=70?T('pass'):T('fail')}</p>${sc>=70?`<input class="search" id="cname" placeholder="${T('name')}" maxlength="40"><button class="btn" onclick="makeCert(${sc})">${T('gen')}</button><div id="certbox"></div>`:`<a class="btn" href="#/exam" onclick="setTimeout(render,0)">${T('retry')}</a>`}</div>`}
 else{BEST[QZ.key]=Math.max(BEST[QZ.key]||0,sc);store.set('sfx_best',BEST);const nl=COURSE.find(c=>c.n==+QZ.key+1);
  r.innerHTML=`<div class="cta"><h3>${T('result')}</h3><div class="score">${sc}%</div><div class="row"><a class="btn ghost" href="#/quiz/${QZ.key}" onclick="setTimeout(render,0)">${T('retry')}</a>${nl?`<a class="btn" href="#/level/${nl.n}">${T('next2')}</a>`:`<a class="btn" href="#/exam">🎓 ${T('exam')}</a>`}</div></div>`}
 r.scrollIntoView({behavior:'smooth'})}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function quizPage(n){const c=COURSE.find(x=>x.n==n);if(!c)return home();return quizView(QUIZ[n][LANG],`${T('quiz')} · ${T('level')} ${n}`,`${c.t[LANG]} — ${T('quizT')}`,String(n))}
function examPage(){const pool=Object.keys(QUIZ).flatMap(k=>QUIZ[k][LANG]);return quizView(shuffle(pool).slice(0,20),'🎓 '+T('exam'),T('examP'),'exam')}
function makeCert(sc){const nm=(document.getElementById('cname').value||'').trim()||'—';const cv=document.createElement('canvas');cv.width=1600;cv.height=1130;cv.className='cert';const g=cv.getContext('2d');
 const bg=g.createLinearGradient(0,0,1600,1130);bg.addColorStop(0,'#1b1206');bg.addColorStop(1,'#050300');g.fillStyle=bg;g.fillRect(0,0,1600,1130);
 g.strokeStyle='#f5b301';g.lineWidth=10;g.strokeRect(40,40,1520,1050);g.lineWidth=2;g.strokeRect(62,62,1476,1006);
 g.textAlign='center';g.fillStyle='#f5b301';g.beginPath();g.arc(800,185,62,0,7);g.fill();g.fillStyle='#2a1a00';g.font='900 70px Arial';g.fillText('S',800,210);
 g.fillStyle='#fff';g.font='900 54px Arial';g.fillText('SERGIO FX ACADÉMIE',800,320);
 g.fillStyle='#ffd84d';g.font='700 34px Arial';g.fillText(LANG=='fr'?'CERTIFICAT DE RÉUSSITE':'CERTIFICATE OF COMPLETION',800,385);
 g.fillStyle='#c9b88f';g.font='28px Arial';g.fillText(LANG=='fr'?'Ce certificat est décerné à':'This certificate is awarded to',800,480);
 g.fillStyle='#fff';g.font='italic 800 78px Georgia';g.fillText(nm,800,580);g.fillStyle='#f5b301';g.fillRect(450,610,700,3);
 g.fillStyle='#e9dfc6';g.font='28px Arial';g.fillText(LANG=='fr'?'pour avoir terminé la formation d\'initiation au trading Forex & Or':'for completing the Forex & Gold trading foundation course',800,680);
 g.fillText((LANG=='fr'?'Score à l\'examen final : ':'Final exam score: ')+sc+' %',800,730);
 g.fillStyle='#c9b88f';g.font='24px Arial';g.fillText(new Date().toLocaleDateString(LANG=='fr'?'fr-FR':'en-GB',{day:'numeric',month:'long',year:'numeric'}),800,850);
 g.font='20px Arial';g.fillText(LANG=='fr'?'Contenu éducatif – le trading comporte des risques de perte en capital.':'Educational content – trading involves a risk of capital loss.',800,1010);
 const box=document.getElementById('certbox');box.innerHTML='';box.appendChild(cv);const a=document.createElement('a');a.className='btn';a.textContent=T('dl');a.download='certificat-sergio-fx.png';a.href=cv.toDataURL('image/png');box.appendChild(a)}

/* ----- Glossaire ----- */
function glossPage(){return `<div class="wrap"><article class="lesson"><div class="crumb"><a href="#/">${T('home')}</a> › ${T('gloss')}</div><h1>📖 ${T('gloss')}</h1><p class="lead">${T('glossP')}</p>
 <input class="search" id="gs" placeholder="${T('searchP')}" oninput="filterGloss(this.value)"><div class="gl" id="gl">${GLOSS.map(g=>`<div data-s="${(g[0]+' '+g[1]+' '+g[2]).toLowerCase()}"><b>${g[0]}</b> — ${LANG=='fr'?g[1]:g[2]}</div>`).join('')}</div></article></div>`}
function filterGloss(v){v=v.toLowerCase();document.querySelectorAll('#gl>div').forEach(d=>d.style.display=d.dataset.s.includes(v)?'':'none')}

/* ----- Cases à cocher (exercices, checklists) ----- */
function wireChecks(){document.querySelectorAll('.check').forEach(box=>{const k='chk_'+box.dataset.k,st=store.get(k,[]),ins=[...box.querySelectorAll('input')],res=box.nextElementSibling;
 const upd=()=>{if(res&&res.classList.contains('checkres'))res.textContent=`${ins.filter(i=>i.checked).length} / ${ins.length} ${T('checked')}`};
 ins.forEach((inp,i)=>{inp.checked=!!st[i];inp.onchange=()=>{const s=ins.map(x=>x.checked);store.set(k,s);upd()}});upd()})}

function toggleDone(id){DONE[id]=!DONE[id];if(!DONE[id])delete DONE[id];store.set('sfx_done',DONE);render()}
function render(){
 const h=location.hash.replace('#','')||'/';const [,a,b]=h.split('/');
 document.documentElement.lang=LANG;
 const nv=T('nav'),links=`<a href="#/">${nv[0]}</a><a href="#/glossaire">${nv[1]}</a><a href="#/exam">${nv[2]}</a>`;
 document.getElementById('navl').innerHTML=links;document.getElementById('mnav').innerHTML=links;
 document.getElementById('app').innerHTML=a=='level'?level(b):a=='lesson'?lesson(b):a=='quiz'?quizPage(b):a=='exam'?examPage():a=='glossaire'?glossPage():home();
 document.getElementById('disc').textContent=T('disc');
 document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x.dataset.l==LANG));
 wireChecks();
}
document.querySelectorAll('.lang button').forEach(x=>x.onclick=()=>{LANG=x.dataset.l;store.set('sfx_lang2',LANG);render()});
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});
const thB=document.getElementById('theme');const setTh=()=>{thB.textContent=document.documentElement.dataset.theme=='light'?'🌙':'☀️'};setTh();
thB.onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme=='light'?'dark':'light';try{localStorage.setItem('sfx_theme',d.dataset.theme)}catch(e){};setTh()};
document.getElementById('yr').textContent=new Date().getFullYear();
render();
</script>
</body>
</html>
